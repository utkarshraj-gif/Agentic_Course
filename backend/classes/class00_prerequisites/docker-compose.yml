version: '3.8'

services:
  # Redis: State Checkpointer & Long-Term Memory (Class 6 & Capstones)
  redis:
    image: redis:7-alpine
    container_name: agentic_course_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Chroma DB: Persistent Local Vector Store (Class 4 & Capstones)
  chromadb:
    image: chromadb/chroma:0.5.4
    container_name: agentic_course_chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # OpenTelemetry Collector: Agent Trajectory & Latency Tracing (Class 11)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: agentic_course_otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
