<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07d2e0"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07d2e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#07d2e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Background with rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Subtle glow core -->
  <circle cx="32" cy="30" r="18" fill="url(#glow)"/>

  <!-- Graduation Cap diamond canopy -->
  <path d="M32 14 L53 24.5 L32 35 L11 24.5 Z" fill="url(#neon)" filter="url(#glow-blur)"/>

  <!-- Cap under-structure -->
  <path d="M21 31 L21 40.5 C21 45 43 45 43 40.5 L43 31" fill="none" stroke="url(#neon)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tassel ribbon & bead -->
  <path d="M48 27 L50 38.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="50" cy="40.5" r="2" fill="#ffffff"/>

  <!-- Central Agent Core Pulse -->
  <circle cx="32" cy="24.5" r="3.2" fill="#ffffff"/>
  <circle cx="32" cy="24.5" r="5.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
</svg>