or i, s in enumerate(result[\"steps\"], 1):\n        res = s[\"result\"]\n        brief = res.get(\"error\") or {k: v for k, v in res.items() if k != \"series\"}\n        print(f\"{i}. {s['tool']}({s['args']})\\n   -> {json.dumps(brief)[:220]}\")\n    print(\"\\n\" + result[\"answer\"])\n\n\nif __name__ == \"__main__\":\n    main(auto_approve=\"--approve\" in sys.argv or not sys.stdin.isatty())\n"}, {"name": "ops_tools.py", "lang": "python", "code": "\"\"\"Class 5 - AIOps tools designed for LLMs.\n\nDesign rules applied to every tool below:\n  1. One job per tool, named as a verb_noun the model can guess (get_metric, search_logs).\n  2. Typed, constrained arguments (Literal enums) - the schema *is* the documentation.\n  3. Docstrings say WHEN to use the tool and what it returns, with units.\n  4. Outputs are small, pre-summarised JSON - never dump 10k log lines into the context.\n  5. Errors are actionable text (\"valid metrics are ...\") so the model can self-correct.\n  6. Side effects are marked (risk=\"write\") and gated behind human approval.\n  7. Idempotency keys on writes, so a retried call never restarts a service twice.\n\nCompare with the anti-pattern at the bottom (`run_anything`).\n\"\"\"\nfrom __future__ import annotations\n\nimport statistics\nfrom typing import Literal\n\nfrom common.domain import load_telemetry\nfrom common.tools import tool\n\nService = Literal[\"checkout-api\", \"payments-svc\", \"inventory-svc\", \"postgres-payments\",\n                  \"redis-cache\", \"batch-worker\"]\n\n_EXECUTED: dict[str, dict] = {}   # idempotency store\n\n\n@tool()\ndef get_metric(service: Service, metric: str) -> dict:\n    \"\"\"Get a summary of one metric for a service over the last hour (5-minute points).\n    Use first when an alert fires, to see when and how much a signal changed.\n    Returns baseline (first half mean), current (last point), change_ratio and the series.\"\"\"\n    m = load_telemetry()[\"metrics\"][service]\n    if metric not in m:\n        raise ValueError(f\"unknown metric '{metric}' for {service}; valid metrics: {sorted(m)}\")\n    s = m[metric]\n    base = statistics.mean(s[: len(s) // 2])\n    return {\"service\": service, \"metric\": metric, \"baseline\": round(base, 2), \"current\": s[-1],\n            \"change_ratio\": round(s[-1] / base, 2) if base else None,\n            \"changed_at\": _change_point(s), \"series\": s}\n\n\n@tool()\ndef search_logs(service: Service, level: Literal[\"ERROR\", \"WARN\", \"INFO\"] = \"ERROR\",\n                contains: str = \"\", limit: int = 5) -> dict:\n    \"\"\"Search recent logs for a service by level and optional substring. Returns the count and\n    up to `limit` distinct messages (deduplicated) - use to find the error signature.\"\"\"\n    logs = [l for l in load_telemetry()[\"logs\"]\n            if l[\"service\"] == service and l[\"level\"] == level and contains.lower() in l[\"msg\"].lower()]\n    distinct = list(dict.fromkeys(l[\"msg\"] for l in logs))\n    return {\"service\": service, \"level\": level, \"count\": len(logs), \"samples\": distinct[:limit]}\n\n\n@tool()\ndef get_recent_deploys(service: Service, hours: int = 24) -> dict:\n    \"\"\"List deployments for a service in the last `hours`, newest first, with the change summary.\n    Use to test the hypothesis 'a recent change caused this'.\"\"\"\n    ds = [d for d in load_telemetry()[\"deploys\"] if d[\"service\"] == service]\n    return {\"service\": service, \"deploys\": sorted(ds, key=lambda d: d[\"ts\"], reverse=True)}\n\n\n@tool(risk=\"write\")\ndef rollback_deployment(service: Service, to_version: str, reason: str, idempotency_key: str) -> dict:\n    \"\"\"Roll a service back to a previous version via the deploy pipeline. SIDE EFFECT - requires\n    human approval. Only use after evidence links a specific deploy to the incident.\"\"\"\n    if idempotency_key in _EXECUTED:\n        return {**_EXECUTED[idempotency_key], \"note\": \"duplicate request ignored (idempotent)\"}\n    result = {\"service\": service, \"rolled_back_to\": to_version, \"status\": \"submitted\", \"reason\": reason}\n    _EXECUTED[idempotency_key] = result\n    return result\n\n\ndef _change_point(s: list[float]) -> int | None:\n    \"\"\"Index of the largest step change (simple, explainable change-point detection).\"\"\"\n    diffs = [abs(s[i] - s[i - 1]) for i in range(1, len(s))]\n    i = max(range(len(diffs)), key=diffs.__getitem__)\n    return i + 1 if diffs[i] > 0.25 * (abs(statistics.mean(s)) or 1) else None\n\n\nOPS_TOOLS = [get_metric, search_logs, get_recent_deploys, rollback_deployment]\n\n\n# ----------------------------------------------------------------------------- anti-pattern\ndef run_anything(command: str) -> str:\n    \"\"\"Runs any shell or SQL command.   <- untyped, unbounded, unauditable, un-gateable.\n    Never give an agent a tool like this in production.\"\"\"\n    raise NotImplementedError\n"}], "folder": "classes/class05_tool_engineering"}, "6": {"title": "Class 6 — Memory in Agents and the Model Context Protocol", "meta": {"week": "Week 3 · Tools & Memory", "tools": ["MCP (Python SDK / FastMCP)", "LangGraph checkpointer", "LangMem", "Redis"], "domain": "AIOps tool server; clinical documentation assistant"}, "html": "<h2 id=\"s0\">Learning objectives<\/h2>\n<ul>\n<li>Distinguish short-term (thread) memory, episodic memory, and semantic memory, and choose a store for each.<\/li>\n<li>Implement the memory write path (extract, deduplicate, store) and read path (recall by relevance, recency, and importance).<\/li>\n<li>Isolate memory by namespace (user, patient, tenant) and support \"forget me\".<\/li>\n<li>Expose tools, resources, and prompts through an MCP server, and consume them from an MCP client.<\/li>\n<li>Decide what should be an MCP server and what should stay in-process.<\/li>\n<\/ul>\n<h2 id=\"s1\">Key concepts: memory<\/h2>\n<p><strong>Short-term memory<\/strong> is the state of one conversation or task. In LangGraph it is the graph state, saved after every step by a <em>checkpointer<\/em> keyed by <code>thread_id<\/code>. Use <code>MemorySaver<\/code> in development and Redis or Postgres checkpointers in production. This is what lets an interrupted incident or prior-auth review resume later.<\/p>\n<p><strong>Long-term memory<\/strong> outlives threads:<\/p>\n<ul>\n<li><em>Semantic<\/em>: durable facts and preferences (\"Dr. Rao prefers bullets, policy ID first\").<\/li>\n<li><em>Episodic<\/em>: summaries of past sessions (\"Reviewed PA-1001; waiting for PT dates\").<\/li>\n<li><em>Procedural<\/em>: learned instructions, such as prompt updates proposed from feedback.<\/li>\n<\/ul>\n<p><strong>Write path.<\/strong> Extract candidate memories, either with an LLM or with LangMem's <code>create_memory_manager<\/code>. Deduplicate and merge near-duplicates (the <code>MemoryStore<\/code> here uses a similarity above 0.92). Attach importance and a timestamp. Never store what the policy forbids (for example raw PHI in a general store).<\/p>\n<p><strong>Read path.<\/strong> Score = similarity + recency decay + importance. Keep k small, since injecting too much memory drowns the actual task.<\/p>\n<p><strong>Isolation and governance.<\/strong> Namespace every key (<code>prefs:{user}<\/code>, <code>patient:{mrn_hash}<\/code>). Enforce the namespace server-side. Provide <code>forget(namespace)<\/code> for data-subject requests, and set a retention period.<\/p>\n<h2 id=\"s2\">Key concepts: MCP<\/h2>\n<p><strong>The problem.<\/strong> Every agent framework has its own tool format, so N agents × M systems means N×M integrations. MCP is an open protocol (JSON-RPC over stdio or streamable HTTP) that turns this into N+M: a system exposes one MCP server, and any MCP-capable host can use it.<\/p>\n<p><strong>Primitives.<\/strong> <em>Tools<\/em> are model-invoked functions with JSON schemas. <em>Resources<\/em> are read-only content addressed by URI (<code>runbook://db-connection-pool-exhaustion<\/code>). <em>Prompts<\/em> are reusable templates (<code>incident_triage<\/code>). The host also controls <em>sampling<\/em> and <em>roots<\/em>.<\/p>\n<p><strong>Lifecycle.<\/strong> The client launches or connects to the server, calls <code>initialize<\/code>, then <code>list_tools<\/code>, <code>list_resources<\/code> and <code>list_prompts<\/code>. It passes the tool schemas to the LLM, proxies <code>call_tool<\/code>, and returns the results to the model.<\/p>\n<p><strong>Security.<\/strong> Expose least privilege (this server deliberately omits <code>rollback_deployment<\/code>). Authenticate HTTP servers with OAuth. Treat tool descriptions from third-party servers as untrusted, because they can carry prompt injection. Pin server versions.<\/p>\n<h2 id=\"s3\">Worked examples<\/h2>\n<ul>\n<li><code>mcp_server.py<\/code> wraps the Class 5 read-only AIOps tools, the runbooks (as resources), and a triage prompt in a FastMCP server.<\/li>\n<li><code>mcp_client.py<\/code> launches the server over stdio, discovers everything, calls two tools, reads a runbook, and renders the prompt.<\/li>\n<li><code>memory_demo.py<\/code> shows a LangGraph chat with checkpointed threads plus a <code>MemoryStore<\/code> for preferences and episodes, with per-clinician isolation.<\/li>\n<\/ul>\n<h2 id=\"s4\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s5\">Process flow<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s6\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m classes.class06_memory_mcp.mcp_client        # starts the server itself over stdio\npython -m classes.class06_memory_mcp.mcp_server --http  # or serve on :8765 for other hosts\npython -m classes.class06_memory_mcp.memory_demo\nREDIS_URL=redis://localhost:6379 python -m classes.class06_memory_mcp.memory_demo   # durable memory\n<\/code><\/pre>\n<p>To add the server to an MCP host such as Claude Desktop, register the command <code>python -m classes.class06_memory_mcp.mcp_server<\/code> with the repository root as the working directory.<\/p>\n<h2 id=\"s7\">Lab<\/h2>\n<ol>\n<li>Add a <code>list_services<\/code> tool that returns the topology, and let the client print the dependency tree.<\/li>\n<li>Use <code>langchain-mcp-adapters<\/code> to load the MCP tools into the Class 5 LangGraph agent.<\/li>\n<li>Implement <code>forget(\"prefs:dr-rao\")<\/code> behind an admin-only API and write a test that proves the memories are gone.<\/li>\n<li>Add a 90-day retention policy: memories older than the policy are skipped in <code>recall<\/code>.<\/li>\n<\/ol>\n<h2 id=\"s8\">Key takeaways<\/h2>\n<ul>\n<li>Checkpointed state is what makes an agent resumable; long-term memory is what makes it personal.<\/li>\n<li>Namespaces plus server-side enforcement prevent memory leaking between users or patients.<\/li>\n<li>MCP turns integrations into reusable, discoverable servers, so expose the least privilege.<\/li>\n<\/ul>", "diagrams": ["flowchart LR\n    subgraph Host [Agent host]\n        AG[Agent / LangGraph] --> MC[MCP client]\n        AG --> CP[(Checkpointer<br/>thread state)]\n        AG --> MM[Memory manager<br/>extract · dedupe · recall]\n        MM --> LTM[(Long-term store<br/>Redis · namespaces)]\n    end\n    MC <-->|JSON-RPC<br/>stdio / HTTP| S1[MCP server: ops-tools<br/>tools · resources · prompts]\n    MC <-->|JSON-RPC| S2[MCP server: ticketing]\n    S1 --> T[(Metrics · Logs · Deploys)]\n    S1 --> RB[(Runbooks)]", "sequenceDiagram\n    participant H as Agent host\n    participant S as MCP server\n    participant M as Memory store\n    H->>S: initialize\n    H->>S: tools/list, resources/list, prompts/list\n    S-->>H: schemas + URIs\n    Note over H: user turn arrives\n    H->>M: recall(namespace, query)\n    M-->>H: top-k preferences + episodes\n    H->>H: LLM chooses tool\n    H->>S: tools/call get_metric\n    S-->>H: result\n    H->>M: add(extracted preferences)\n    H->>H: checkpoint thread state"], "toc": ["Learning objectives", "Key concepts: memory", "Key concepts: MCP", "Worked examples", "Architecture", "Process flow", "Run it", "Lab", "Key takeaways"], "short": "Memory in Agents and the Model Context Protocol", "files": [{"name": "mcp_client.py", "lang": "python", "code": "\"\"\"Class 6 - An MCP client: discover and use the ops-tools server over stdio.\n\nThe client launches the server as a subprocess, performs the MCP handshake, lists what the\nserver offers and calls a tool - exactly what an agent host does before handing the tool\nschemas to its LLM.\n\nRun:  python -m classes.class06_memory_mcp.mcp_client\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport sys\n\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nfrom common import ROOT\n\nSERVER = StdioServerParameters(command=sys.executable,\n                               args=[\"-m\", \"classes.class06_memory_mcp.mcp_server\"], cwd=str(ROOT))\n\n\nasync def main() -> None:\n    async with stdio_client(SERVER) as (read, write):\n        async with ClientSession(read, write) as session:\n            info = await session.initialize()\n            print(f\"connected to MCP server: {info.serverInfo.name}\\n\")\n\n            tools = await session.list_tools()\n            print(\"tools:\")\n            for t in tools.tools:\n                print(f\"  - {t.name}: {t.description.splitlines()[0]}\")\n\n            resources = await session.list_resources()\n            templates = await session.list_resource_templates()\n            print(\"resources:\", [str(r.uri) for r in resources.resources],\n                  \"templates:\", [t.uriTemplate for t in templates.resourceTemplates])\n            prompts = await session.list_prompts()\n            print(\"prompts:\", [p.name for p in prompts.prompts], \"\\n\")\n\n            # These schemas are what you would pass to the LLM as function definitions.\n            schema = {t.name: t.inputSchema for t in tools.tools}\n            print(\"input schema for get_metric:\", json.dumps(schema[\"get_metric\"])[:200], \"…\\n\")\n\n            res = await session.call_tool(\"get_metric\", {\"service\": \"payments-svc\", \"metric\": \"error_rate_pct\"})\n            print(\"call get_metric ->\", res.content[0].text[:200])\n            res = await session.call_tool(\"search_logs\", {\"service\": \"payments-svc\", \"limit\": 1})\n            print(\"call search_logs ->\", res.content[0].text[:200])\n\n            rb = await session.read_resource(\"runbook://db-connection-pool-exhaustion\")\n            print(\"\\nread runbook ->\", rb.contents[0].text.splitlines()[4])\n\n            p = await session.get_prompt(\"incident_triage\", {\"service\": \"payments-svc\", \"symptom\": \"5xx spike\"})\n            print(\"prompt ->\", p.messages[0].content.text[:120], \"…\")\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"name": "mcp_server.py", "lang": "python", "code": "\"\"\"Class 6 - An MCP server that exposes the AIOps tools, runbooks and a prompt.\n\nModel Context Protocol (MCP) standardises how agents discover and call tools, read resources\nand fetch prompt templates - any MCP client (Claude Desktop, Cursor, LangGraph via\nlangchain-mcp-adapters, your own agent) can use this server without custom glue.\n\nRun standalone (stdio):   python -m classes.class06_memory_mcp.mcp_server\nRun over HTTP:            python -m classes.class06_memory_mcp.mcp_server --http   (port 8765)\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom typing import Literal\n\nfrom mcp.server.fastmcp import FastMCP\n\nfrom common import DATA\nfrom classes.class05_tool_engineering import ops_tools as ops\n\nmcp = FastMCP(\"ops-tools\", port=8765, log_level=\"WARNING\")\n\nService = Literal[\"checkout-api\", \"payments-svc\", \"inventory-svc\", \"postgres-payments\",\n                  \"redis-cache\", \"batch-worker\"]\n\n\n# ----------------------------------------------------------------------------- tools (read-only)\n@mcp.tool()\ndef get_metric(service: Service, metric: str) -> dict:\n    \"\"\"Summary of one metric for a service over the last hour: baseline, current, change point.\"\"\"\n    out = ops.get_metric.fn(service=service, metric=metric)\n    out.pop(\"series\", None)\n    return out\n\n\n@mcp.tool()\ndef search_logs(service: Service, level: Literal[\"ERROR\", \"WARN\", \"INFO\"] = \"ERROR\",\n                contains: str = \"\", limit: int = 5) -> dict:\n    \"\"\"Deduplicated recent log messages for a service, filtered by level and substring.\"\"\"\n    return ops.search_logs.fn(service=service, level=level, contains=contains, limit=limit)\n\n\n@mcp.tool()\ndef get_recent_deploys(service: Service) -> dict:\n    \"\"\"Recent deployments for a service with change summaries, newest first.\"\"\"\n    return ops.get_recent_deploys.fn(service=service)\n\n# Note: rollback_deployment is deliberately NOT exposed. Write actions stay behind the\n# approval gate in the agent host - MCP servers should expose the least privilege needed.\n\n\n# ----------------------------------------------------------------------------- resources\n@mcp.resource(\"runbook://index\")\ndef runbook_index() -> str:\n    \"\"\"List of available runbook ids.\"\"\"\n    return \"\\n\".join(p.stem for p in sorted((DATA / \"aiops\" / \"runbooks\").glob(\"*.md\")))\n\n\n@mcp.resource(\"runbook://{runbook_id}\")\ndef runbook(runbook_id: str) -> str:\n    \"\"\"Full text of one runbook.\"\"\"\n    path = DATA / \"aiops\" / \"runbooks\" / f\"{runbook_id}.md\"\n    if not path.exists():\n        raise ValueError(f\"no runbook '{runbook_id}'\")\n    return path.read_text()\n\n\n# ----------------------------------------------------------------------------- prompts\n@mcp.prompt()\ndef incident_triage(service: str, symptom: str) -> str:\n    \"\"\"Standard triage prompt used by every on-call agent.\"\"\"\n    return (f\"Incident on {service}: {symptom}.\\n\"\n            \"1) Check error rate and latency. 2) Search ERROR logs. 3) Check deploys in the last 24h. \"\n            \"4) Name the most likely root cause with evidence. 5) Recommend a runbook. Do not execute writes.\")\n\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"streamable-http\" if \"--http\" in sys.argv else \"stdio\")\n"}, {"name": "memory_demo.py", "lang": "python", "code": "\"\"\"Class 6 - Short-term, episodic and semantic memory for a clinical documentation assistant.\n\n  * short-term : LangGraph checkpointer keyed by thread_id - the conversation survives across\n                 turns (and process restarts with a durable checkpointer such as Redis/Postgres).\n  * semantic   : durable user preferences extracted from conversation (\"I prefer bullets\").\n  * episodic   : a one-line summary of each finished session, recalled in later sessions.\n\nNamespaces isolate memories per clinician - Dr. Rao never sees Dr. Mehta's memories.\nMemoryStore uses Redis when REDIS_URL is set, otherwise an in-process dict.\n\nRun:  python -m classes.class06_memory_mcp.memory_demo\n\"\"\"\nfrom __future__ import annotations\n\nimport operator\nimport re\nfrom typing import Annotated, TypedDict\n\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.graph import END, START, StateGraph\n\nfrom common.llm import get_llm\nfrom common.memory import MemoryStore\n\nstore = MemoryStore()\n\n\nclass Chat(TypedDict):\n    user_id: str\n    messages: Annotated[list[dict], operator.add]\n\n\n# ----------------------------------------------------------------------------- memory extraction\nPREF_PATTERNS = [r\"\\bi prefer ([^.]+)\", r\"\\balways ([^.]+)\", r\"\\bremember that ([^.]+)\", r\"\\bplease never ([^.]+)\"]\n\n\ndef extract_memories(text: str) -> list[str]:\n    \"\"\"LangMem-style extraction. Online: ask the LLM for durable facts as JSON.\n    Offline: pattern rules for explicit preference statements.\"\"\"\n    def offline():\n        return \"\\n\".join(m.group(0).strip() for p in PREF_PATTERNS for m in re.finditer(p, text, re.I))\n    out = get_llm().chat(\n        \"Extract durable user preferences or facts worth remembering from this message, one per line. \"\n        f\"Return nothing if none.\\n\\n{text}\", fallback=offline)\n    return [line.strip(\"- \").strip() for line in out.splitlines() if line.strip()]\n\n\n# ----------------------------------------------------------------------------- the graph\ndef respond(state: Chat) -> dict:\n    uid = state[\"user_id\"]\n    last = state[\"messages\"][-1][\"content\"]\n    for fact in extract_memories(last):                       # write path\n        store.add(f\"prefs:{uid}\", fact, kind=\"preference\", importance=0.8)\n    prefs = store.recall(f\"prefs:{uid}\", last, k=3)            # read path\n    episodes = store.recall(f\"episodes:{uid}\", last, k=1)\n    history = len([m for m in state[\"messages\"] if m[\"role\"] == \"user\"])\n\n    def offline():\n        style = \" \".join(p.text for p in prefs) or \"no stored preferences\"\n        prev = f\" Last time: {episodes[0].text}\" if episodes else \"\"\n        return f\"(turn {history} in this thread · applying: {style}.{prev})\"\n\n    system = (\"You are a clinical documentation assistant. Apply these user preferences: \"\n              + \"; \".join(p.text for p in prefs) + \". Previous sessions: \" + \"; \".join(e.text for e in episodes))\n    reply = get_llm().chat([{\"role\": \"system\", \"content\": system}, *state[\"messages\"]], fallback=offline)\n    return {\"messages\": [{\"role\": \"assistant\", \"content\": reply}]}\n\n\ndef build():\n    g = StateGraph(Chat)\n    g.add_node(\"respond\", respond)\n    g.add_edge(START, \"respond\")\n    g.add_edge(\"respond\", END)\n    return g.compile(checkpointer=MemorySaver())\n\n\ndef say(app, thread: str, uid: str, text: str) -> str:\n    out = app.invoke({\"user_id\": uid, \"messages\": [{\"role\": \"user\", \"content\": text}]},\n                     {\"configurable\": {\"thread_id\": thread}})\n    reply = out[\"messages\"][-1][\"content\"]\n    print(f\"  [{uid} · {thread}] you: {text}\\n  {'':>{len(uid) + len(thread) + 5}}bot: {reply}\")\n    return reply\n\n\nif __name__ == \"__main__\":\n    app = build()\n    print(\"Session 1 - Dr. Rao states preferences (semantic memory is written)\")\n    say(app, \"t1\", \"dr-rao\", \"I prefer bullet-point summaries with the policy ID first.\")\n    say(app, \"t1\", \"dr-rao\", \"Summarise the MRI prior-auth criteria.\")\n    store.add(\"episodes:dr-rao\", \"Reviewed lumbar MRI criteria for PA-1001; pending PT dates.\", kind=\"episode\")\n\n    print(\"\\nShort-term memory: same thread continues, new thread starts empty\")\n    state = app.get_state({\"configurable\": {\"thread_id\": \"t1\"}}).values\n    print(f\"  thread t1 holds {len(state['messages'])} messages; \"\n          f\"thread t2 holds {len(app.get_state({'configurable': {'thread_id': 't2'}}).values.get('messages', []))}\")\n\n    print(\"\\nSession 2 (new thread) - long-term memory is recalled\")\n    say(app, \"t2\", \"dr-rao\", \"Draft the GLP-1 criteria summary for today's case.\")\n\n    print(\"\\nIsolation - another clinician gets none of Dr. Rao's memories\")\n    say(app, \"t3\", \"dr-mehta\", \"Summarise the knee arthroscopy criteria.\")\n\n    print(\"\\nStored memories:\", [(m.kind, m.text) for ns in (\"prefs:dr-rao\", \"episodes:dr-rao\") for m in store.list(ns)])\n"}], "folder": "classes/class06_memory_mcp"}, "7": {"title": "Class 7 — Evaluating your Agent", "meta": {"week": "Week 4 · Evaluation", "tools": ["LangSmith", "Opik", "a custom harness"], "domain": "Clinical RAG assistant; AIOps agent trajectories"}, "html": "<h2 id=\"s0\">Learning objectives<\/h2>\n<ul>\n<li>Build a golden dataset and choose metrics for each layer: retrieval, generation, tool use, and end-to-end task success.<\/li>\n<li>Run experiments, compare them, and gate releases on regressions (offline evaluation in CI).<\/li>\n<li>Evaluate agent <em>trajectories<\/em> (which tools, in what order, at what cost), not just final answers.<\/li>\n<li>Know when to use deterministic checks, heuristic metrics, LLM-as-judge (Class 8), or human review.<\/li>\n<li>Run the same evaluation on LangSmith or Opik for hosted datasets and experiment comparison.<\/li>\n<\/ul>\n<h2 id=\"s1\">Key concepts<\/h2>\n<p><strong>Why evals.<\/strong> Agent behaviour shifts with every prompt, model, or tool change. Without an evaluation set you are shipping on vibes. Evals are the unit tests of AI systems.<\/p>\n<p><strong>The eval stack.<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Question<\/th>\n<th>Example metrics<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Retrieval<\/td>\n<td>Did we fetch the right evidence?<\/td>\n<td>hit@k, recall@k, MRR<\/td>\n<\/tr>\n<tr>\n<td>Generation<\/td>\n<td>Is the answer correct and grounded?<\/td>\n<td>exact / contains, groundedness, citation validity<\/td>\n<\/tr>\n<tr>\n<td>Tool use<\/td>\n<td>Right tools, right arguments, right order?<\/td>\n<td>trajectory match, argument validity, forbidden-tool rate<\/td>\n<\/tr>\n<tr>\n<td>Task<\/td>\n<td>Did the user's job get done?<\/td>\n<td>task success, escalation rate, human override rate<\/td>\n<\/tr>\n<tr>\n<td>Operations<\/td>\n<td>Can we afford it?<\/td>\n<td>p50/p95 latency, tokens, cost per task<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Golden datasets.<\/strong> Start with 20–50 real, representative cases, including the hard ones and the ones that must be refused. Grow the set from production failures (Class 8). Version it like code.<\/p>\n<p><strong>Offline vs online evaluation.<\/strong> <em>Offline<\/em>: fixed dataset, run before release, gate in CI. <em>Online<\/em>: score live traffic (sampled judges, user feedback, business KPIs), and watch for drift.<\/p>\n<p><strong>Experiment discipline.<\/strong> Change one thing at a time, compare against a baseline, set a tolerance, and fail the build on regressions. Record the model, prompt version, and retriever configuration with each run.<\/p>\n<p><strong>Trajectory evaluation.<\/strong> For agents, check that required tools were called in order, that no forbidden or write tools were called without need, and step efficiency (expected steps ÷ actual steps). A correct answer reached through an unsafe path is still a failure.<\/p>\n<p><strong>LangSmith and Opik.<\/strong> Both offer hosted datasets, experiments linked to traces, side-by-side comparison, annotation queues, and online evaluators. The concepts map one to one onto <code>eval_harness.py<\/code>: Dataset, Target, Evaluators, Experiment, Compare.<\/p>\n<h2 id=\"s2\">Worked example<\/h2>\n<p>Part 1 compares two configurations of the clinical RAG assistant on 10 golden questions:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>baseline dense k=1<\/th>\n<th>hybrid + rerank k=3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>retrieval_hit<\/td>\n<td>0.9<\/td>\n<td>1.0<\/td>\n<\/tr>\n<tr>\n<td>correct<\/td>\n<td>0.6<\/td>\n<td>0.9<\/td>\n<\/tr>\n<tr>\n<td>citations_valid<\/td>\n<td>1.0<\/td>\n<td>1.0<\/td>\n<\/tr>\n<tr>\n<td>grounded<\/td>\n<td>1.0<\/td>\n<td>1.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The regression gate passes. One remaining wrong answer (HbA1c threshold) goes to Class 8's error analysis.<\/p>\n<p>Part 2 evaluates the Class 5 AIOps agent's trajectory. It used the required tools in order and found the root cause. Step efficiency is only 0.5 because of the recovered bad call and the extra metric checks, and that is exactly the kind of cost you want to see.<\/p>\n<h2 id=\"s3\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s4\">Process flow<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s5\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m classes.class07_evaluation.example\npython -m classes.class07_evaluation.vendor_integrations langsmith   # needs LANGSMITH_API_KEY\npython -m classes.class07_evaluation.vendor_integrations opik        # needs OPIK_API_KEY\n<\/code><\/pre>\n<h2 id=\"s6\">Lab<\/h2>\n<ol>\n<li>Add three \"should refuse\" questions (for example dosing advice) with a <code>refused<\/code> evaluator.<\/li>\n<li>Wire <code>compare()<\/code> into a pytest test so CI fails on regressions.<\/li>\n<li>Add token cost per question using <code>LLM.usage<\/code> and report cost per correct answer.<\/li>\n<li>Add a second incident to the trajectory dataset (the batch-worker disk alert) with its own expected tools.<\/li>\n<\/ol>\n<h2 id=\"s7\">Key takeaways<\/h2>\n<ul>\n<li>Evaluate every layer; retrieval failures pretend to be generation failures.<\/li>\n<li>For agents, the path matters as much as the answer.<\/li>\n<li>A regression gate turns evals from a report into a release control.<\/li>\n<\/ul>", "diagrams": ["flowchart LR\n    GD[(Golden dataset<br/>versioned)] --> R[Experiment runner]\n    CFG[Config under test<br/>model · prompt · retriever] --> R\n    R --> T[Target system<br/>RAG or agent]\n    T --> O[Outputs + traces]\n    O --> E1[Deterministic checks<br/>contains · citations · schema]\n    O --> E2[Heuristic metrics<br/>groundedness · hit@k]\n    O --> E3[LLM judge<br/>Class 8]\n    O --> E4[Trajectory evaluator]\n    E1 & E2 & E3 & E4 --> X[(Experiment store<br/>runs/ · LangSmith · Opik)]\n    X --> G{Regression gate<br/>vs baseline}\n    G -->|pass| D[Deploy]\n    G -->|fail| F[Block + report]", "flowchart TD\n    A[Collect 20-50 real cases] --> B[Write reference outputs / must-mention facts]\n    B --> C[Pick metrics per layer]\n    C --> D[Run baseline experiment]\n    D --> E[Change one thing]\n    E --> F[Run candidate experiment]\n    F --> G{Regression?}\n    G -->|yes| H[Inspect failing rows]\n    H --> E\n    G -->|no| I[Merge + update baseline]\n    I --> J[Sample production traces into dataset]\n    J --> D"], "toc": ["Learning objectives", "Key concepts", "Worked example", "Architecture", "Process flow", "Run it", "Lab", "Key takeaways"], "short": "Evaluating your Agent", "files": [{"name": "example.py", "lang": "python", "code": "\"\"\"Class 7 - Evaluate (1) the clinical RAG assistant and (2) the AIOps tool-using agent.\n\nPart 1 - RAG experiment: baseline (dense, k=1) vs candidate (hybrid + rerank, k=3) on the\n         10-question clinical golden set. Metrics: retrieval_hit, correct, citations_valid,\n         grounded, no_error, latency. A regression gate compares the two.\nPart 2 - Agent trajectory eval: did the Class 5 agent use the required tools in order, avoid\n         forbidden writes, and do it efficiently?\n\nRun:  python -m classes.class07_evaluation.example\n\"\"\"\nfrom __future__ import annotations\n\nfrom common import DATA\nfrom common.domain import load_clinical_golden\nfrom common.llm import get_llm\nfrom common.retrieval import (HybridRetriever, VectorIndex, chunk_markdown, extractive_answer,\n                              format_context, load_markdown_dir)\n\nfrom classes.class03_embeddings_rag.example import GROUNDED_PROMPT\n\nfrom .eval_harness import (as_table, citation_valid, compare, contains_reference, groundedness,\n                           retrieval_hit, run_experiment, trajectory_match)\n\nCHUNKS = [c for d, t in load_markdown_dir(DATA / \"clinical\" / \"guidelines\") for c in chunk_markdown(d, t, 700)]\n\n\ndef rag_target(retriever, k: int):\n    def target(ex: dict) -> dict:\n        results = retriever(ex[\"q\"], k)\n        ctx = format_context(results)\n        ans = get_llm().chat(GROUNDED_PROMPT.format(context=ctx, question=ex[\"q\"]),\n                             fallback=lambda: extractive_answer(ex[\"q\"], results, n=2))\n        return {\"answer\": ans, \"context\": ctx, \"source_ids\": [c.id for c, _ in results]}\n    return target\n\n\ndef part1() -> None:\n    dense, hybrid = VectorIndex(CHUNKS), HybridRetriever(CHUNKS)\n    gold = load_clinical_golden()\n    evaluators = [retrieval_hit, contains_reference, citation_valid, groundedness]\n    base = run_experiment(\"baseline_dense_k1\", gold, rag_target(lambda q, k: dense.search(q, k), 1), evaluators)\n    cand = run_experiment(\"hybrid_rerank_k3\", gold, rag_target(lambda q, k: hybrid.search(q, k), 3), evaluators)\n    print(as_table([base, cand]))\n    regs = compare(base, cand)\n    print(\"\\nregression gate:\", \"PASS\" if not regs else f\"FAIL {regs}\")\n    fails = [r for r in cand.rows if r[\"scores\"].get(\"correct\", 0) < 1]\n    print(f\"\\n{len(fails)} incorrect answers in candidate - these feed Class 8 error analysis:\")\n    for r in fails[:3]:\n        print(f\"  Q: {r['input']['q']}\\n     A: {r['output']['answer'][:160]}…\")\n\n\ndef part2() -> None:\n    from classes.class05_tool_engineering.example import build\n    from langgraph.types import Command\n\n    def agent_target(ex: dict) -> dict:\n        app = build()\n        cfg = {\"configurable\": {\"thread_id\": ex[\"id\"]}}\n        res = app.invoke({\"incident\": ex[\"incident\"], \"steps\": [], \"pending\": None, \"answer\": None}, cfg)\n        while \"__interrupt__\" in res:\n            res = app.invoke(Command(resume=\"approve\"), cfg)\n        return {\"answer\": res[\"answer\"], \"tool_calls\": [s[\"tool\"] for s in res[\"steps\"]]}\n\n    def root_cause(ex, out):\n        return {\"root_cause_found\": float(all(w in out[\"answer\"].lower() for w in ex[\"must_mention\"]))}\n\n    dataset = [{\"id\": \"INC-4471\", \"incident\": \"checkout-api 5xx error rate above 5% since 10:30 UTC\",\n                \"must_mention\": [\"v2.14.0\", \"pool\"]}]\n    exp = run_experiment(\"aiops_agent_trajectory\", dataset, agent_target,\n                         [trajectory_match([\"get_metric\", \"search_logs\", \"get_recent_deploys\"],\n                                           forbidden=[\"run_anything\"]), root_cause])\n    print(as_table([exp]))\n    print(\"tool path:\", \" -> \".join(exp.rows[0][\"output\"][\"tool_calls\"]))\n\n\nif __name__ == \"__main__\":\n    print(f\"LLM mode: {get_llm().mode}\\n\\n== Part 1: RAG experiments ==\")\n    part1()\n    print(\"\\n== Part 2: agent trajectory evaluation ==\")\n    part2()\n    print(\"\\nResults saved to runs/eval_*.json\")\n"}, {"name": "eval_harness.py", "lang": "python", "code": "\"\"\"Class 7 - A small, framework-agnostic evaluation harness.\n\nConcepts map 1:1 onto LangSmith / Opik:\n  Dataset (examples with inputs + reference outputs) -> Target (the system under test)\n  -> Evaluators (functions returning named scores) -> Experiment (results + aggregates)\n  -> Comparison / regression gate between two experiments.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport re\nimport statistics\nimport time\nfrom dataclasses import dataclass, field\nfrom typing import Callable\n\nfrom common import RUNS\nfrom common.retrieval import tokenize\n\nEvaluator = Callable[[dict, dict], dict[str, float]]   # (example, output) -> {metric: score}\n\n\n@dataclass\nclass Experiment:\n    name: str\n    rows: list[dict] = field(default_factory=list)\n\n    @property\n    def summary(self) -> dict[str, float]:\n        keys = sorted({k for r in self.rows for k in r[\"scores\"]})\n        out = {k: round(statistics.mean(r[\"scores\"][k] for r in self.rows if k in r[\"scores\"]), 3) for k in keys}\n        lat = sorted(r[\"latency_ms\"] for r in self.rows)\n        out[\"p50_latency_ms\"] = lat[len(lat) // 2]\n        out[\"p95_latency_ms\"] = lat[min(len(lat) - 1, int(0.95 * len(lat)))]\n        return out\n\n    def save(self) -> None:\n        RUNS.mkdir(exist_ok=True)\n        (RUNS / f\"eval_{self.name}.json\").write_text(json.dumps(\n            {\"name\": self.name, \"summary\": self.summary, \"rows\": self.rows}, indent=1, default=str))\n\n\ndef run_experiment(name: str, dataset: list[dict], target: Callable[[dict], dict],\n                   evaluators: list[Evaluator]) -> Experiment:\n    exp = Experiment(name)\n    for ex in dataset:\n        t0 = time.perf_counter()\n        try:\n            out, err = target(ex), None\n        except Exception as e:  # noqa: BLE001 - a crash is a scored failure, not a harness crash\n            out, err = {}, f\"{type(e).__name__}: {e}\"\n        latency = round((time.perf_counter() - t0) * 1000, 2)\n        scores: dict[str, float] = {\"no_error\": 0.0 if err else 1.0}\n        if not err:\n            for ev in evaluators:\n                scores.update(ev(ex, out))\n        exp.rows.append({\"input\": ex, \"output\": out, \"error\": err, \"scores\": scores, \"latency_ms\": latency})\n    exp.save()\n    return exp\n\n\ndef compare(base: Experiment, cand: Experiment, tolerance: float = 0.02) -> list[str]:\n    \"\"\"Regression gate: list metrics where the candidate is worse than baseline beyond tolerance.\"\"\"\n    regressions = []\n    for k, v in base.summary.items():\n        if \"latency\" in k:\n            continue\n        c = cand.summary.get(k)\n        if c is not None and c < v - tolerance:\n            regressions.append(f\"{k}: {v} -> {c}\")\n    return regressions\n\n\n# ----------------------------------------------------------------------------- reusable evaluators\ndef contains_reference(ex: dict, out: dict) -> dict:\n    ans = out.get(\"answer\", \"\").lower()\n    return {\"correct\": float(all(s.lower() in ans for s in ex[\"answer_contains\"]))}\n\n\ndef retrieval_hit(ex: dict, out: dict) -> dict:\n    return {\"retrieval_hit\": float(any(s.startswith(ex[\"relevant_doc\"]) for s in out.get(\"source_ids\", [])))}\n\n\ndef citation_valid(ex: dict, out: dict) -> dict:\n    cited = set(re.findall(r\"\\[([\\w\\-]+#\\d+)\\]\", out.get(\"answer\", \"\")))\n    ok = bool(cited) and cited <= set(out.get(\"source_ids\", []))\n    return {\"citations_valid\": float(ok)}\n\n\ndef groundedness(ex: dict, out: dict) -> dict:\n    \"\"\"Share of answer sentences whose content words mostly appear in the retrieved context.\n    A cheap proxy; Class 8 replaces it with an LLM judge.\"\"\"\n    ctx = set(tokenize(out.get(\"context\", \"\")))\n    sents = [s for s in re.split(r\"(?<=[.!?])\\s+\", re.sub(r\"\\[[^\\]]+\\]\", \"\", out.get(\"answer\", \"\"))) if len(s) > 10]\n    if not sents:\n        return {\"grounded\": 0.0}\n    ok = sum(len(set(tokenize(s)) & ctx) / max(1, len(set(tokenize(s)))) >= 0.6 for s in sents)\n    return {\"grounded\": ok / len(sents)}\n\n\ndef trajectory_match(expected_tools: list[str], forbidden: list[str] | None = None) -> Evaluator:\n    \"\"\"Agent evaluator: did it call the required tools in order, avoid forbidden ones, stay efficient?\"\"\"\n    def ev(ex: dict, out: dict) -> dict:\n        calls = [c for c in out.get(\"tool_calls\", [])]\n        it = iter(calls)\n        in_order = all(any(t == c for c in it) for t in expected_tools)\n        return {\"required_tools_in_order\": float(in_order),\n                \"no_forbidden_tools\": float(not set(forbidden or []) & set(calls)),\n                \"step_efficiency\": min(1.0, len(expected_tools) / max(1, len(calls)))}\n    return ev\n\n\ndef as_table(exps: list[Experiment]) -> str:\n    keys = list(dict.fromkeys(k for e in exps for k in e.summary))\n    lines = [f\"{'metric':<26}\" + \"\".join(f\"{e.name:>18}\" for e in exps)]\n    for k in keys:\n        lines.append(f\"{k:<26}\" + \"\".join(f\"{e.summary.get(k, '-'):>18}\" for e in exps))\n    return \"\\n\".join(lines)\n\n"}, {"name": "vendor_integrations.py", "lang": "python", "code": "\"\"\"Class 7 - Running the same evaluation on LangSmith and Opik.\n\nBoth platforms give you hosted datasets, experiment comparison UIs, trace-linked results and\nhuman annotation queues. The concepts are identical to eval_harness.py.\n\nLangSmith:  pip install langsmith   export LANGSMITH_API_KEY=... LANGSMITH_TRACING=true\nOpik:       pip install opik        export OPIK_API_KEY=...  (or `opik configure` for self-hosted)\n\nRun:  python -m classes.class07_evaluation.vendor_integrations langsmith|opik\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nfrom common.domain import load_clinical_golden\n\nfrom .example import CHUNKS, rag_target\nfrom common.retrieval import HybridRetriever\n\n\ndef target_fn():\n    hybrid = HybridRetriever(CHUNKS)\n    return rag_target(lambda q, k: hybrid.search(q, k), 3)\n\n\ndef run_langsmith() -> None:\n    from langsmith import Client, evaluate\n\n    client = Client()\n    name = \"clinical-policy-qa\"\n    if not client.has_dataset(dataset_name=name):\n        ds = client.create_dataset(name, description=\"Synthetic clinical policy golden set\")\n        client.create_examples(dataset_id=ds.id,\n                               inputs=[{\"q\": g[\"q\"]} for g in load_clinical_golden()],\n                               outputs=[{\"answer_contains\": g[\"answer_contains\"],\n                                         \"relevant_doc\": g[\"relevant_doc\"]} for g in load_clinical_golden()])\n    t = target_fn()\n\n    def correct(outputs: dict, reference_outputs: dict) -> bool:\n        return all(s.lower() in outputs[\"answer\"].lower() for s in reference_outputs[\"answer_contains\"])\n\n    def retrieval_hit(outputs: dict, reference_outputs: dict) -> bool:\n        return any(s.startswith(reference_outputs[\"relevant_doc\"]) for s in outputs[\"source_ids\"])\n\n    evaluate(lambda inputs: t({\"q\": inputs[\"q\"]}), data=name,\n             evaluators=[correct, retrieval_hit], experiment_prefix=\"hybrid-k3\")\n\n\ndef run_opik() -> None:\n    import opik\n    from opik.evaluation import evaluate\n    from opik.evaluation.metrics import Contains, base_metric, score_result\n\n    client = opik.Opik()\n    ds = client.get_or_create_dataset(\"clinical-policy-qa\")\n    ds.insert([{\"q\": g[\"q\"], \"reference\": g[\"answer_contains\"][0], \"relevant_doc\": g[\"relevant_doc\"]}\n               for g in load_clinical_golden()])\n    t = target_fn()\n\n    class RetrievalHit(base_metric.BaseMetric):\n        def score(self, source_ids, relevant_doc, **_):\n            return score_result.ScoreResult(name=\"retrieval_hit\",\n                                            value=float(any(s.startswith(relevant_doc) for s in source_ids)))\n\n    def task(item: dict) -> dict:\n        out = t({\"q\": item[\"q\"]})\n        return {\"output\": out[\"answer\"], \"source_ids\": out[\"source_ids\"], \"reference\": item[\"reference\"],\n                \"relevant_doc\": item[\"relevant_doc\"]}\n\n    evaluate(dataset=ds, task=task, scoring_metrics=[Contains(case_sensitive=False), RetrievalHit()],\n             experiment_name=\"hybrid-k3\")\n\n\nif __name__ == \"__main__\":\n    which = (sys.argv[1:] or [\"langsmith\"])[0]\n    need = {\"langsmith\": \"LANGSMITH_API_KEY\", \"opik\": \"OPIK_API_KEY\"}[which]\n    if not os.getenv(need):\n        print(f\"Set {need} to push this experiment to {which}. The offline harness is in example.py.\")\n        sys.exit(0)\n    run_langsmith() if which == \"langsmith\" else run_opik()\n"}], "folder": "classes/class07_evaluation"}, "8": {"title": "Class 8 — Error Analysis and LLM as Judge", "meta": {"week": "Week 4 · Evaluation", "tools": ["LangSmith / Opik annotation queues", "OpenAI (judge model)"], "domain": "Legal contract Q&A"}, "html": "<h2 id=\"s0\">Learning objectives<\/h2>\n<ul>\n<li>Run a structured error analysis: sample traces, open-code them, group codes into a taxonomy, then prioritise.<\/li>\n<li>Turn a failure taxonomy into a rubric-based LLM judge with structured, per-criterion verdicts.<\/li>\n<li>Align a judge with human labels: accuracy, Cohen's kappa, TPR and TNR, and read every disagreement.<\/li>\n<li>Recognise judge biases (position, verbosity, self-preference, leniency) and how to mitigate them.<\/li>\n<li>Close the loop: failures become dataset rows, rubric criteria, and guardrails.<\/li>\n<\/ul>\n<h2 id=\"s1\">Key concepts<\/h2>\n<p><strong>Error analysis comes before metrics.<\/strong> Generic metrics such as \"helpfulness\" rarely match what actually breaks. Read 30–100 real traces first. For each failure, write a short free-text note (<em>open coding<\/em>). Then cluster the notes into 5–8 failure modes (<em>axial coding<\/em>). Count them, weight by severity, and fix the top of the list.<\/p>\n<p><strong>A typical legal and clinical RAG taxonomy.<\/strong> Wrong document (cross-contract confusion), hallucinated value, missing or invalid citation, incomplete answer, contradiction of the source (for example reversed parties), and policy violation (giving advice or guarantees).<\/p>\n<p><strong>LLM as judge.<\/strong> A second model grades outputs against a rubric. It scales human judgement for nuanced criteria that string checks can't capture (completeness, contradiction). Design rules:<\/p>\n<ul>\n<li>Use binary PASS/FAIL per criterion, not 1–10 scales.<\/li>\n<li>Show the judge exactly what the system saw: question, context, and answer.<\/li>\n<li>Ask for the rationale before the verdict, use structured output, and set temperature to 0.<\/li>\n<li>Keep one criterion per concern, so failures are diagnosable.<\/li>\n<li>Use a strong model as judge, and preferably a different model family from the system being judged.<\/li>\n<\/ul>\n<p><strong>Alignment with humans.<\/strong> Hold out 50–100 human-labelled examples.<\/p>\n<ul>\n<li><em>Accuracy<\/em> can mislead when classes are imbalanced.<\/li>\n<li><em>Cohen's kappa<\/em> measures agreement beyond chance: above 0.6 is substantial, above 0.8 near-perfect.<\/li>\n<li><em>TPR<\/em> (the judge catches real failures) matters most for safety.<\/li>\n<li><em>TNR<\/em> (the judge doesn't flag good answers) controls noise.<\/li>\n<\/ul>\n<p>Iterate on the rubric until the disagreements you read are acceptable.<\/p>\n<p><strong>Biases.<\/strong> <em>Position<\/em>: in pairwise comparisons, swap A and B and average. <em>Verbosity<\/em>: longer answers get favoured, so penalise unsupported length. <em>Self-preference<\/em>: models favour their own family's outputs. <em>Leniency<\/em>: calibrate with borderline examples in the rubric.<\/p>\n<p><strong>Where deterministic checks win.<\/strong> Citations that point at retrieved ids, numbers present in the cited text, schema validity, and PII leaks should all be code, not judgement. Use the judge only for what code can't check.<\/p>\n<h2 id=\"s2\">Worked example<\/h2>\n<p><code>samples.json<\/code> holds 16 labelled answers from a contract Q&amp;A assistant, each with a human verdict and note.<\/p>\n<ol>\n<li>Error analysis codes the 7 failures into a taxonomy. Policy violations and contradictions come out as the top priorities.<\/li>\n<li><code>judge.py<\/code> applies a five-criterion rubric (grounded, correct_doc, cited, complete, policy). Online, it calls the LLM. Offline, it uses transparent checks: citations present and retrieved, numbers found in the cited text, the counterparty matching the cited contract, and policy phrases.<\/li>\n<li>Alignment offline: 88% accuracy, κ = 0.74, TPR 71%, TNR 100%. The two misses are an <em>incomplete<\/em> answer and <em>reversed parties<\/em>. Those need semantic judgement, which is exactly where an LLM judge earns its cost.<\/li>\n<\/ol>\n<h2 id=\"s3\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s4\">Process flow<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s5\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m classes.class08_error_analysis_judge.example\nOPENAI_API_KEY=... python -m classes.class08_error_analysis_judge.example   # real LLM judge\n<\/code><\/pre>\n<h2 id=\"s6\">Lab<\/h2>\n<ol>\n<li>Online: does the LLM judge catch s08 (incomplete) and s15 (reversed parties)? Recompute κ.<\/li>\n<li>Add a pairwise judge (A vs B) and measure position bias by swapping the order.<\/li>\n<li>Add an offline \"contradiction\" check for indemnity direction (who indemnifies whom) and see whether TPR rises.<\/li>\n<li>Label 10 new answers from the Class 7 candidate run and add them to the alignment set.<\/li>\n<\/ol>\n<h2 id=\"s7\">Key takeaways<\/h2>\n<ul>\n<li>Read traces before choosing metrics; your taxonomy is your roadmap.<\/li>\n<li>A judge is a model too: validate it against humans before trusting it.<\/li>\n<li>Put checkable rules in code and leave judgement to the judge.<\/li>\n<\/ul>", "diagrams": ["flowchart LR\n    TR[(Production traces)] --> S[Sampler<br/>random + flagged]\n    S --> AQ[Annotation queue<br/>human notes + labels]\n    AQ --> OC[Open coding]\n    OC --> AX[Axial coding<br/>failure taxonomy]\n    AX --> RB[Rubric<br/>one criterion per mode]\n    RB --> J[LLM judge<br/>structured verdicts]\n    AQ -->|held-out labels| AL[Alignment<br/>kappa · TPR · TNR]\n    J --> AL\n    AL -->|aligned| ON[Online eval on sampled traffic]\n    AX --> FX[Fixes: prompt · retrieval · guardrail]\n    AX --> GD[(Golden dataset rows)]", "flowchart TD\n    A[Sample 50-100 traces] --> B[Label PASS/FAIL + free-text note]\n    B --> C[Cluster notes into 5-8 failure modes]\n    C --> D[Count x severity = priority]\n    D --> E[Fix top mode, add cases to golden set]\n    C --> F[Write rubric criteria per mode]\n    F --> G[Run judge on labelled set]\n    G --> H{kappa above 0.6 and TPR acceptable?}\n    H -->|no| I[Read disagreements, refine rubric / examples]\n    I --> G\n    H -->|yes| J[Deploy judge on sampled production traffic]\n    J --> A"], "toc": ["Learning objectives", "Key concepts", "Worked example", "Architecture", "Process flow", "Run it", "Lab", "Key takeaways"], "short": "Error Analysis and LLM as Judge", "files": [{"name": "example.py", "lang": "python", "code": "\"\"\"Class 8 - Error analysis, then an LLM judge aligned to human labels.\n\nStep 1  Open coding   : read each failing trace, write a free-text note (done: human_note).\nStep 2  Axial coding  : group notes into a failure taxonomy and count -> what to fix first.\nStep 3  Judge         : automate the taxonomy as a rubric-based judge.\nStep 4  Alignment     : measure judge vs human (accuracy, Cohen's kappa, TPR, TNR) and read\n                        every disagreement before trusting the judge at scale.\n\nRun:  python -m classes.class08_error_analysis_judge.example\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom collections import Counter\nfrom pathlib import Path\n\nfrom common.llm import get_llm\n\nfrom .judge import judge\n\nSAMPLES = json.loads((Path(__file__).parent / \"samples.json\").read_text())\n\n# axial coding: map free-text notes to failure categories (+ severity for prioritisation)\nTAXONOMY = {\n    \"wrong_document\": ([\"wrong document\", \"globex contract\"], 3),\n    \"hallucinated_value\": ([\"invented\", \"not in context\"], 3),\n    \"missing_citation\": ([\"no citation\", \"citation to missing\", \"not retrieved\"], 2),\n    \"policy_violation\": ([\"legal advice\", \"overconfident\"], 3),\n    \"incomplete\": ([\"incomplete\", \"did not answer\"], 2),\n    \"contradiction\": ([\"reversed\", \"contradicts\", \"wrong verdict\"], 3),\n}\n\n\ndef code_note(note: str) -> list[str]:\n    return [cat for cat, (kws, _) in TAXONOMY.items() if any(k in note.lower() for k in kws)] or [\"other\"]\n\n\ndef cohen_kappa(a: list[str], b: list[str]) -> float:\n    labels = sorted(set(a) | set(b))\n    n = len(a)\n    po = sum(x == y for x, y in zip(a, b)) / n\n    pe = sum((a.count(l) / n) * (b.count(l) / n) for l in labels)\n    return (po - pe) / (1 - pe) if pe < 1 else 1.0\n\n\ndef main() -> None:\n    print(f\"LLM mode: {get_llm().mode}\\n\")\n    fails = [s for s in SAMPLES if s[\"human\"] == \"fail\"]\n    print(f\"== Error analysis: {len(fails)}/{len(SAMPLES)} traces failed human review ==\")\n    counts = Counter(cat for s in fails for cat in code_note(s[\"human_note\"]))\n    print(f\"{'failure mode':<22}{'count':>6}{'severity':>10}{'priority':>10}\")\n    for cat, n in sorted(counts.items(), key=lambda kv: -kv[1] * TAXONOMY.get(kv[0], ([], 1))[1]):\n        sev = TAXONOMY.get(cat, ([], 1))[1]\n        print(f\"{cat:<22}{n:>6}{sev:>10}{n * sev:>10}\")\n\n    print(\"\\n== Judge vs human labels ==\")\n    human, pred, disagreements = [], [], []\n    for s in SAMPLES:\n        j = judge(s[\"question\"], s[\"context_ids\"], s[\"answer\"])\n        h = s[\"human\"].upper()\n        human.append(h)\n        pred.append(j.verdict)\n        if h != j.verdict:\n            disagreements.append((s, j))\n    tp = sum(h == \"FAIL\" and p == \"FAIL\" for h, p in zip(human, pred))\n    tn = sum(h == \"PASS\" and p == \"PASS\" for h, p in zip(human, pred))\n    n_fail, n_pass = human.count(\"FAIL\"), human.count(\"PASS\")\n    print(f\"accuracy {sum(h == p for h, p in zip(human, pred)) / len(human):.0%} · \"\n          f\"Cohen's kappa {cohen_kappa(human, pred):.2f} · \"\n          f\"TPR (catches failures) {tp / n_fail:.0%} · TNR (passes good answers) {tn / n_pass:.0%}\")\n    print(\"\\nconfusion       judge PASS  judge FAIL\")\n    print(f\"human PASS      {tn:>10}  {n_pass - tn:>10}\")\n    print(f\"human FAIL      {n_fail - tp:>10}  {tp:>10}\")\n    print(\"\\nDisagreements (read these - they tell you how to fix the rubric):\")\n    for s, j in disagreements:\n        print(f\"  {s['id']} human={s['human'].upper()} judge={j.verdict} · note: {s['human_note']} · judge: {j.rationale}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "judge.py", "lang": "python", "code": "\"\"\"Class 8 - LLM-as-a-judge with an explicit rubric, plus a transparent offline judge.\n\nGood judge design:\n  * binary PASS/FAIL per criterion (easier to align with humans than 1-10 scales)\n  * the rubric names concrete failure modes found in error analysis\n  * judge sees exactly what the system saw (question + retrieved context), plus the answer\n  * rationale BEFORE verdict; structured output; temperature 0\n  * validated against human labels (agreement, Cohen's kappa, TPR/TNR) before it is trusted\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom functools import lru_cache\n\nfrom pydantic import BaseModel\n\nfrom common import DATA\nfrom common.guardrails import check_output\nfrom common.llm import get_llm\nfrom common.retrieval import chunk_markdown, load_markdown_dir\n\nRUBRIC = \"\"\"You are grading an answer from a contract-analysis assistant. Criteria (each PASS/FAIL):\n1. grounded     - every factual claim (numbers, parties, durations) is supported by the CONTEXT\n2. correct_doc  - facts come from the document the question is about, not another contract\n3. cited        - cites at least one [chunk-id], and only ids present in CONTEXT\n4. complete     - answers the actual question asked (incl. yes/no + the specific point)\n5. policy       - no legal advice to act, no guarantees (\"you will win\", \"definitely protected\")\nOverall verdict is PASS only if all five pass. Write the rationale first, then the verdict.\"\"\"\n\n\nclass Judgement(BaseModel):\n    rationale: str\n    grounded: bool\n    correct_doc: bool\n    cited: bool\n    complete: bool\n    policy: bool\n    verdict: str  # PASS | FAIL\n\n\n@lru_cache\ndef chunk_text() -> dict[str, str]:\n    docs = load_markdown_dir(DATA / \"legal\" / \"contracts\") + [(\"playbook\", (DATA / \"legal\" / \"playbook.md\").read_text())]\n    return {c.id: c.text for d, t in docs for c in chunk_markdown(d, t)}\n\n\nNUM = re.compile(r\"\\b\\d+(?:\\.\\d+)?%?|\\b(?:one|two|three|six|twelve|fifteen|thirty|sixty|ninety|twenty-four)\\b\", re.I)\n\n\ndef offline_judge(question: str, context_ids: list[str], answer: str) -> Judgement:\n    ctx = {i: chunk_text()[i] for i in context_ids}\n    cited = re.findall(r\"\\[([\\w\\-]+#\\d+)\\]\", answer)\n    cited_ok = bool(cited) and all(c in ctx for c in cited)\n    cited_text = \" \".join(ctx.get(c, \"\") for c in cited).lower()\n    nums = {n.lower() for n in NUM.findall(re.sub(r\"\\[[^\\]]+\\]\", \"\", answer))}\n    unsupported = [n for n in nums if n not in cited_text]\n    grounded = cited_ok and not unsupported\n    policy = check_output(answer, \"legal\").allowed and not re.search(r\"\\b(definitely|guarantee)\", answer, re.I)\n    # correct_doc: the question names a counterparty -> citations must be from that contract\n    target = next((d for k, d in {\"acme\": \"acme-saas-msa\", \"globex\": \"globex-services\",\n                                  \"northwind\": \"northwind-nda\"}.items() if k in question.lower()), None)\n    correct_doc = not target or all(c.startswith(target) or c.startswith(\"playbook\") for c in cited)\n    complete = len(answer.split()) >= 4\n    ok = all([grounded, correct_doc, cited_ok, complete, policy])\n    why = []\n    if not cited_ok:\n        why.append(\"missing or unknown citation\")\n    if unsupported:\n        why.append(f\"values not in cited context: {unsupported}\")\n    if not policy:\n        why.append(\"policy language (advice/guarantee)\")\n    return Judgement(rationale=\"; \".join(why) or \"all checks passed\", grounded=grounded, correct_doc=correct_doc,\n                     cited=cited_ok, complete=complete, policy=policy, verdict=\"PASS\" if ok else \"FAIL\")\n\n\ndef judge(question: str, context_ids: list[str], answer: str) -> Judgement:\n    ctx = \"\\n\\n\".join(f\"[{i}]\\n{chunk_text()[i]}\" for i in context_ids)\n    msgs = [{\"role\": \"system\", \"content\": RUBRIC},\n            {\"role\": \"user\", \"content\": f\"QUESTION: {question}\\n\\nCONTEXT:\\n{ctx}\\n\\nANSWER:\\n{answer}\"}]\n    return get_llm().structured(msgs, Judgement, fallback=lambda: offline_judge(question, context_ids, answer))\n"}], "folder": "classes/class08_error_analysis_judge"}, "9": {"title": "Class 9 — Agentic RAG and Fine-tuning", "meta": {"week": "Week 5 · Advanced retrieval & performance", "tools": ["LangGraph", "NVIDIA NeMo", "OpenAI fine-tuning"], "domain": "Clinical policy assistant"}, "html": "<h2 id=\"s0\">Learning objectives<\/h2>\n<ul>\n<li>Turn single-shot RAG into an agentic loop: route, plan, retrieve, grade, rewrite, generate, and verify.<\/li>\n<li>Implement Corrective and Self-RAG patterns: document grading, query rewriting, and grounding checks with escalation.<\/li>\n<li>Decompose multi-part questions and answer each part with its own evidence.<\/li>\n<li>Decide between prompting, RAG, and fine-tuning, and when to combine them.<\/li>\n<li>Build SFT and DPO datasets from your own traces and labels with PHI scrubbing, deduplication, and leakage-free splits.<\/li>\n<li>Run a LoRA fine-tune (NeMo) or a managed fine-tune (OpenAI), and evaluate it before switching traffic.<\/li>\n<\/ul>\n<h2 id=\"s1\">Key concepts: agentic RAG<\/h2>\n<p><strong>Why.<\/strong> Plain RAG retrieves once. When the query uses a brand name (\"Ozempic\") or slang (\"A1c\"), or asks two things at once, one retrieval pass returns weak evidence and the model improvises. Agentic RAG makes retrieval a decision the system can revisit.<\/p>\n<p><strong>The pattern (see <code>agentic_rag.py<\/code>).<\/strong><\/p>\n<ul>\n<li><em>Route<\/em>: in-scope policy question, or refuse (dosing or clinical advice)?<\/li>\n<li><em>Plan<\/em>: decompose \"Compare X for A and B\" into sub-questions.<\/li>\n<li><em>Retrieve<\/em>: hybrid search for each sub-question.<\/li>\n<li><em>Grade<\/em>: keep only the chunks that are actually relevant (an LLM yes/no, or an overlap check offline).<\/li>\n<li><em>Rewrite<\/em>: when the evidence is weak, translate the query into the document's vocabulary and try again (at most 2 attempts).<\/li>\n<li><em>Generate<\/em>: answer from the graded chunks only, with citations.<\/li>\n<li><em>Check<\/em>: citations must reference graded chunks. If not, escalate to a human rather than guess.<\/li>\n<\/ul>\n<p><strong>Budgets.<\/strong> Every loop has a maximum iteration count. Log each decision (<code>state.log<\/code>) so error analysis can see <em>why<\/em> the system retrieved what it did.<\/p>\n<h2 id=\"s2\">Key concepts: fine-tuning<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Best tool<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>New or changing knowledge (policies, contracts)<\/td>\n<td>RAG<\/td>\n<\/tr>\n<tr>\n<td>Output format, tone, refusal behaviour, domain style<\/td>\n<td>Prompting first, then SFT<\/td>\n<\/tr>\n<tr>\n<td>Preference for one kind of answer over another (grounded over fluent)<\/td>\n<td>DPO / preference tuning<\/td>\n<\/tr>\n<tr>\n<td>Lower latency and cost at the same quality<\/td>\n<td>Distil a large model into a small fine-tuned one<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Data comes from your system.<\/strong> Use judge-PASS or human-approved traces as SFT targets, and Class 8's pass/fail pairs as DPO pairs. Scrub PHI (the build fails if any identifier survives), deduplicate by prompt, and split deterministically by hash.<\/p>\n<p><strong>LoRA.<\/strong> Train small low-rank adapters (0.1–1% of the weights) instead of the full model. That means cheaper training, adapters you can swap per domain, and serving many LoRAs on one base model in vLLM.<\/p>\n<p><strong>Evaluate before switching.<\/strong> A fine-tuned model is just another experiment in Class 7. Run the same golden set and regression gate, and watch for lost general ability.<\/p>\n<h2 id=\"s3\">Worked example<\/h2>\n<p><code>agentic_rag.py<\/code> offline:<\/p>\n<ul>\n<li><em>\"What a1c is needed before starting ozempic?\"<\/em> The first retrieval is graded 0 of 3 relevant. The query is rewritten to \"HbA1c … semaglutide\", and the retry finds the GLP-1 criteria (HbA1c ≥ 7.0%).<\/li>\n<li><em>\"Compare the conservative therapy requirement for lumbar MRI and knee arthroscopy.\"<\/em> This is decomposed into two sub-questions, and each answer cites its own policy.<\/li>\n<li><em>\"What dose of semaglutide should I take?\"<\/em> This is routed to a refusal.<\/li>\n<\/ul>\n<p><code>finetune_data.py<\/code> writes 10 SFT training rows, 1 validation row, and 7 DPO pairs. <code>launch_finetune.py<\/code> starts an OpenAI job or prints the NeMo LoRA recipe.<\/p>\n<h2 id=\"s4\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s5\">Process flow: fine-tuning pipeline<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s6\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m classes.class09_agentic_rag_finetuning.agentic_rag\npython -m classes.class09_agentic_rag_finetuning.finetune_data\npython -m classes.class09_agentic_rag_finetuning.launch_finetune nemo     # prints the LoRA recipe\npython -m classes.class09_agentic_rag_finetuning.launch_finetune openai   # needs OPENAI_API_KEY\n<\/code><\/pre>\n<h2 id=\"s7\">Lab<\/h2>\n<ol>\n<li>Add a \"needs patient data\" route that calls a (mock) EHR tool before retrieval.<\/li>\n<li>Make the grader a real LLM call and compare its keep rate with the overlap heuristic.<\/li>\n<li>Add HyDE as a third rewrite strategy and measure retries saved on a paraphrased golden set.<\/li>\n<li>Extend <code>finetune_data.py<\/code> to export NeMo's input/output format, and validate that no MRN or phone number survives.<\/li>\n<\/ol>\n<h2 id=\"s8\">Key takeaways<\/h2>\n<ul>\n<li>Agentic RAG spends extra calls only when the evidence is weak; grade before you generate.<\/li>\n<li>Escalating is a feature: \"I'm not sure\" beats a confident hallucination in clinical and legal work.<\/li>\n<li>Fine-tune for behaviour, not knowledge, and prove it with the same evals.<\/li>\n<\/ul>", "diagrams": ["flowchart TD\n    Q[Question] --> RT{Route}\n    RT -->|clinical advice / off-topic| RF[Refuse safely]\n    RT -->|policy question| PL[Plan<br/>decompose sub-questions]\n    PL --> RE[Retrieve<br/>hybrid per sub-question]\n    RE --> GR{Grade documents}\n    GR -->|enough evidence| GE[Generate with citations]\n    GR -->|weak, attempts below 2| RW[Rewrite query<br/>policy vocabulary]\n    RW --> RE\n    GR -->|still weak| ES[Escalate to human]\n    GE --> CK{Grounding check}\n    CK -->|cited chunks valid| A[Answer]\n    CK -->|invalid| ES", "flowchart LR\n    T[(Traces + judge verdicts<br/>+ human labels)] --> SEL[Select PASS outputs<br/>and PASS/FAIL pairs]\n    SEL --> SC[PHI scrub<br/>fail build on leak]\n    SC --> DD[Deduplicate + citation filter]\n    DD --> SP[Hash split<br/>train / val]\n    SP --> FT{Train}\n    FT -->|managed| OA[OpenAI SFT / DPO]\n    FT -->|open model| NM[NeMo LoRA]\n    OA --> EV[Class 7 eval + gate]\n    NM --> EV\n    EV -->|pass| SV[Serve via vLLM / NIM<br/>canary traffic]\n    EV -->|fail| SEL"], "toc": ["Learning objectives", "Key concepts: agentic RAG", "Key concepts: fine-tuning", "Worked example", "Architecture", "Process flow: fine-tuning pipeline", "Run it", "Lab", "Key takeaways"], "short": "Agentic RAG and Fine-tuning", "files": [{"name": "agentic_rag.py", "lang": "python", "code": "\"\"\"Class 9 - Agentic RAG for clinical policy questions (LangGraph).\n\nPlain RAG retrieves once and hopes. Agentic RAG lets the system reason about retrieval:\n\n  route -> plan (decompose multi-part questions) -> retrieve -> grade documents\n        -> (weak evidence? rewrite query and retry, max 2) -> generate -> check grounding\n        -> (ungrounded? escalate) -> answer | escalate to human\n\nThis combines ideas from Self-RAG, Corrective RAG (CRAG) and query decomposition.\n\nRun:  python -m classes.class09_agentic_rag_finetuning.agentic_rag\n\"\"\"\nfrom __future__ import annotations\n\nimport operator\nimport re\nfrom typing import Annotated, Literal, TypedDict\n\nfrom langgraph.graph import END, START, StateGraph\n\nfrom common import DATA\nfrom common.guardrails import check_citations\nfrom common.llm import get_llm\nfrom common.retrieval import (Chunk, HybridRetriever, chunk_markdown, extractive_answer,\n                              format_context, load_markdown_dir, tokenize)\nfrom common.tracing import traced\n\nRETRIEVER = HybridRetriever([c for d, t in load_markdown_dir(DATA / \"clinical\" / \"guidelines\")\n                             for c in chunk_markdown(d, t, 700)])\n\n# brand names and colloquialisms -> policy vocabulary (an LLM does this online)\nSYNONYMS = {\"a1c\": \"HbA1c\", \"sleep test\": \"home sleep apnea testing\", \"back mri\": \"MRI lumbar spine\",\n            \"knee scope\": \"knee arthroscopy meniscectomy\", \"ozempic\": \"semaglutide\",\n            \"mounjaro\": \"tirzepatide\", \"pt\": \"physical therapy\"}\nSTOP = {\"what\", \"is\", \"the\", \"a\", \"an\", \"for\", \"of\", \"to\", \"and\", \"or\", \"in\", \"on\", \"which\", \"when\", \"how\",\n        \"does\", \"do\", \"be\", \"with\", \"any\", \"should\", \"must\", \"before\", \"long\", \"used\", \"needed\", \"starting\"}\n\n\ndef content(q: str) -> set[str]:\n    return {t for t in tokenize(q) if len(t) > 1} - STOP\n\n\nOUT_OF_SCOPE = [\"dose\", \"dosage\", \"should i take\", \"diagnose\", \"weather\", \"stock price\"]\n\n\nclass RAGState(TypedDict):\n    question: str\n    route: str\n    sub_questions: list[str]\n    queries: list[str]\n    attempts: int\n    docs: list[tuple[Chunk, float]]\n    relevant: list[tuple[Chunk, float]]\n    answer: str\n    grounded: bool\n    log: Annotated[list[str], operator.add]\n\n\n# ----------------------------------------------------------------------------- nodes\n@traced(\"route\")\ndef route(s: RAGState) -> dict:\n    q = s[\"question\"].lower()\n    r = \"refuse\" if any(w in q for w in OUT_OF_SCOPE) else \"policy_qa\"\n    r = get_llm().chat(f\"Classify as policy_qa or refuse (clinical advice / off-topic): {s['question']}\",\n                       fallback=lambda: r).strip().lower()\n    return {\"route\": \"refuse\" if \"refuse\" in r else \"policy_qa\", \"log\": [f\"route={r}\"]}\n\n\ndef plan(s: RAGState) -> dict:\n    q = s[\"question\"]\n    m = re.match(r\"(?i)compare (.+?) for (.+?) and (.+?)[?.]?$\", q)\n    subs = [f\"{m.group(1)} for {m.group(2)}\", f\"{m.group(1)} for {m.group(3)}\"] if m else [q]\n    return {\"sub_questions\": subs, \"queries\": subs, \"log\": [f\"plan: {subs}\"]}\n\n\ndef retrieve(s: RAGState) -> dict:\n    docs, seen = [], set()\n    for q in s[\"queries\"]:\n        for c, sc in RETRIEVER.search(q, k=3):\n            if c.id not in seen:\n                seen.add(c.id)\n                docs.append((c, sc))\n    return {\"docs\": docs, \"attempts\": s[\"attempts\"] + 1,\n            \"log\": [f\"retrieve#{s['attempts'] + 1}: {[c.id for c, _ in docs]}\"]}\n\n\ndef grade(s: RAGState) -> dict:\n    \"\"\"Keep only chunks that are relevant to at least one sub-question (LLM yes/no, offline overlap).\"\"\"\n    keep = []\n    for c, sc in s[\"docs\"]:\n        def offline():  # share of the query's content words found in the chunk\n            ctoks = set(tokenize(c.text))\n            best = max(len(content(q) & ctoks) / max(1, len(content(q))) for q in s[\"queries\"])\n            return \"yes\" if best >= 0.25 else \"no\"\n        v = get_llm().chat(f\"Is this passage relevant to any of {s['queries']}? yes/no\\n\\n{c.text}\", fallback=offline)\n        if v.strip().lower().startswith(\"y\"):\n            keep.append((c, sc))\n    return {\"relevant\": keep, \"log\": [f\"grade: kept {len(keep)}/{len(s['docs'])}\"]}\n\n\ndef rewrite(s: RAGState) -> dict:\n    def offline():\n        out = []\n        for q in s[\"queries\"]:\n            ql = q.lower()\n            for k, v in SYNONYMS.items():\n                q = re.sub(rf\"(?i)\\b{re.escape(k)}\\b\", v, q)\n            out.append(q)\n        return \"\\n\".join(out)\n    new = get_llm().chat(\"Rewrite each query for a medical-policy search engine using formal terms, one per line:\\n\"\n                         + \"\\n\".join(s[\"queries\"]), fallback=offline).splitlines()\n    return {\"queries\": [q for q in new if q.strip()], \"log\": [f\"rewrite: {new}\"]}\n\n\ndef generate(s: RAGState) -> dict:\n    ctx = format_context(s[\"relevant\"])\n    subs = s[\"sub_questions\"]\n    prompt = (f\"Answer using ONLY the context; cite [chunk-id] after each sentence. Sub-questions: {subs}\\n\\n\"\n              f\"{ctx}\\n\\nQuestion: {s['question']}\")\n\n    def fb():  # offline: best supporting sentence per sub-question, no duplicates\n        parts, used = [], set()\n        for q in (s[\"queries\"] if len(s[\"queries\"]) == len(subs) else subs):\n            cands = extractive_answer(q, s[\"relevant\"], n=3)\n            for piece in re.findall(r\"[^\\]]+?\\[[^\\]]+\\]\", cands):\n                if piece.strip() not in used:\n                    used.add(piece.strip())\n                    parts.append(piece.strip())\n                    break\n        return \" \".join(parts)\n    return {\"answer\": get_llm().chat(prompt, fallback=fb), \"log\": [\"generate\"]}\n\n\ndef check(s: RAGState) -> dict:\n    g = check_citations(s[\"answer\"], {c.id for c, _ in s[\"relevant\"]})\n    return {\"grounded\": g.allowed, \"log\": [f\"grounding: {'ok' if g.allowed else g.findings}\"]}\n\n\ndef refuse(s: RAGState) -> dict:\n    return {\"answer\": \"I can only answer questions about coverage policy criteria. For clinical or dosing \"\n                      \"decisions, please consult the treating clinician.\", \"grounded\": True, \"log\": [\"refused\"]}\n\n\ndef escalate(s: RAGState) -> dict:\n    return {\"answer\": \"Not enough policy evidence to answer confidently - routed to a human reviewer.\",\n            \"log\": [\"escalated\"]}\n\n\n# ----------------------------------------------------------------------------- edges\ndef after_grade(s: RAGState) -> Literal[\"generate\", \"rewrite\", \"escalate\"]:\n    if len(s[\"relevant\"]) >= len(s[\"sub_questions\"]):\n        return \"generate\"\n    return \"rewrite\" if s[\"attempts\"] < 2 else (\"generate\" if s[\"relevant\"] else \"escalate\")\n\n\ndef build():\n    g = StateGraph(RAGState)\n    for name, fn in [(\"route\", route), (\"plan\", plan), (\"retrieve\", retrieve), (\"grade\", grade),\n                     (\"rewrite\", rewrite), (\"generate\", generate), (\"check\", check),\n                     (\"refuse\", refuse), (\"escalate\", escalate)]:\n        g.add_node(name, fn)\n    g.add_edge(START, \"route\")\n    g.add_conditional_edges(\"route\", lambda s: \"refuse\" if s[\"route\"] == \"refuse\" else \"plan\")\n    g.add_edge(\"plan\", \"retrieve\")\n    g.add_edge(\"retrieve\", \"grade\")\n    g.add_conditional_edges(\"grade\", after_grade)\n    g.add_edge(\"rewrite\", \"retrieve\")\n    g.add_edge(\"generate\", \"check\")\n    g.add_conditional_edges(\"check\", lambda s: END if s[\"grounded\"] else \"escalate\")\n    g.add_edge(\"refuse\", END)\n    g.add_edge(\"escalate\", END)\n    return g.compile()\n\n\ndef ask(app, q: str) -> dict:\n    return app.invoke({\"question\": q, \"route\": \"\", \"sub_questions\": [], \"queries\": [], \"attempts\": 0,\n                       \"docs\": [], \"relevant\": [], \"answer\": \"\", \"grounded\": False, \"log\": []})\n\n\nif __name__ == \"__main__\":\n    app = build()\n    for q in [\"What a1c is needed before starting ozempic?\",\n              \"Compare the conservative therapy requirement for lumbar MRI and knee arthroscopy.\",\n              \"What dose of semaglutide should I take?\"]:\n        out = ask(app, q)\n        print(f\"\\nQ: {q}\")\n        for line in out[\"log\"]:\n            print(f\"   · {line}\")\n        print(f\"A: {out['answer']}\")\n"}, {"name": "finetune_data.py", "lang": "python", "code": "\"\"\"Class 9 - Preparing fine-tuning data from your own agent's traces and labels.\n\nProduces three datasets in runs/finetune/:\n  sft_train.jsonl / sft_val.jsonl  - chat-format supervised examples (OpenAI / NeMo / HF TRL)\n  dpo_pairs.jsonl                  - preference pairs (chosen vs rejected) from Class 8 labels\n\nQuality gates applied before anything is written:\n  * PHI/PII scrub (fails the build if any identifier survives)\n  * de-duplication by normalised prompt\n  * answers must carry a valid citation (grounded behaviour is what we want to teach)\n  * deterministic train/val split by hash (no leakage between runs)\n\nRun:  python -m classes.class09_agentic_rag_finetuning.finetune_data\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport re\nfrom pathlib import Path\n\nfrom common import RUNS\nfrom common.domain import load_clinical_golden\nfrom common.guardrails import PII_PATTERNS, redact\nfrom common.retrieval import HybridRetriever, chunk_markdown, extractive_answer, format_context, load_markdown_dir\nfrom common import DATA\n\nOUT = RUNS / \"finetune\"\nSYSTEM = (\"You answer health-plan medical policy questions using only the provided context. \"\n          \"Cite [chunk-id] after each sentence. Say 'Not found in policy documents.' if unsupported.\")\n\n\ndef sft_examples() -> list[dict]:\n    retr = HybridRetriever([c for d, t in load_markdown_dir(DATA / \"clinical\" / \"guidelines\")\n                            for c in chunk_markdown(d, t, 700)])\n    rows = []\n    for g in load_clinical_golden():\n        res = retr.search(g[\"q\"], 3)\n        answer = extractive_answer(g[\"q\"], res, n=2)   # in practice: human-approved or judge-PASS outputs\n        rows.append({\"messages\": [\n            {\"role\": \"system\", \"content\": SYSTEM},\n            {\"role\": \"user\", \"content\": f\"Context:\\n{format_context(res)}\\n\\nQuestion: {g['q']}\"},\n            {\"role\": \"assistant\", \"content\": answer}]})\n    # teach refusal too - a behaviour prompting alone often under-delivers\n    rows.append({\"messages\": [{\"role\": \"system\", \"content\": SYSTEM},\n                              {\"role\": \"user\", \"content\": \"Context:\\n(none relevant)\\n\\nQuestion: Is acupuncture covered?\"},\n                              {\"role\": \"assistant\", \"content\": \"Not found in policy documents.\"}]})\n    return rows\n\n\ndef dpo_pairs() -> list[dict]:\n    samples = json.loads((Path(__file__).parents[1] / \"class08_error_analysis_judge\" / \"samples.json\").read_text())\n    by_q: dict[str, dict[str, list]] = {}\n    for s in samples:\n        by_q.setdefault(s[\"question\"], {\"pass\": [], \"fail\": []})[s[\"human\"]].append(s[\"answer\"])\n    return [{\"prompt\": q, \"chosen\": v[\"pass\"][0], \"rejected\": v[\"fail\"][0]}\n            for q, v in by_q.items() if v[\"pass\"] and v[\"fail\"]]\n\n\ndef gate(rows: list[dict]) -> list[dict]:\n    seen, out = set(), []\n    for r in rows:\n        text = json.dumps(r)\n        text = redact(text).text\n        for label, pat in PII_PATTERNS.items():\n            if label != \"CARD\" and re.search(pat, text, re.I):\n                raise ValueError(f\"PII ({label}) survived scrubbing - refusing to write training data\")\n        r = json.loads(text)\n        prompt = r[\"messages\"][1][\"content\"] if \"messages\" in r else r[\"prompt\"]\n        key = re.sub(r\"\\W+\", \" \", prompt.split(\"Question:\")[-1].lower()).strip()\n        if key in seen:\n            continue\n        seen.add(key)\n        answer = r[\"messages\"][-1][\"content\"] if \"messages\" in r else r[\"chosen\"]\n        if \"Not found\" not in answer and not re.search(r\"\\[[\\w\\-]+#\\d+\\]\", answer):\n            continue\n        out.append(r)\n    return out\n\n\ndef split(rows: list[dict], val_pct: int = 20):\n    train, val = [], []\n    for r in rows:\n        h = int(hashlib.sha256(json.dumps(r, sort_keys=True).encode()).hexdigest(), 16) % 100\n        (val if h < val_pct else train).append(r)\n    if not val and len(train) > 4:          # tiny datasets: guarantee a validation example\n        val.append(train.pop())\n    return train, val\n\n\ndef write(name: str, rows: list[dict]) -> None:\n    OUT.mkdir(parents=True, exist_ok=True)\n    (OUT / name).write_text(\"\\n\".join(json.dumps(r) for r in rows) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    sft = gate(sft_examples())\n    train, val = split(sft)\n    write(\"sft_train.jsonl\", train)\n    write(\"sft_val.jsonl\", val)\n    dpo = gate(dpo_pairs())\n    write(\"dpo_pairs.jsonl\", dpo)\n    print(f\"SFT: {len(train)} train / {len(val)} val · DPO pairs: {len(dpo)} -> {OUT}\")\n    print(\"example SFT assistant turn:\", train[0][\"messages\"][-1][\"content\"][:160], \"…\")\n    print(\"example DPO pair:\", json.dumps(dpo[0])[:240], \"…\")\n"}, {"name": "launch_finetune.py", "lang": "python", "code": "\"\"\"Class 9 - Launching a fine-tune on the data from finetune_data.py.\n\nTwo paths:\n  openai : managed SFT / DPO on a hosted model (needs OPENAI_API_KEY)\n  nemo   : LoRA on an open model with NVIDIA NeMo (GPU host; NeMo container).\n           Prints the recipe - APIs move quickly, so check it against your NeMo release notes.\n\nRun:  python -m classes.class09_agentic_rag_finetuning.launch_finetune openai|nemo\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nfrom common import RUNS\n\nDATA = RUNS / \"finetune\"\n\nNEMO_RECIPE = f\"\"\"\n# --- NVIDIA NeMo 2.x LoRA recipe (run inside nvcr.io/nvidia/nemo:<release> on a GPU host) ---\nimport nemo_run as run\nfrom nemo.collections import llm\n\nrecipe = llm.llama3_8b.finetune_recipe(          # any supported open model recipe\n    name=\"clinical_policy_lora\",\n    dir=\"/workspace/checkpoints\",\n    num_nodes=1, num_gpus_per_node=1,\n    peft_scheme=\"lora\",                           # low-rank adapters: ~0.1-1% of weights trained\n)\nrecipe.data = run.Config(llm.FineTuningDataModule,  # expects input/output JSONL\n    dataset_root=\"{DATA}\", seq_length=4096, micro_batch_size=1, global_batch_size=8)\nrecipe.trainer.max_steps = 300\nrecipe.optim.config.lr = 1e-4\nrun.run(recipe, executor=run.LocalExecutor())\n\n# Convert chat JSONL -> NeMo input/output JSONL first:\n#   {{\"input\": \"<system>\\\\n<user>\", \"output\": \"<assistant>\"}}\n# Serve the merged model or the LoRA adapter with vLLM / NVIDIA NIM (Class 10):\n#   vllm serve meta-llama/Meta-Llama-3-8B-Instruct --enable-lora --lora-modules policy=/workspace/checkpoints/...\n\"\"\"\n\n\ndef openai_sft() -> None:\n    from openai import OpenAI\n    client = OpenAI()\n    train = client.files.create(file=open(
