 recommends {ask['recommendation'].upper()} \"\n                  f\"(needs {ask['required_reviewer']})\\n{ask['rationale']}\")\n            d = input(\"decision [approve/pend/deny/redirect, enter = accept] > \").strip() or ask[\"recommendation\"]\n        else:\n            d = ask[\"recommendation\"]\n        out = app.invoke(Command(resume={\"decision\": d, \"reviewer\": ask[\"required_reviewer\"] + \"-demo\"}), cfg)\n    return out\n\n\ndef main() -> None:\n    interactive = \"--interactive\" in sys.argv\n    show = sys.argv[sys.argv.index(\"--show\") + 1] if \"--show\" in sys.argv else \"PA-1001\"\n    app = build()\n    print(f\"LLM mode: {get_llm().mode}\\n\")\n    print(f\"{'request':<9}{'service':<42}{'AI rec':<10}{'expected':<10}{'PHI redacted':<22}guard\")\n    correct = 0\n    results = {}\n    for req in load_pa_requests():\n        out = process(app, req, interactive)\n        results[req[\"request_id\"]] = out\n        rec = out[\"assessment\"][\"recommendation\"]\n        correct += rec == req[\"expected_decision\"]\n        print(f\"{req['request_id']:<9}{req['service'][:40]:<42}{rec:<10}{req['expected_decision']:<10}\"\n              f\"{','.join(out['phi_findings']):<22}{'ok' if out['guard']['allowed'] else out['guard']['findings']}\")\n    print(f\"\\nrecommendation accuracy: {correct}/{len(results)}\")\n    o = results[show]\n    print(f\"\\n--- {show} detail ---\\nredacted note: {o['redacted_note'][:160]}…\")\n    print(\"facts:\", {k: v for k, v in o[\"facts\"].items() if v not in (None, [], {}) and k != \"evidence\"})\n    print(f\"rationale:\\n{o['rationale']}\\nletter: {o['letter']}\\nstatus: {o['status']}\")\n    print(\"\\naudit log -> runs/clinical_audit.jsonl\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "Dockerfile", "lang": "dockerfile", "code": "# Build from the repository root:  docker build -f projects/clinical_prior_auth/Dockerfile -t prior-auth .\nFROM python:3.11-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY common/ common/\nCOPY data/clinical/ data/clinical/\nCOPY projects/clinical_prior_auth/ projects/clinical_prior_auth/\nENV PYTHONUNBUFFERED=1\nRUN useradd -m app && mkdir -p runs && chown app runs\nUSER app\nEXPOSE 8001\nHEALTHCHECK CMD python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\"\nCMD [\"uvicorn\", \"projects.clinical_prior_auth.api:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8001\"]\n"}], "folder": "projects/clinical_prior_auth"}, {"title": "Capstone 2 — Legal Contract Review Agent", "meta": {}, "html": "<blockquote>\n<p>Contracts and playbook are <strong>synthetic<\/strong>. Output is an internal triage aid, not legal advice.<\/p>\n<\/blockquote>\n<p>An in-house legal operations team reviews incoming vendor contracts against its negotiation playbook. The agent splits a contract into clauses and reviews them <strong>in parallel<\/strong>. For each clause it classifies the type, retrieves our playbook position, applies the playbook thresholds as code, explains the risk with evidence quotes, and proposes redlines. It then scores the contract (green/amber/red), escalates to senior counsel when rules require it, and writes a Markdown report.<\/p>\n<p><strong>Autonomy: L1–L2.<\/strong> The agent suggests, and a lawyer negotiates. Escalations pause for counsel sign-off.<\/p>\n<p><strong>Classes used:<\/strong> 2 (prompting, structured output), 4 (playbook RAG with metadata), 5 (interrupts), 8 (evaluation and error analysis), 11 (prompt-injection screening).<\/p>\n<h2 id=\"s0\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s1\">Process flow<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s2\">Playbook as code<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Clause<\/th>\n<th>Standard<\/th>\n<th>Flagged as<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Limitation of liability<\/td>\n<td>Mutual 12-month cap with carve-outs<\/td>\n<td>high if below 12 months, one-sided, or covering data breaches; <strong>escalate if below 6 months<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Indemnification<\/td>\n<td>Mutual; supplier IP indemnity<\/td>\n<td>high if one-way or no IP indemnity<\/td>\n<\/tr>\n<tr>\n<td>Termination<\/td>\n<td>Mutual convenience; 30-day cure<\/td>\n<td>high if supplier-only or cure over 30 days<\/td>\n<\/tr>\n<tr>\n<td>Renewal<\/td>\n<td>Notice ≤ 60 days<\/td>\n<td>high if over 60 days<\/td>\n<\/tr>\n<tr>\n<td>Payment<\/td>\n<td>≥ 30 days; interest ≤ 1%/month; increase ≤ 5%<\/td>\n<td>high if any is breached<\/td>\n<\/tr>\n<tr>\n<td>Data protection<\/td>\n<td>ISO 27001 / SOC 2; 72-hour breach notice<\/td>\n<td>high if the standard is vague or there's no deadline<\/td>\n<\/tr>\n<tr>\n<td>Non-solicit<\/td>\n<td>≤ 12 months with a general-advertisement exception<\/td>\n<td>medium<\/td>\n<\/tr>\n<tr>\n<td>Governing law<\/td>\n<td>NY / Delaware / England &amp; Wales<\/td>\n<td>medium otherwise<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s3\">Results (offline)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Contract<\/th>\n<th>Rating<\/th>\n<th>High<\/th>\n<th>Medium<\/th>\n<th>Escalated<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Acme SaaS MSA<\/td>\n<td>RED (60)<\/td>\n<td>6<\/td>\n<td>0<\/td>\n<td>Yes: 3-month cap, 6 high-risk clauses<\/td>\n<\/tr>\n<tr>\n<td>Globex services<\/td>\n<td>AMBER (10)<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Northwind NDA<\/td>\n<td>GREEN (3)<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Clause type accuracy is 19/20 and risk accuracy 19/20. The one miss is instructive. The offline heuristic classifies Globex <em>6. Insurance<\/em> as a liability clause, so the liability rule flags it as high. That is a classification error cascading into a risk error, the kind of failure Class 8's error analysis surfaces. An LLM classifier fixes it; a confidence threshold with \"other → human\" contains it.<\/p>\n<h2 id=\"s4\">Files<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>playbook_rules.py<\/code><\/td>\n<td>Thresholds, findings and redline templates per clause type<\/td>\n<\/tr>\n<tr>\n<td><code>graph.py<\/code><\/td>\n<td>LangGraph map-reduce (<code>Send<\/code>), aggregation, counsel interrupt, report<\/td>\n<\/tr>\n<tr>\n<td><code>run.py<\/code><\/td>\n<td>Reviews all contracts and scores them against <code>clause_labels.json<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>api.py<\/code><\/td>\n<td>FastAPI: create a review (with your own contract text), get it, sign off, fetch the report<\/td>\n<\/tr>\n<tr>\n<td><code>Dockerfile<\/code><\/td>\n<td>Container image<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s5\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m projects.legal_contract_review.run\nuvicorn projects.legal_contract_review.api:app --port 8002\ncurl -X POST localhost:8002/reviews -H 'content-type: application/json' -d '{&quot;contract_id&quot;:&quot;acme-saas-msa&quot;}'\n<\/code><\/pre>\n<h2 id=\"s6\">Extensions<\/h2>\n<ul>\n<li>Generate tracked-changes <code>.docx<\/code> redlines with python-docx.<\/li>\n<li>Add a clause-type confidence score; below the threshold, route to \"other\" for human classification.<\/li>\n<li>Compare against the counterparty's last signed version (a clause-level diff).<\/li>\n<li>Feed accepted and rejected redlines back as DPO pairs (Class 9).<\/li>\n<\/ul>", "diagrams": ["flowchart LR\n    UP[Contract upload<br/>API / DMS] --> IN[Ingest + section parser]\n    IN --> SC[Injection screen<br/>contract text is untrusted]\n    SC --> FO{{Fan-out<br/>Send per clause}}\n    subgraph RC [review_clause · runs in parallel]\n        C1[Classify<br/>LLM structured] --> C2[Playbook RAG<br/>position + red flags]\n        C2 --> C3[Rules engine<br/>thresholds as code]\n        C3 --> C4[Explain + redline<br/>evidence quote]\n    end\n    FO --> RC\n    RC --> AG[Aggregate<br/>score · rating · escalation]\n    AG --> CS{{Counsel sign-off<br/>interrupt if escalated}}\n    CS --> RP[Report<br/>Markdown + redlines]\n    C2 <--> PB[(Playbook index)]\n    C1 & C4 <--> LLM[(LLM)]", "flowchart TD\n    A[Contract received] --> B[Parse numbered sections + metadata]\n    B --> C{Embedded instructions?}\n    C -->|yes| C1[Flag for escalation]\n    C --> D[Review each clause in parallel]\n    C1 --> D\n    D --> E[Clause type]\n    E --> F[Playbook standard + red flags]\n    F --> G{Deviation?}\n    G -->|none| H[low]\n    G -->|borderline| I[medium + redline]\n    G -->|against playbook| J[high + redline]\n    H & I & J --> K[Aggregate: score = 10 x high + 3 x medium]\n    K --> L{Escalate?<br/>cap under 6 months · 3+ highs · injection}\n    L -->|yes| M[Senior counsel sign-off]\n    L -->|no| N[Report to legal ops]\n    M --> N"], "toc": ["Architecture", "Process flow", "Playbook as code", "Results (offline)", "Files", "Run it", "Extensions"], "slug": "legal_contract_review", "domain": "Legal", "short": "Contract Review", "pattern": "Map-reduce over clauses", "metric": "19/20 clause risks correct · counsel escalation", "files": [{"name": "graph.py", "lang": "python", "code": "\"\"\"Legal Contract Review Agent - LangGraph map-reduce over clauses.\n\n  ingest -> screen (prompt-injection in the document) -> fan-out: review_clause x N (parallel, Send)\n         -> aggregate (score + escalation rules) -> [counsel sign-off interrupt if escalated] -> report\n\nEach review_clause: classify (LLM structured / heuristic) -> retrieve playbook position (RAG)\n-> apply playbook rules (code) -> explain + redline (LLM / template), all with evidence quotes.\n\"\"\"\nfrom __future__ import annotations\n\nimport operator\nimport re\nfrom typing import Annotated, TypedDict\n\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.graph import END, START, StateGraph\nfrom langgraph.types import Send, interrupt\nfrom pydantic import BaseModel\n\nfrom common import DATA, RUNS\nfrom common.domain import CLAUSE_TYPES, classify_clause_heuristic, load_contract_sections, parse_contract\nfrom common.guardrails import screen_input\nfrom common.llm import get_llm\nfrom common.retrieval import HybridRetriever, chunk_markdown\nfrom common.tracing import traced\n\nfrom .playbook_rules import REDLINES, assess_clause\n\nPLAYBOOK = HybridRetriever(chunk_markdown(\"playbook\", (DATA / \"legal\" / \"playbook.md\").read_text(),\n                                          extra_meta={\"doc_type\": \"playbook\"}))\nREPORTS = RUNS / \"legal_reports\"\nRISK_POINTS = {\"low\": 0, \"medium\": 3, \"high\": 10}\n\n\nclass ClauseType(BaseModel):\n    clause_type: str\n    evidence: str\n\n\nclass ReviewState(TypedDict, total=False):\n    contract: str\n    text: str\n    meta: dict\n    sections: list[dict]\n    screen: dict\n    clauses: Annotated[list[dict], operator.add]\n    summary: dict\n    signoff: dict\n    report_path: str\n\n\n# ----------------------------------------------------------------------------- nodes\ndef ingest(s: ReviewState) -> dict:\n    secs = parse_contract(s[\"contract\"], s[\"text\"]) if s.get(\"text\") else load_contract_sections(s[\"contract\"])\n    return {\"sections\": secs, \"meta\": secs[0][\"meta\"] if secs else {}}\n\n\n@traced(\"legal.screen\", \"guardrail\")\ndef screen(s: ReviewState) -> dict:\n    \"\"\"Contracts are untrusted input: flag embedded instructions aimed at the AI reviewer.\"\"\"\n    hits = [f for sec in s[\"sections\"] for f in screen_input(sec[\"text\"]).findings]\n    return {\"screen\": {\"clean\": not hits, \"findings\": hits}}\n\n\ndef fan_out(s: ReviewState) -> list[Send]:\n    return [Send(\"review_clause\", {\"section\": sec, \"role\": s[\"meta\"].get(\"our_role\", \"customer\")})\n            for sec in s[\"sections\"]]\n\n\n@traced(\"legal.review_clause\", \"chain\")\ndef review_clause(p: dict) -> dict:\n    sec, llm = p[\"section\"], get_llm()\n    ct = llm.structured(\n        f\"Classify this contract clause as one of {CLAUSE_TYPES}. Quote evidence.\\n\\n\"\n        f\"Title: {sec['section']}\\n{sec['text']}\", ClauseType,\n        fallback=lambda: ClauseType(clause_type=classify_clause_heuristic(sec[\"section\"], sec[\"text\"]),\n                                    evidence=sec[\"text\"][:120])).clause_type\n    position = PLAYBOOK.search(ct.replace(\"_\", \" \") + \" standard position red flag\", k=1)\n    pb = position[0][0] if position else None\n    risk, finding, escalate = assess_clause(ct, sec[\"text\"])\n    explanation = llm.chat(\n        f\"In two sentences, explain to a lawyer why this clause is {risk} risk for us ({p['role']}), \"\n        f\"citing the playbook [{pb.id if pb else ''}].\\nClause: {sec['text']}\\nPlaybook: {pb.text if pb else ''}\\n\"\n        f\"Finding: {finding}\",\n        fallback=lambda: f\"{finding.capitalize()}. Playbook: {pb.text.split('.')[0] if pb else 'n/a'}. \"\n                         f\"[{pb.id if pb else 'n/a'}]\")\n    return {\"clauses\": [{\"section\": sec[\"section\"], \"clause_type\": ct, \"risk\": risk, \"finding\": finding,\n                         \"escalate\": escalate, \"playbook_ref\": pb.id if pb else None,\n                         \"explanation\": explanation, \"evidence\": _evidence(sec[\"text\"], finding),\n                         \"redline\": REDLINES.get(ct) if risk != \"low\" else None}]}\n\n\ndef _evidence(text: str, finding: str) -> str:\n    \"\"\"Pick the clause sentence that contains the numbers/phrases the finding relies on.\"\"\"\n    nums = re.findall(r\"\\d+(?:\\.\\d+)?\", finding)\n    for sent in re.split(r\"(?<=\\.)\\s+\", text):\n        if any(n in sent for n in nums) or any(w in sent.lower() for w in finding.lower().split()[:3]):\n            return sent.strip()\n    return text.split(\".\")[0]\n\n\ndef aggregate(s: ReviewState) -> dict:\n    cl = sorted(s[\"clauses\"], key=lambda c: c[\"section\"])\n    score = sum(RISK_POINTS[c[\"risk\"]] for c in cl)\n    highs = [c for c in cl if c[\"risk\"] == \"high\"]\n    reasons = [f\"{c['section']}: {c['finding']}\" for c in cl if c[\"escalate\"]]\n    if len(highs) >= 3:\n        reasons.append(f\"{len(highs)} high-risk clauses\")\n    if not s[\"screen\"][\"clean\"]:\n        reasons.append(\"possible prompt injection embedded in contract text\")\n    return {\"summary\": {\"risk_score\": score, \"rating\": \"red\" if score >= 30 else \"amber\" if score >= 10 else \"green\",\n                        \"high\": len(highs), \"medium\": sum(c[\"risk\"] == \"medium\" for c in cl),\n                        \"escalate\": bool(reasons), \"escalation_reasons\": reasons}}\n\n\ndef counsel_signoff(s: ReviewState) -> dict:\n    if not s[\"summary\"][\"escalate\"]:\n        return {\"signoff\": {\"required\": False}}\n    d = interrupt({\"contract\": s[\"contract\"], \"summary\": s[\"summary\"]})\n    return {\"signoff\": {\"required\": True, **d}}\n\n\ndef report(s: ReviewState) -> dict:\n    REPORTS.mkdir(parents=True, exist_ok=True)\n    m, sm = s[\"meta\"], s[\"summary\"]\n    lines = [f\"# Contract review: {m.get('counterparty', s['contract'])}\", \"\",\n             f\"*{m.get('contract_type', '')} · our role: {m.get('our_role')} · synthetic, not legal advice*\", \"\",\n             f\"**Rating: {sm['rating'].upper()}** · score {sm['risk_score']} · high {sm['high']} · medium {sm['medium']}\",\n             \"\"]\n    if sm[\"escalate\"]:\n        lines += [\"**Escalated to senior counsel:** \" + \"; \".join(sm[\"escalation_reasons\"]),\n                  f\"Sign-off: {s['signoff']}\", \"\"]\n    lines += [\"| Section | Type | Risk | Finding |\", \"|---|---|---|---|\"]\n    for c in sorted(s[\"clauses\"], key=lambda c: c[\"section\"]):\n        lines.append(f\"| {c['section']} | {c['clause_type']} | {c['risk']} | {c['finding']} |\")\n    for c in sorted(s[\"clauses\"], key=lambda c: c[\"section\"]):\n        if c[\"redline\"]:\n            lines += [\"\", f\"## {c['section']} — {c['risk']}\", f\"> {c['evidence']}\", \"\",\n                      c[\"explanation\"], \"\", f\"**Proposed redline:** {c['redline']}\"]\n    path = REPORTS / f\"{re.sub(r'[^A-Za-z0-9_-]', '_', s['contract'])}.md\"   # never trust ids in paths\n    path.write_text(\"\\n\".join(lines) + \"\\n\")\n    return {\"report_path\": str(path)}\n\n\ndef build(checkpointer=None):\n    g = StateGraph(ReviewState)\n    for name, fn in [(\"ingest\", ingest), (\"screen\", screen), (\"review_clause\", review_clause),\n                     (\"aggregate\", aggregate), (\"counsel_signoff\", counsel_signoff), (\"report\", report)]:\n        g.add_node(name, fn)\n    g.add_edge(START, \"ingest\")\n    g.add_edge(\"ingest\", \"screen\")\n    g.add_conditional_edges(\"screen\", fan_out, [\"review_clause\"])\n    g.add_edge(\"review_clause\", \"aggregate\")\n    g.add_edge(\"aggregate\", \"counsel_signoff\")\n    g.add_edge(\"counsel_signoff\", \"report\")\n    g.add_edge(\"report\", END)\n    return g.compile(checkpointer=checkpointer or MemorySaver())\n"}, {"name": "api.py", "lang": "python", "code": "\"\"\"REST API for contract review.\n\n  POST /reviews                {contract_id, text?}  -> runs review (pauses if escalated)\n  GET  /reviews/{id}           summary + clauses + report path\n  POST /reviews/{id}/signoff   {approved_by, decision} -> resumes escalated reviews\n  GET  /reviews/{id}/report    markdown report\n\nRun:  uvicorn projects.legal_contract_review.api:app --port 8002\n\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nfrom fastapi import FastAPI, HTTPException\nfrom fastapi.responses import PlainTextResponse\nfrom langgraph.types import Command\nfrom pydantic import BaseModel\n\nfrom .graph import build\n\napp = FastAPI(title=\"Contract Review Agent\", version=\"1.0.0\")\ngraph = build()\n\n\nclass ReviewRequest(BaseModel):\n    contract_id: str\n    text: str | None = None      # markdown with '## N. Title' sections; omit to use the sample library\n\n\nclass Signoff(BaseModel):\n    approved_by: str\n    decision: str\n\n\ndef _cfg(cid: str) -> dict:\n    return {\"configurable\": {\"thread_id\": f\"api-{cid}\"}}\n\n\ndef _view(cid: str) -> dict:\n    snap = graph.get_state(_cfg(cid))\n    if not snap.values:\n        raise HTTPException(404, \"unknown review\")\n    v = snap.values\n    return {\"contract_id\": cid, \"waiting_for\": list(snap.next), \"summary\": v.get(\"summary\"),\n            \"clauses\": v.get(\"clauses\"), \"report_path\": v.get(\"report_path\")}\n\n\n@app.get(\"/health\")\ndef health() -> dict:\n    return {\"ok\": True}\n\n\n@app.post(\"/reviews\")\ndef create(req: ReviewRequest) -> dict:\n    state = {\"contract\": req.contract_id, \"clauses\": []}\n    if req.text:\n        state[\"text\"] = req.text\n    graph.invoke(state, _cfg(req.contract_id))\n    return _view(req.contract_id)\n\n\n@app.get(\"/reviews/{cid}\")\ndef get(cid: str) -> dict:\n    return _view(cid)\n\n\n@app.post(\"/reviews/{cid}/signoff\")\ndef signoff(cid: str, body: Signoff) -> dict:\n    if \"counsel_signoff\" not in _view(cid)[\"waiting_for\"]:\n        raise HTTPException(409, \"review is not awaiting sign-off\")\n    graph.invoke(Command(resume=body.model_dump()), _cfg(cid))\n    return _view(cid)\n\n\n@app.get(\"/reviews/{cid}/report\", response_class=PlainTextResponse)\ndef get_report(cid: str) -> str:\n    path = _view(cid)[\"report_path\"]\n    if not path:\n        raise HTTPException(409, \"report not ready (awaiting sign-off?)\")\n    return Path(path).read_text()\n"}, {"name": "playbook_rules.py", "lang": "python", "code": "\"\"\"Our negotiation playbook expressed as executable, explainable rules (we are the customer).\n\nThe LLM is good at reading messy clauses; code is better at applying thresholds consistently.\nEach rule returns (risk, finding, escalate) and the finding quotes the numbers it used.\nThresholds mirror data/legal/playbook.md - keep them in sync (a test enforces the key ones).\n\"\"\"\nfrom __future__ import annotations\n\nimport re\n\nRisk = tuple[str, str, bool]   # (low|medium|high, finding, escalate_to_senior_counsel)\n\n\ndef _num_before(text: str, unit: str) -> int | None:\n    \"\"\"'ninety (90) days' / '12 months' -> 90 / 12 (first match).\"\"\"\n    unit = unit.rstrip(\"s\") + \"s?\"                     # month / months\n    m = re.search(rf\"\\((\\d+)\\)\\s*{unit}\\b|(\\d+)\\s*{unit}\\b\", text, re.I)\n    return int(m.group(1) or m.group(2)) if m else None\n\n\ndef liability(t: str) -> Risk:\n    months = _num_before(t, \"months\")\n    one_sided = re.search(r\"provider's aggregate liability|supplier's aggregate liability\", t, re.I) \\\n        and not re.search(r\"each party|either party\", t, re.I)\n    covers_data = re.search(r\"limitations apply to breaches of[^.]*data protection\", t, re.I)\n    issues = []\n    if months is not None and months < 12:\n        issues.append(f\"cap = {months} months of fees (standard 12)\")\n    if one_sided:\n        issues.append(\"cap protects provider only\")\n    if covers_data:\n        issues.append(\"cap applies to data-protection breaches (must be carved out)\")\n    if not re.search(r\"does not apply|shall not apply|excluding|except\", t, re.I):\n        issues.append(\"no carve-outs\")\n    if not issues:\n        return \"low\", f\"mutual {months}-month cap with carve-outs\", False\n    return \"high\", \"; \".join(issues), bool(months is not None and months < 6)\n\n\ndef indemnification(t: str) -> Risk:\n    one_way = re.search(r\"customer shall indemnify\", t, re.I) and not re.search(r\"each party shall indemnify\", t, re.I)\n    no_ip = re.search(r\"no obligation to indemnify[^.]*intellectual property\", t, re.I) or \\\n        not re.search(r\"(supplier|provider) shall indemnify[^.]*intellectual property\", t, re.I)\n    issues = ([\"one-way indemnity from us\"] if one_way else []) + ([\"no IP indemnity from supplier\"] if no_ip else [])\n    return (\"high\", \"; \".join(issues), False) if issues else (\"low\", \"mutual indemnities incl. supplier IP\", False)\n\n\ndef termination(t: str) -> Risk:\n    supplier_only = re.search(r\"provider may terminate[^.]*convenience\", t, re.I) and not re.search(\n        r\"either party may terminate[^.]*convenience\", t, re.I)\n    cure = [int(x) for x in re.findall(r\"(?:uncured|cured)[^.]*?\\((\\d+)\\)\\s*days\", t, re.I)]\n    long_cure = any(c > 30 for c in cure)\n    issues = ([\"supplier-only termination for convenience\"] if supplier_only else []) + \\\n             ([f\"cure period {max(cure)} days (standard 30)\"] if long_cure else [])\n    return (\"high\", \"; \".join(issues), False) if issues else (\"low\", \"mutual termination rights, 30-day cure\", False)\n\n\ndef renewal(t: str) -> Risk:\n    if not re.search(r\"automatic|renews\", t, re.I) or re.search(r\"requires a written amendment\", t, re.I):\n        return \"low\", \"no auto-renewal\", False\n    notice = _num_before(t, \"days\")\n    issues = ([f\"non-renewal notice {notice} days (max 60)\"] if notice and notice > 60 else [])\n    return (\"high\", \"; \".join(issues), False) if issues else (\"low\", f\"auto-renewal with {notice}-day notice\", False)\n\n\ndef payment(t: str) -> Risk:\n    days = _num_before(t, \"days\")\n    interest = re.search(r\"([\\d.]+)% per month\", t)\n    inc = re.search(r\"increase fees by up to (\\d+)%\", t, re.I)\n    issues = []\n    if days is not None and days < 30:\n        issues.append(f\"payment due in {days} days (min 30)\")\n    if interest and float(interest.group(1)) > 1.0:\n        issues.append(f\"late interest {interest.group(1)}%/month (max 1%)\")\n    if inc and int(inc.group(1)) > 5:\n        issues.append(f\"renewal price increase up to {inc.group(1)}% (max 5%)\")\n    return (\"high\", \"; \".join(issues), False) if issues else (\"low\", f\"net {days} days\", False)\n\n\ndef data_protection(t: str) -> Risk:\n    issues = []\n    if re.search(r\"commercially reasonable\", t, re.I) and not re.search(r\"ISO 27001|SOC 2\", t, re.I):\n        issues.append(\"vague security standard (need ISO 27001 / SOC 2)\")\n    if re.search(r\"reasonable time\", t, re.I) or not re.search(r\"72 hours\", t, re.I):\n        issues.append(\"no fixed breach-notification deadline (need 72h)\")\n    return (\"high\", \"; \".join(issues), False) if issues else (\"low\", \"meets security + 72h notice\", False)\n\n\ndef non_solicit(t: str) -> Risk:\n    months = _num_before(t, \"months\")\n    general_exception = re.search(r\"general (job )?(advertisement|solicitation)\", t, re.I)\n    issues = ([f\"{months}-month non-solicit (max 12)\"] if months and months > 12 else []) + \\\n             ([] if general_exception else [\"no general-advertisement exception\"])\n    if not issues:\n        return \"low\", \"within playbook\", False\n    return (\"medium\", \"; \".join(issues), False)\n\n\ndef governing_law(t: str) -> Risk:\n    ok = re.search(r\"New York|Delaware|England and Wales\", t, re.I)\n    return (\"low\", f\"acceptable jurisdiction ({ok.group(0)})\", False) if ok else (\"medium\", \"non-standard jurisdiction\", False)\n\n\ndef confidentiality(t: str) -> Risk:\n    years = _num_before(t, \"years\")\n    if years is not None and years < 2:\n        return \"high\", f\"survival {years} years (min 2)\", False\n    return \"low\", \"standard confidentiality terms\", False\n\n\nRULES = {\"limitation_of_liability\": liability, \"indemnification\": indemnification, \"termination\": termination,\n         \"term_renewal\": renewal, \"payment_terms\": payment, \"data_protection\": data_protection,\n         \"non_solicitation\": non_solicit, \"governing_law\": governing_law, \"confidentiality\": confidentiality}\n\nREDLINES = {\n    \"limitation_of_liability\": \"Each party's aggregate liability shall not exceed the fees paid or payable in the twelve (12) months preceding the claim. The cap shall not apply to breaches of confidentiality or data protection, indemnification obligations, or gross negligence or wilful misconduct.\",\n    \"indemnification\": \"Each party shall indemnify the other against third-party claims arising from its breach or negligence. Provider shall defend and indemnify Customer against third-party claims that the Services infringe intellectual property rights.\",\n    \"termination\": \"Either party may terminate for convenience on sixty (60) days written notice, or for material breach not cured within thirty (30) days of written notice.\",\n    \"term_renewal\": \"This Agreement renews for successive twelve (12) month terms unless either party gives notice of non-renewal at least sixty (60) days before the end of the then-current term.\",\n    \"payment_terms\": \"Customer shall pay undisputed invoices within forty-five (45) days of receipt. Late amounts accrue interest at no more than 1% per month. Fee increases on renewal shall not exceed 5%.\",\n    \"data_protection\": \"Provider shall maintain security controls certified to ISO 27001 or SOC 2 Type II and notify Customer of any security breach affecting Customer Data within seventy-two (72) hours.\",\n    \"non_solicitation\": \"For twelve (12) months, neither party shall solicit the other's employees, provided that general job advertisements not targeted at such employees are permitted.\",\n    \"governing_law\": \"This Agreement is governed by the laws of the State of New York.\",\n}\n\n\ndef assess_clause(clause_type: str, text: str) -> Risk:\n    rule = RULES.get(clause_type)\n    return rule(text) if rule else (\"low\", \"no playbook position\", False)\n"}, {"name": "run.py", "lang": "python", "code": "\"\"\"Review all synthetic contracts, evaluate against labelled clauses, write reports.\n\nRun:  python -m projects.legal_contract_review.run\n\"\"\"\nfrom __future__ import annotations\n\nfrom langgraph.types import Command\n\nfrom common.domain import list_contracts, load_clause_labels\nfrom common.llm import get_llm\n\nfrom .graph import build\n\n\ndef review(app, contract: str, counsel: str = \"senior-counsel-demo\") -> dict:\n    cfg = {\"configurable\": {\"thread_id\": f\"review-{contract}\"}}\n    out = app.invoke({\"contract\": contract, \"clauses\": []}, cfg)\n    while \"__interrupt__\" in out:\n        out = app.invoke(Command(resume={\"approved_by\": counsel, \"decision\": \"negotiate redlines\"}), cfg)\n    return out\n\n\ndef main() -> None:\n    print(f\"LLM mode: {get_llm().mode}\\n\")\n    app = build()\n    labels = {(l[\"contract\"], l[\"section\"]): l for l in load_clause_labels()}\n    type_ok = risk_ok = n = 0\n    for contract in list_contracts():\n        out = review(app, contract)\n        sm = out[\"summary\"]\n        print(f\"{contract:<18} rating={sm['rating']:<6} score={sm['risk_score']:<3} high={sm['high']} \"\n              f\"medium={sm['medium']} escalate={sm['escalate']}  -> {out['report_path'].split('agentic-ai-course/')[-1]}\")\n        for c in out[\"clauses\"]:\n            lab = labels.get((contract, c[\"section\"]))\n            if lab:\n                n += 1\n                type_ok += c[\"clause_type\"] == lab[\"clause_type\"]\n                risk_ok += c[\"risk\"] == lab[\"risk\"]\n    print(f\"\\nclause type accuracy {type_ok}/{n} · risk accuracy {risk_ok}/{n}\")\n    print(\"\\n--- excerpt: runs/legal_reports/acme-saas-msa.md ---\")\n    from common import RUNS\n    print(\"\\n\".join((RUNS / \"legal_reports\" / \"acme-saas-msa.md\").read_text().splitlines()[:22]))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "Dockerfile", "lang": "dockerfile", "code": "# Build from the repository root:  docker build -f projects/legal_contract_review/Dockerfile -t contract-review .\nFROM python:3.11-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY common/ common/\nCOPY data/legal/ data/legal/\nCOPY projects/legal_contract_review/ projects/legal_contract_review/\nENV PYTHONUNBUFFERED=1\nRUN useradd -m app && mkdir -p runs && chown app runs\nUSER app\nEXPOSE 8002\nHEALTHCHECK CMD python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/health')\"\nCMD [\"uvicorn\", \"projects.legal_contract_review.api:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8002\"]\n"}], "folder": "projects/legal_contract_review"}, {"title": "Capstone 3 — AIOps Operations Agents", "meta": {}, "html": "<blockquote>\n<p>Telemetry, services and runbooks are <strong>synthetic<\/strong>. Actions are simulated but go through a real approval and idempotency path.<\/p>\n<\/blockquote>\n<p>An SRE team is paged by an alert storm: 7 alerts across checkout, payments, inventory, and a batch worker. A <strong>supervisor<\/strong> coordinates four specialist agents:<\/p>\n<ul>\n<li><strong>Triage<\/strong> deduplicates and correlates the alerts into incidents.<\/li>\n<li><strong>Investigator<\/strong> walks the dependency graph with read-only tools to find the origin service, then explains it with logs and deploy history.<\/li>\n<li><strong>Remediation<\/strong> picks the matching runbook and turns it into a concrete action under a change policy.<\/li>\n<li><strong>Comms<\/strong> writes status updates and a blameless postmortem.<\/li>\n<\/ul>\n<p>Risky actions pause for the on-call human.<\/p>\n<p><strong>Autonomy: L2–L3 by policy.<\/strong> Low-risk actions on tier-2/3 services run automatically. Anything on tier 1, and every rollback, needs a human.<\/p>\n<p><strong>Classes used:<\/strong> 1 (agent loop), 5 (tool engineering, approval interrupts, idempotency), 6 (the same tools also exposed over MCP), 7 (trajectory eval), 11 (tracing and audit), 12 (multi-agent orchestration).<\/p>\n<h2 id=\"s0\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s1\">Process flow<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s2\">Results (offline)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Incident<\/th>\n<th>Triage<\/th>\n<th>Root cause found<\/th>\n<th>Remediation<\/th>\n<th>Approval<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>INC-4471 checkout + payments 5xx/latency<\/td>\n<td>SEV1 (1 duplicate dropped)<\/td>\n<td>payments-svc v2.14.0 cut the DB pool from 50 to 5 (checkout is downstream)<\/td>\n<td>rollback to v2.13.4 (RB-DB-003)<\/td>\n<td>On-call human<\/td>\n<\/tr>\n<tr>\n<td>INC-4472 inventory memory<\/td>\n<td>SEV2<\/td>\n<td>Memory leak since v5.2.1 (cache without eviction)<\/td>\n<td>rolling restart (RB-APP-007)<\/td>\n<td>Auto by policy<\/td>\n<\/tr>\n<tr>\n<td>INC-4473 batch-worker disk<\/td>\n<td>SEV3<\/td>\n<td>Uncompressed rotated logs<\/td>\n<td>cleanup /var/log/batch (RB-OS-002)<\/td>\n<td>Auto by policy<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Root-cause accuracy is 3/3. There are 19 audited tool calls, including 3 write actions. A rejected rollback is recorded as <code>not_executed<\/code> with the reason, and the run continues with the next incident.<\/p>\n<h2 id=\"s3\">Files<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>tools.py<\/code><\/td>\n<td>Read and write tools with risk levels, allow-listed paths and idempotency<\/td>\n<\/tr>\n<tr>\n<td><code>agents.py<\/code><\/td>\n<td>Triage, Investigator, Remediation and Comms agents with typed outputs<\/td>\n<\/tr>\n<tr>\n<td><code>supervisor.py<\/code><\/td>\n<td>LangGraph supervisor loop with approval interrupt, execute, verify, communicate<\/td>\n<\/tr>\n<tr>\n<td><code>run.py<\/code><\/td>\n<td>Replays the alert storm and checks root-cause accuracy<\/td>\n<\/tr>\n<tr>\n<td><code>api.py<\/code><\/td>\n<td>Webhook plus approval REST API<\/td>\n<\/tr>\n<tr>\n<td><code>Dockerfile<\/code><\/td>\n<td>Container image<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s4\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m projects.aiops_agents.run                 # on-call approvals auto-granted (demo)\npython -m projects.aiops_agents.run --interactive   # you are the on-call\nuvicorn projects.aiops_agents.api:app --port 8003\ncurl -X POST localhost:8003/alerts -H 'content-type: application/json' -d '{}'\n<\/code><\/pre>\n<h2 id=\"s5\">Extensions<\/h2>\n<ul>\n<li>Swap the synthetic telemetry for Prometheus, Loki and Argo CD APIs behind the same tool signatures.<\/li>\n<li>Post approvals to Slack or Teams with approve and reject buttons that call <code>/runs/{id}/approval<\/code>.<\/li>\n<li>Add a \"forward fix\" path: open a PR that reverts the pool-size change instead of rolling back.<\/li>\n<li>Turn every resolved incident into a trajectory-eval case (Class 7) so regressions in the investigator are caught.<\/li>\n<\/ul>", "diagrams": ["flowchart LR\n    AM[Alertmanager / monitoring<br/>webhook] --> API[FastAPI /alerts]\n    API --> SUP[Supervisor<br/>LangGraph · checkpointed]\n    SUP --> TA[Triage agent<br/>dedupe · correlate · severity]\n    SUP --> IA[Investigator agent<br/>ReAct over read tools]\n    SUP --> RA[Remediation agent<br/>runbook RAG + change policy]\n    SUP --> CA[Comms agent<br/>status · postmortem]\n    IA --> RT[Read tools<br/>metric_summary · search_logs · recent_deploys]\n    RA --> RB[(Runbook index)]\n    SUP --> GATE{{Approval interrupt<br/>tier-1 / rollback}}\n    GATE <--> OC[/On-call via REST or ChatOps/]\n    GATE --> WT[Write tools<br/>rollback · rolling_restart · cleanup_disk<br/>idempotency keys]\n    RT & WT --> REG[Tool registry<br/>validation · audit]\n    REG --> OBS[(Metrics · Logs · Deploys · CD API)]\n    CA --> PM[(Postmortems<br/>runs/aiops/)]\n    MCP[MCP server<br/>Class 6] -.same read tools.-> RT", "sequenceDiagram\n    participant M as Monitoring\n    participant S as Supervisor\n    participant T as Triage\n    participant I as Investigator\n    participant R as Remediation\n    participant H as On-call\n    participant C as Comms\n    M->>S: 7 alerts\n    S->>T: dedupe + correlate\n    T-->>S: 3 incidents (SEV1, SEV2, SEV3), 1 duplicate dropped\n    loop each incident\n        S->>I: investigate(incident)\n        I->>I: metric_summary over dependency graph\n        I->>I: search_logs(origin), recent_deploys(origin)\n        I-->>S: hypothesis + evidence + confidence\n        S->>R: plan(hypothesis)\n        R-->>S: action + runbook + approval needed?\n        alt tier-1 or rollback\n            S->>H: interrupt: approve rollback?\n            H-->>S: approve / reject + reason\n        else low risk, tier 2-3\n            S->>S: auto-approve (change policy)\n        end\n        S->>S: execute (idempotent) + verify\n        S->>C: status update + postmortem\n    end"], "toc": ["Architecture", "Process flow", "Results (offline)", "Files", "Run it", "Extensions"], "slug": "aiops_agents", "domain": "IT Operations", "short": "AIOps Agents", "pattern": "Supervisor + 4 specialists", "metric": "3/3 root causes · 1 duplicate alert dropped", "files": [{"name": "supervisor.py", "lang": "python", "code": "\"\"\"AIOps supervisor: orchestrates the specialist agents as a LangGraph state machine.\n\n  triage -> next_incident -> investigate -> plan_remediation -> approval? -> execute -> verify\n         -> communicate -> next_incident ... -> END\n\nThe supervisor owns control flow and policy (loop, approvals, budgets); the agents own\nexpertise. Everything is checkpointed per run so an approval can arrive later.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport operator\nfrom typing import Annotated, TypedDict\n\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.graph import END, START, StateGraph\nfrom langgraph.types import interrupt\n\nfrom common import RUNS\nfrom common.domain import load_telemetry\nfrom common.tracing import traced\n\nfrom .agents import (ActionPlan, CommsAgent, Hypothesis, Incident, InvestigatorAgent, RemediationAgent,\n                     TriageAgent)\nfrom .tools import make_registry\n\nOUT = RUNS / \"aiops\"\nREG = make_registry(approver=lambda t, a: True)      # approval is enforced by the graph interrupt\n\n\nclass OpsState(TypedDict, total=False):\n    alerts: list[dict]\n    queue: list[dict]\n    dropped: list[str]\n    current: dict | None\n    hypothesis: dict\n    plan: dict\n    approval: dict\n    outcome: dict\n    done: Annotated[list[dict], operator.add]\n\n\n@traced(\"aiops.triage\", \"agent\")\ndef triage(s: OpsState) -> dict:\n    incidents, dropped = TriageAgent().run(s[\"alerts\"])\n    return {\"queue\": [i.model_dump() for i in incidents], \"dropped\": dropped}\n\n\ndef next_incident(s: OpsState) -> dict:\n    q = list(s[\"queue\"])\n    return {\"current\": q.pop(0) if q else None, \"queue\": q}\n\n\n@traced(\"aiops.investigate\", \"agent\")\ndef investigate(s: OpsState) -> dict:\n    agent = InvestigatorAgent(REG)\n    h = agent.run(Incident(**s[\"current\"]))\n    return {\"hypothesis\": {**h.model_dump(), \"tool_calls\": agent.calls}}\n\n\n@traced(\"aiops.plan\", \"agent\")\ndef plan_remediation(s: OpsState) -> dict:\n    h = Hypothesis(**{k: v for k, v in s[\"hypothesis\"].items() if k != \"tool_calls\"})\n    return {\"plan\": RemediationAgent().run(Incident(**s[\"current\"]), h).model_dump()}\n\n\ndef approval(s: OpsState) -> dict:\n    p = s[\"plan\"]\n    if not p[\"requires_approval\"]:\n        return {\"approval\": {\"approved\": True, \"by\": \"change-policy:auto\"}}\n    d = interrupt({\"incident\": s[\"current\"][\"id\"], \"severity\": s[\"current\"][\"severity\"],\n                   \"hypothesis\": s[\"hypothesis\"][\"cause\"], \"plan\": p})\n    return {\"approval\": d}\n\n\n@traced(\"aiops.execute\", \"tool\")\ndef execute(s: OpsState) -> dict:\n    p, a = s[\"plan\"], s[\"approval\"]\n    if p[\"action\"] == \"escalate\" or not a.get(\"approved\"):\n        return {\"outcome\": {\"status\": \"not_executed\", \"reason\": a.get(\"reason\", \"escalated to human\")}}\n    r = REG.call(p[\"action\"], p[\"args\"], actor=a.get(\"by\", \"unknown\"))\n    return {\"outcome\": r.output if r.ok else {\"status\": \"failed\", \"error\": r.error}}\n\n\ndef verify(s: OpsState) -> dict:\n    \"\"\"Simulated post-action check: in production, poll the same metrics until they recover or time out.\"\"\"\n    ok = s[\"outcome\"].get(\"status\") == \"succeeded\"\n    return {\"outcome\": {**s[\"outcome\"], \"verified\": ok,\n                        \"check\": \"error rate / memory / disk back within SLO\" if ok else \"not verified\"}}\n\n\n@traced(\"aiops.communicate\", \"agent\")\ndef communicate(s: OpsState) -> dict:\n    inc = Incident(**s[\"current\"])\n    h = Hypothesis(**{k: v for k, v in s[\"hypothesis\"].items() if k != \"tool_calls\"})\n    p = ActionPlan(**s[\"plan\"])\n    comms = CommsAgent()\n    OUT.mkdir(parents=True, exist_ok=True)\n    pm = comms.postmortem(inc, h, p, s[\"outcome\"], s[\"approval\"].get(\"by\"))\n    (OUT / f\"{inc.id}-postmortem.md\").write_text(pm)\n    return {\"done\": [{\"incident\": inc.model_dump(), \"hypothesis\": s[\"hypothesis\"], \"plan\": s[\"plan\"],\n                      \"approval\": s[\"approval\"], \"outcome\": s[\"outcome\"],\n                      \"status_update\": comms.status_update(inc, h, p, s[\"outcome\"]),\n                      \"postmortem\": str(OUT / f\"{inc.id}-postmortem.md\")}]}\n\n\ndef build(checkpointer=None):\n    g = StateGraph(OpsState)\n    for name, fn in [(\"triage\", triage), (\"next_incident\", next_incident), (\"investigate\", investigate),\n                     (\"plan_remediation\", plan_remediation), (\"approval\", approval), (\"execute\", execute),\n                     (\"verify\", verify), (\"communicate\", communicate)]:\n        g.add_node(name, fn)\n    g.add_edge(START, \"triage\")\n    g.add_edge(\"triage\", \"next_incident\")\n    g.add_conditional_edges(\"next_incident\", lambda s: \"investigate\" if s[\"current\"] else END)\n    g.add_edge(\"investigate\", \"plan_remediation\")\n    g.add_edge(\"plan_remediation\", \"approval\")\n    g.add_edge(\"approval\", \"execute\")\n    g.add_edge(\"execute\", \"verify\")\n    g.add_edge(\"verify\", \"communicate\")\n    g.add_edge(\"communicate\", \"next_incident\")\n    return g.compile(checkpointer=checkpointer or MemorySaver())\n\n\ndef initial_state() -> OpsState:\n    return {\"alerts\": load_telemetry()[\"alerts\"], \"queue\": [], \"done\": []}\n\n\nif __name__ == \"__main__\":\n    print(json.dumps(build().get_graph().draw_mermaid()))\n"}, {"name": "agents.py", "lang": "python", "code": "\"\"\"The four specialist agents. Each has a narrow job, its own tools and its own output schema.\n\n  TriageAgent       alerts -> deduplicated, correlated incidents with severity\n  InvestigatorAgent incident -> ranked root-cause hypotheses with evidence (read-only tools)\n  RemediationAgent  hypothesis -> runbook-backed action plan with risk + approval requirement\n  CommsAgent        incident record -> status update + postmortem draft\n\nOnline, the investigator and comms agents use the LLM (tool calling / writing); offline they\nuse transparent heuristics so the whole pipeline is runnable and testable.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom datetime import datetime\n\nfrom pydantic import BaseModel, Field\n\nfrom common import DATA\nfrom common.domain import load_telemetry\nfrom common.llm import get_llm\nfrom common.retrieval import HybridRetriever, chunk_markdown, load_markdown_dir\n\nfrom .tools import dependencies, metric_summary, recent_deploys, search_logs, topology\n\nSEV_BY_TIER = {1: \"SEV1\", 2: \"SEV2\", 3: \"SEV3\"}\n\n\ndef _t(ts: str) -> datetime:\n    return datetime.fromisoformat(ts.replace(\"Z\", \"+00:00\"))\n\n\n# ============================================================================= triage\nclass Incident(BaseModel):\n    id: str\n    services: list[str]\n    alerts: list[str]\n    severity: str\n    started: str\n    title: str\n\n\nclass TriageAgent:\n    \"\"\"Dedupe -> correlate by dependency graph + time window -> severity from service tier.\"\"\"\n\n    def __init__(self, window_min: int = 5):\n        self.window = window_min\n\n    def run(self, alerts: list[dict]) -> tuple[list[Incident], list[str]]:\n        seen, uniq, dropped = set(), [], []\n        for a in sorted(alerts, key=lambda a: a[\"ts\"]):\n            key = (a[\"service\"], a[\"name\"])\n            if key in seen:\n                dropped.append(a[\"alert_id\"])\n                continue\n            seen.add(key)\n            uniq.append(a)\n        groups: list[list[dict]] = []\n        topo = topology()\n        for a in uniq:\n            home = None\n            for g in groups:\n                related = any(a[\"service\"] == b[\"service\"] or a[\"service\"] in topo[b[\"service\"]][\"depends_on\"]\n                              or b[\"service\"] in topo[a[\"service\"]][\"depends_on\"] for b in g)\n                close = abs((_t(a[\"ts\"]) - _t(g[-1][\"ts\"])).total_seconds()) <= self.window * 60\n                if related and close:\n                    home = g\n                    break\n            (home.append(a) if home else groups.append([a]))\n        incidents = []\n        for i, g in enumerate(groups, 1):\n            svcs = list(dict.fromkeys(a[\"service\"] for a in g))\n            tier = min(topo[s][\"tier\"] for s in svcs)\n            crit = any(a[\"severity\"] == \"critical\" for a in g)\n            sev = SEV_BY_TIER[tier] if crit or tier > 1 else \"SEV2\"\n            incidents.append(Incident(id=f\"INC-{4470 + i}\", services=svcs, alerts=[a[\"alert_id\"] for a in g],\n                                      severity=sev, started=g[0][\"ts\"],\n                                      title=f\"{', '.join(sorted({a['name'] for a in g}))} on {', '.join(svcs)}\"))\n        return incidents, dropped\n\n\n# ============================================================================= investigation\nclass Hypothesis(BaseModel):\n    origin_service: str\n    cause: str\n    category: str                      # bad_deploy | memory_leak | disk_growth | unknown\n    confidence: float\n    evidence: list[str] = Field(default_factory=list)\n    suspect_deploy: dict | None = None\n\n\nclass InvestigatorAgent:\n    \"\"\"Walk the dependency graph from symptomatic services to the deepest anomalous one,\n    then explain it with logs and deploy history.\"\"\"\n\n    def __init__(self, registry):\n        self.reg = registry\n        self.calls: list[str] = []\n\n    def _call(self, name: str, **args):\n        self.calls.append(name)\n        r = self.reg.call(name, args, actor=\"investigator\")\n        return r.output\n\n    def run(self, inc: Incident) -> Hypothesis:\n        # breadth-first over the incident services and their dependencies\n        frontier, summaries = list(inc.services), {}\n        while frontier:\n            s = frontier.pop(0)\n            if s in summaries:\n                continue\n            summaries[s] = self._call(\"metric_summary\", service=s)[\"metrics\"]\n            frontier += dependencies(s)\n        anomalous = {s for s, m in summaries.items() if any(v[\"anomalous\"] for v in m.values())}\n        # origin = anomalous service none of whose dependencies are anomalous\n        # rank: prefer services named in the incident, then the strongest anomaly (deterministic)\n        origins = [s for s in anomalous if not set(dependencies(s)) & anomalous] or list(inc.services)\n        origins.sort(key=lambda s: (s not in inc.services,\n                                    -max((v[\"ratio\"] for v in summaries[s].values() if v[\"anomalous\"]), default=0), s))\n        origin = origins[0]\n        m = summaries[origin]\n        evidence = [f\"{origin} {k}: {v['baseline']} -> {v['current']} (x{v['ratio']}, from {v['changed_at']})\"\n                    for k, v in m.items() if v[\"anomalous\"]]\n        downstream = sorted(s for s in anomalous if s != origin and origin in _transitive_deps(s))\n        if downstream:\n            evidence.append(f\"downstream symptoms (depend on {origin}): {downstream}\")\n        unrelated = sorted(anomalous - {origin} - set(downstream))\n        if unrelated:\n            evidence.append(f\"other anomalies in scope, tracked separately: {unrelated}\")\n        logs = self._call(\"search_logs\", service=origin, level=\"ERROR\")[\"signatures\"] or \\\n            self._call(\"search_logs\", service=origin, level=\"WARN\")[\"signatures\"]\n        evidence += [f\"log x{l['count']}: {l['pattern'][:110]}\" for l in logs[:2]]\n        deploys = self._call(\"recent_deploys\", service=origin)[\"deploys\"]\n        change_ts = min((v[\"changed_at\"] for v in m.values() if v[\"anomalous\"]), default=inc.started)\n        suspect = next((d for d in deploys if _t(d[\"ts\"]) <= _t(change_ts) and\n                        (_t(change_ts) - _t(d[\"ts\"])).total_seconds() < 24 * 3600), None)\n\n        def offline() -> Hypothesis:\n            if \"disk_used_pct\" in m and m[\"disk_used_pct\"][\"anomalous\"]:\n                return Hypothesis(origin_service=origin, category=\"disk_growth\", confidence=0.8, evidence=evidence,\n                                  cause=\"Log volume growth filled the disk (rotated logs not compressed).\")\n            if suspect and \"memory_pct\" in m and m[\"memory_pct\"][\"steady_rise\"]:\n                return Hypothesis(origin_service=origin, category=\"memory_leak\", confidence=0.75, evidence=evidence\n                                  + [f\"deploy {suspect['version']} at {suspect['ts']}: {suspect['change']}\"],\n                                  suspect_deploy=suspect,\n                                  cause=f\"Unbounded memory growth since {suspect['version']} ({suspect['change']}).\")\n            if suspect:\n                return Hypothesis(origin_service=origin, category=\"bad_deploy\", confidence=0.9, evidence=evidence\n                                  + [f\"deploy {suspect['version']} at {suspect['ts']}: {suspect['change']}\"],\n                                  suspect_deploy=suspect,\n                                  cause=f\"Deploy {suspect['version']} of {origin} ({suspect['change']}) \"\n                                        f\"preceded the anomaly at {change_ts}.\")\n            return Hypothesis(origin_service=origin, category=\"unknown\", confidence=0.3, evidence=evidence,\n                              cause=\"No change correlated; needs human investigation.\")\n\n        return get_llm().structured(\n            \"You are an SRE. From this evidence, state the most likely root cause.\\n\"\n            + json.dumps({\"incident\": inc.model_dump(), \"metrics\": summaries, \"logs\": logs, \"deploys\": deploys}),\n            Hypothesis, fallback=offline)\n\n\ndef _transitive_deps(service: str) -> set[str]:\n    out, stack = set(), list(dependencies(service))\n    while stack:\n        d = stack.pop()\n        if d not in out:\n            out.add(d)\n            stack += dependencies(d)\n    return out\n\n\n# ============================================================================= remediation\nclass ActionPlan(BaseModel):\n    action: str                        # rollback | rolling_restart | cleanup_disk | escalate\n    args: dict\n    runbook: str\n    risk: str                          # low | medium | high\n    requires_approval: bool\n    rationale: str\n\n\nRUNBOOKS = HybridRetriever([c for d, t in load_markdown_dir(DATA / \"aiops\" / \"runbooks\") for c in chunk_markdown(d, t)])\n\n\nclass RemediationAgent:\n    \"\"\"Retrieve the matching runbook, map it to a concrete action, and apply the change policy:\n    tier-1 services or rollbacks need a human; low-risk actions on tier 2-3 may auto-run.\"\"\"\n\n    def run(self, inc: Incident, h: Hypothesis) -> ActionPlan:\n        hits = RUNBOOKS.search(f\"{h.cause} {h.category.replace('_', ' ')} {' '.join(h.evidence)[:300]}\", k=1)\n        rb = hits[0][0].meta if hits else {\"runbook_id\": \"none\", \"risk\": \"high\"}\n        tier = topology()[h.origin_service][\"tier\"]\n        key = f\"{inc.id}-{h.category}\"\n        if h.category == \"bad_deploy\" and h.suspect_deploy:\n            action, args = \"rollback\", {\"service\": h.origin_service,\n                                        \"to_version\": h.suspect_deploy[\"previous_version\"], \"idempotency_key\": key}\n        elif h.category == \"memory_leak\":\n            action, args = \"rolling_restart\", {\"service\": h.origin_service, \"idempotency_key\": key}\n        elif h.category == \"disk_growth\":\n            action, args = \"cleanup_disk\", {\"service\": h.origin_service, \"path\": \"/var/log/batch\",\n                                            \"older_than_days\": 7, \"idempotency_key\": key}\n        else:\n            action, args = \"escalate\", {}\n        risk = rb.get(\"risk\", \"high\") if action != \"rollback\" else \"medium\"\n        needs_human = action in (\"rollback\", \"escalate\") or tier == 1 or risk != \"low\"\n        return ActionPlan(action=action, args=args, runbook=rb.get(\"runbook_id\", \"none\"), risk=risk,\n                          requires_approval=needs_human,\n                          rationale=f\"{rb.get('runbook_id')} matches '{h.category}'; tier-{tier} service; \"\n                                    f\"{'human approval required' if needs_human else 'auto-approved by change policy'}.\")\n\n\n# ============================================================================= comms\nclass CommsAgent:\n    def status_update(self, inc: Incident, h: Hypothesis, plan: ActionPlan, outcome: dict) -> str:\n        def offline():\n            return (f\"[{inc.severity}] {inc.id} {inc.title}. Likely cause: {h.cause} \"\n                    f\"Action: {plan.action} ({outcome.get('status', 'pending')}). Next update in 30 min.\")\n        return get_llm().chat(f\"Write a 3-sentence incident status update for stakeholders: \"\n                              f\"{inc.model_dump()} {h.model_dump()} {plan.model_dump()} {outcome}\", fallback=offline)\n\n    def postmortem(self, inc: Incident, h: Hypothesis, plan: ActionPlan, outcome: dict, approver: str | None) -> str:\n        tel = load_telemetry()\n        timeline = [f\"- {a['ts']} alert {a['alert_id']} {a['name']} on {a['service']} ({a['value']})\"\n                    for a in tel[\"alerts\"] if a[\"alert_id\"] in inc.alerts]\n        if h.suspect_deploy:\n            timeline.insert(0, f\"- {h.suspect_deploy['ts']} deploy {h.suspect_deploy['version']} of \"\n                               f\"{h.suspect_deploy['service']}: {h.suspect_deploy['change']}\")\n        timeline.append(f\"- action {plan.action} {plan.args} -> {outcome.get('status')}\"\n                        f\"{' (approved by ' + approver + ')' if approver else ''}\")\n        return \"\\n\".join([f\"# Postmortem {inc.id}: {inc.title}\", \"\", \"*Blameless · draft generated by CommsAgent*\", \"\",\n                          f\"**Severity:** {inc.severity} · **Services:** {', '.join(inc.services)}\", \"\",\n                          \"## Root cause\", h.cause, f\"Confidence {h.confidence:.0%}.\", \"\",\n                          \"## Evidence\", *[f\"- {e}\" for e in h.evidence], \"\",\n                          \"## Timeline (UTC)\", *sorted(timeline), \"\",\n                          \"## Resolution\", plan.rationale, \"\",\n                          \"## Action items\",\n                          \"- Add a pre-deploy check that diffs connection-pool and resource settings\"\n                          if h.category == \"bad_deploy\" else\n                          \"- Add eviction/limits to in-process caches and a memory-growth alert\"\n                          if h.category == \"memory_leak\" else\n                          \"- Enable log compression in logrotate and alert at 80% disk\",\n                          \"- Add this incident to the AIOps evaluation set (Class 7)\"])\n"}, {"name": "api.py", "lang": "python", "code": "\"\"\"AIOps service: Alertmanager-style webhook in, approvals via REST (or a ChatOps bot).\n\n  POST /alerts                     {alerts:[...]} -> triage + investigate; pauses on approvals\n  GET  /runs/{run_id}              incidents processed, pending approval\n  POST /runs/{run_id}/approval     {approved, by, reason?} -> resume\n\nRun:  uvicorn projects.aiops_agents.api:app --port 8003\n\"\"\"\nfrom __future__ import annotations\n\nimport uuid\n\nfrom fastapi import FastAPI, HTTPException\nfrom langgraph.types import Command\nfrom pydantic import BaseModel\n\nfrom common.domain import load_telemetry\n\nfrom .supervisor import build\n\napp = FastAPI(title=\"AIOps Agents\", version=\"1.0.0\")\ngraph = build()\n\n\nclass AlertBatch(BaseModel):\n    alerts: list[dict] | None = None     # omit to replay the synthetic alert storm\n\n\nclass Approval(BaseModel):\n    approved: bool\n    by: str\n    reason: str = \"\"\n\n\ndef _cfg(rid: str) -> dict:\n    return {\"configurable\": {\"thread_id\": rid}}\n\n\ndef _view(rid: str) -> dict:\n    snap = graph.get_state(_cfg(rid))\n    if not snap.values:\n        raise HTTPException(404, \"unknown run\")\n    pending = [t.interrupts[0].value for t in snap.tasks if t.interrupts]\n    v = snap.values\n    return {\"run_id\": rid, \"pending_approval\": pending[0] if pending else None,\n            \"queued\": [i[\"id\"] for i in v.get(\"queue\", [])],\n            \"done\": [{\"incident\": d[\"incident\"][\"id\"], \"cause\": d[\"hypothesis\"][\"cause\"],\n                      \"action\": d[\"plan\"][\"action\"], \"outcome\": d[\"outcome\"]} for d in v.get(\"done\", [])]}\n\n\n@app.get(\"/health\")\ndef health() -> dict:\n    return {\"ok\": True}\n\n\n@app.post(\"/alerts\")\ndef alerts(batch: AlertBatch) -> dict:\n    rid = f\"run-{uuid.uuid4().hex[:8]}\"\n    graph.invoke({\"alerts\": batch.alerts or load_telemetry()[\"alerts\"], \"queue\": [], \"done\": []}, _cfg(rid))\n    return _view(rid)\n\n\n@app.get(\"/runs/{rid}\")\ndef run(rid: str) -> dict:\n    return _view(rid)\n\n\n@app.post(\"/runs/{rid}/approval\")\ndef approve(rid: str, body: Approval) -> dict:\n    if not _view(rid)[\"pending_approval\"]:\n        raise HTTPException(409, \"nothing awaiting approval\")\n    graph.invoke(Command(resume=body.model_dump()), _cfg(rid))\n    return _view(rid)\n"}, {"name": "tools.py", "lang": "python", "code": "\"\"\"Operations tools shared by the AIOps agents (read tools + gated actions).\n\nReads come from the synthetic telemetry snapshot; actions are simulated but go through the\nsame registry (validation, risk level, approval, idempotency, audit) you would use for real\nKubernetes / CI-CD / cloud APIs.\n\"\"\"\nfrom __future__ import annotations\n\nimport statistics\nfrom typing import Literal\n\nfrom common.domain import load_telemetry\nfrom common.tools import ToolRegistry, tool\n\nTHRESHOLDS = {\"memory_pct\": 85, \"disk_used_pct\": 90}\nEXECUTED: dict[str, dict] = {}\n\n\ndef topology() -> dict:\n    return load_telemetry()[\"topology\"]\n\n\ndef dependencies(service: str) -> list[str]:\n    return topology()[service][\"depends_on\"]\n\n\n@tool()\ndef metric_summary(service: str) -> dict:\n    \"\"\"All metrics for a service: baseline, current, change ratio, change-point index, anomaly flag.\"\"\"\n    tel = load_telemetry()\n    out = {}\n    for name, s in tel[\"metrics\"][service].items():\n        base = statistics.mean(s[:4]) or 1e-9\n        ratio = round(s[-1] / base, 2)\n        diffs = [abs(s[i] - s[i - 1]) for i in range(1, len(s))]\n        cp = max(range(len(diffs)), key=diffs.__getitem__) + 1\n        rising = all(s[i] >= s[i - 1] for i in range(1, len(s)))\n        anomalous = (name in THRESHOLDS and s[-1] > THRESHOLDS[name]) or \\\n                    (name not in THRESHOLDS and name != \"db_pool_max\" and (ratio > 2.5 or ratio < 0.4))\n        out[name] = {\"baseline\": round(base, 2), \"current\": s[-1], \"ratio\": ratio,\n                     \"changed_at\": tel[\"timestamps\"][cp], \"steady_rise\": rising, \"anomalous\": anomalous}\n    return {\"service\": service, \"metrics\": out}\n\n\n@tool()\ndef search_logs(service: str, level: Literal[\"ERROR\", \"WARN\"] = \"ERROR\", limit: int = 3) -> dict:\n    \"\"\"Deduplicated log signatures (digits masked) with counts for a service and level.\"\"\"\n    import re\n    counts: dict[str, int] = {}\n    for l in load_telemetry()[\"logs\"]:\n        if l[\"service\"] == service and l[\"level\"] == level:\n            sig = re.sub(r\"\\d+(\\.\\d+)?\", \"N\", l[\"msg\"])\n            counts[sig] = counts.get(sig, 0) + 1\n    top = sorted(counts.items(), key=lambda kv: -kv[1])[:limit]\n    return {\"service\": service, \"level\": level, \"signatures\": [{\"pattern\": p, \"count\": c} for p, c in top]}\n\n\n@tool()\ndef recent_deploys(service: str) -> dict:\n    \"\"\"Deployments of a service (newest first) with version, time and change summary.\"\"\"\n    ds = sorted((d for d in load_telemetry()[\"deploys\"] if d[\"service\"] == service), key=lambda d: d[\"ts\"], reverse=True)\n    return {\"service\": service, \"deploys\": ds}\n\n\n@tool(risk=\"write\")\ndef rollback(service: str, to_version: str, idempotency_key: str) -> dict:\n    \"\"\"Roll back a service to a previous version through the CD pipeline.\"\"\"\n    return _execute(idempotency_key, {\"action\": \"rollback\", \"service\": service, \"to_version\": to_version})\n\n\n@tool(risk=\"write\")\ndef rolling_restart(service: str, idempotency_key: str) -> dict:\n    \"\"\"Restart a service's instances one at a time (no downtime).\"\"\"\n    return _execute(idempotency_key, {\"action\": \"rolling_restart\", \"service\": service})\n\n\n@tool(risk=\"write\")\ndef cleanup_disk(service: str, path: str, older_than_days: int, idempotency_key: str) -> dict:\n    \"\"\"Compress/delete rotated logs older than N days under an allow-listed path.\"\"\"\n    if not path.startswith(\"/var/log/\"):\n        raise PermissionError(\"path not in allow-list (/var/log/*)\")\n    return _execute(idempotency_key, {\"action\": \"cleanup_disk\", \"service\": service, \"path\": path,\n                                      \"older_than_days\": older_than_days})\n\n\ndef _execute(key: str, action: dict) -> dict:\n    if key in EXECUTED:\n        return {**EXECUTED[key], \"duplicate\": True}\n    EXECUTED[key] = {**action, \"status\": \"succeeded\"}\n    return EXECUTED[key]\n\n\ndef make_registry(approver) -> ToolRegistry:\n    return ToolRegistry(approver=approver).register(metric_summary, search_logs, recent_deploys,\n                                                    rollback, rolling_restart, cleanup_disk)\n"}, {"name": "run.py", "lang": "python", "code": "\"\"\"Run the AIOps multi-agent system over the synthetic alert storm.\n\nRun:  python -m projects.aiops_agents.run              # auto-approve as the on-call (demo)\n      python -m projects.aiops_agents.run --interactive\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\n\nfrom langgraph.types import Command\n\nfrom common.llm import get_llm\n\nfrom .supervisor import REG, build, initial_state\n\nEXPECTED = {\"payments-svc\": \"bad_deploy\", \"inventory-svc\": \"memory_leak\", \"batch-worker\": \"disk_growth\"}\n\n\ndef main() -> None:\n    interactive = \"--interactive\" in sys.argv\n    print(f\"LLM mode: {get_llm().mode}\\n\")\n    app = build()\n    cfg = {\"configurable\": {\"thread_id\": \"alert-storm-2026-09-18\"}}\n    st = initial_state()\n    print(f\"{len(st['alerts'])} alerts received\")\n    out = app.invoke(st, cfg)\n    while \"__interrupt__\" in out:\n        req = out[\"__interrupt__\"][0].value\n        print(f\"\\n⏸  APPROVAL [{req['severity']}] {req['incident']}: {req['plan']['action']} {req['plan']['args']}\"\n              f\"\\n   because: {req['hypothesis']}\")\n        if interactive:\n            ans = input(\"approve? [y/N] > \").strip().lower() == \"y\"\n            decision = {\"approved\": ans, \"by\": \"oncall-you\", \"reason\": \"\" if ans else \"rejected\"}\n        else:\n            decision = {\"approved\": True, \"by\": \"oncall-demo\"}\n        out = app.invoke(Command(resume=decision), cfg)\n\n    print(f\"\\ntriage: deduplicated {out['dropped']} · {len(out['done'])} incidents\\n\")\n    correct = 0\n    for d in out[\"done\"]:\n        inc, h, p, o = d[\"incident\"], d[\"hypothesis\"], d[\"plan\"], d[\"outcome\"]\n        correct += EXPECTED.get(h[\"origin_service\"]) == h[\"category\"]\n        print(f\"{inc['id']} [{inc['severity']}] {inc['title']}\")\n        print(f\"   root cause  : {h['origin_service']} · {h['category']} ({h['confidence']:.0%}) - {h['cause']}\")\n        print(f\"   tools used  : {' -> '.join(h['tool_calls'])}\")\n        print(f\"   remediation : {p['action']} via {p['runbook']} · approval by {d['approval'].get('by')}\"\n              f\" · {o.get('status')} · verified={o.get('verified')}\")\n        print(f\"   status      : {d['status_update']}\")\n        print(f\"   postmortem  : {d['postmortem'].split('agentic-ai-course/')[-1]}\\n\")\n    print(f\"root-cause accuracy: {correct}/{len(out['done'])}\")\n    print(f\"audit trail: {len(REG.audit)} tool calls, \"\n          f\"{sum(1 for a in REG.audit if a['tool'] in ('rollback', 'rolling_restart', 'cleanup_disk'))} write actions\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "Dockerfile", "lang": "dockerfile", "code": "# Build from the repository root:  docker build -f projects/aiops_agents/Dockerfile -t aiops-agents .\nFROM python:3.11-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY common/ common/\nCOPY data/aiops/ data/aiops/\nCOPY projects/aiops_agents/ projects/aiops_agents/\nENV PYTHONUNBUFFERED=1\nRUN useradd -m app && mkdir -p runs && chown app runs\nUSER app\nEXPOSE 8003\nHEALTHCHECK CMD python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/health')\"\nCMD [\"uvicorn\", \"projects.aiops_agents.api:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8003\"]\n"}], "folder": "projects/aiops_agents"}, {"title": "Capstone 4 — Inventory Planner (multi-agent over A2A)", "meta": {}, "html": "<blockquote>\n<p>Sales history, suppliers and prices are <strong>synthetic<\/strong> (a hospital medical-supplies store).<\/p>\n<\/blockquote>\n<p>Three agents, owned by different teams, collaborate through the <strong>Agent2Agent (A2A) protocol<\/strong>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Agent<\/th>\n<th>Owner<\/th>\n<th>Skill<\/th>\n<th>Serves<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Demand Forecaster<\/td>\n<td>Data science<\/td>\n<td><code>forecast_demand<\/code>: Holt smoothing, grid-searched on a walk-forward backtest; returns forecast, σ and MAPE<\/td>\n<td>:8101<\/td>\n<\/tr>\n<tr>\n<td>Supplier Agent<\/td>\n<td>Procurement<\/td>\n<td><code>quote<\/code>: catalogue, MOQ, lead time, reliability-adjusted ranking<\/td>\n<td>:8102<\/td>\n<\/tr>\n<tr>\n<td>Inventory Planner<\/td>\n<td>Supply chain<\/td>\n<td><code>plan_replenishment<\/code>: LangGraph orchestration, safety stock, order-up-to, budget, approval<\/td>\n<td>:8103<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each agent publishes an <strong>Agent Card<\/strong> (<code>/.well-known/agent-card.json<\/code>) and accepts JSON-RPC <code>message/send<\/code>. When a plan exceeds the approval threshold, the planner returns task state <strong><code>input-required<\/code><\/strong>. The caller (an ERP, a person, or another agent) replies in the same <code>contextId<\/code> with an approval, and the planner resumes from its LangGraph checkpoint.<\/p>\n<p><strong>Classes used:<\/strong> 5 (tools), 6 (checkpointed state), 10 (cost-aware decisions), 11 (tracing and auth), 12 (A2A, deployment, change management).<\/p>\n<h2 id=\"s0\">Architecture<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>\n<h2 id=\"s1\">Process flow (A2A task lifecycle)<\/h2>\n<div class=\"mmd\" data-d=\"1\"><\/div>\n<h2 id=\"s2\">Planning logic<\/h2>\n<ul>\n<li>Protection period P = supplier lead time L + review period R.<\/li>\n<li>Safety stock SS = z(service level) × σ_weekly × √P, with z = 1.645 at a 95% service level.<\/li>\n<li>Order-up-to level S = forecast demand over P + SS. Order = S − (on hand + on order), rounded up to the MOQ.<\/li>\n<li><strong>Every supplier option is sized with its own lead time.<\/strong> A slower, cheaper supplier needs more safety stock, so the planner re-ranks options by total reliability-adjusted cost rather than unit price.<\/li>\n<li>The budget funds the lowest weeks-of-cover first. The rest is deferred with a reason.<\/li>\n<li>Plans above the approval threshold pause for a human.<\/li>\n<\/ul>\n<h2 id=\"s3\">Result (offline)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>SKU<\/th>\n<th>Cover (weeks)<\/th>\n<th>Order<\/th>\n<th>Supplier<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nitrile gloves<\/td>\n<td>1.7<\/td>\n<td>831<\/td>\n<td>Medlinex (2 wk)<\/td>\n<td>order<\/td>\n<\/tr>\n<tr>\n<td>Surgical masks<\/td>\n<td>10.7<\/td>\n<td>0<\/td>\n<td>–<\/td>\n<td>above reorder point<\/td>\n<\/tr>\n<tr>\n<td>Syringes 5 ml<\/td>\n<td>2.1<\/td>\n<td>100 (MOQ)<\/td>\n<td>QuickMed (1 wk)<\/td>\n<td>order<\/td>\n<\/tr>\n<tr>\n<td>Gauze pads<\/td>\n<td>3.1<\/td>\n<td>200<\/td>\n<td>Medlinex<\/td>\n<td><strong>deferred (budget)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Hand sanitizer<\/td>\n<td>1.5<\/td>\n<td>359<\/td>\n<td>QuickMed (1 wk)<\/td>\n<td>order<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The total is $7,395 against an $8,000 budget. That exceeds the $5,000 threshold, so the task goes to <code>input-required<\/code>, is approved, and 3 purchase orders are raised.<\/p>\n<h2 id=\"s4\">Files<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>a2a.py<\/code><\/td>\n<td>Minimal A2A: Agent Card, JSON-RPC <code>message/send<\/code>, Task/Artifact shapes, bearer auth, client<\/td>\n<\/tr>\n<tr>\n<td><code>forecaster.py<\/code>, <code>supplier.py<\/code><\/td>\n<td>Specialist agents as A2A servers<\/td>\n<\/tr>\n<tr>\n<td><code>planner.py<\/code><\/td>\n<td>LangGraph planner, with an A2A adapter that maps interrupt ↔ <code>input-required<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>run.py<\/code><\/td>\n<td>Starts all three locally and acts as the ERP client (<code>--reject<\/code> to decline)<\/td>\n<\/tr>\n<tr>\n<td><code>Dockerfile<\/code>, <code>docker-compose.yml<\/code><\/td>\n<td>One image, three containers<\/td>\n<\/tr>\n<tr>\n<td><code>deploy/azure_container_apps.sh<\/code><\/td>\n<td>Azure Container Apps deployment (internal and external ingress, secrets, autoscale)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s5\">Run it<\/h2>\n<pre><code class=\"language-bash\">python -m projects.inventory_planner.run\npython -m projects.inventory_planner.run --reject\ndocker compose -f projects/inventory_planner/docker-compose.yml up --build\nA2A_TOKEN=... ./projects/inventory_planner/deploy/azure_container_apps.sh\n<\/code><\/pre>", "diagrams": ["flowchart LR\n    ERP[ERP / planner UI<br/>A2A client] -->|discover card<br/>message/send| PL\n    subgraph PL [Inventory Planner agent :8103]\n        L1[load positions] --> L2[forecast]\n        L2 --> L3[\"size orders per supplier option<br/>SS = z·σ·√(L+R)\"]\n        L3 --> L4[budget allocation<br/>most urgent first]\n        L4 --> L5{{approval<br/>interrupt → input-required}}\n        L5 --> L6[publish POs + note]\n    end\n    L2 -->|A2A message/send| FC[Demand Forecaster :8101<br/>Holt + backtest]\n    L3 -->|A2A message/send| SP[Supplier Agent :8102<br/>quotes · MOQ · lead time]\n    FC --> SH[(Sales history)]\n    SP --> SC[(Supplier catalogue)]\n    PL --> INV[(Inventory positions<br/>policy)]\n    PL -.checkpoint by contextId.- CK[(Checkpointer)]", "sequenceDiagram\n    participant E as ERP client\n    participant P as Planner\n    participant F as Forecaster\n    participant S as Supplier\n    E->>P: GET /.well-known/agent-card.json\n    E->>P: message/send {}\n    P->>F: GET agent card · message/send {skus, horizon 8}\n    F-->>P: Task completed · artifact forecasts (σ, MAPE)\n    P->>S: GET agent card · message/send {items}\n    S-->>P: Task completed · artifact supplier options\n    P->>P: size orders, allocate budget\n    P-->>E: Task input-required · \"total $7,395 exceeds $5,000\"\n    E->>P: message/send {approval} (same contextId, taskId)\n    P->>P: resume from checkpoint, publish POs\n    P-->>E: Task completed · artifact purchase orders + note"], "toc": ["Architecture", "Process flow (A2A task lifecycle)", "Planning logic", "Result (offline)", "Files", "Run it"], "slug": "inventory_planner", "domain": "Supply chain", "short": "Inventory Planner", "pattern": "Peer agents over A2A", "metric": "3 POs within budget · approval via input-required", "files": [{"name": "planner.py", "lang": "python", "code": "\"\"\"Inventory Planner agent - orchestrates the Forecaster and Supplier agents over A2A.\n\nLangGraph workflow (checkpointed by A2A contextId):\n  load positions -> forecast (A2A) -> supplier quotes (A2A) -> size orders per supplier option\n  (lead-time-aware safety stock, order-up-to, MOQ) -> budget allocation -> approval\n  (interrupt -> A2A \"input-required\") -> publish purchase orders + planner note\n\nServe:  uvicorn projects.inventory_planner.planner:app --port 8103\n\"\"\"\nfrom __future__ import annotations\n\nimport math\nimport os\nfrom typing import TypedDict\n\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.graph import END, START, StateGraph\nfrom langgraph.types import Command, interrupt\n\nfrom common.domain import load_inventory_json\nfrom common.llm import get_llm\n\nfrom .a2a import A2AClient, AgentCard, Skill, artifact_data, build_app\n\nZ = {0.90: 1.282, 0.95: 1.645, 0.98: 2.054, 0.99: 2.326}\n\n\ndef urls() -> dict:\n    return {\"forecaster\": os.getenv(\"FORECASTER_URL\", \"http://localhost:8101\"),\n            \"supplier\": os.getenv(\"SUPPLIER_URL\", \"http://localhost:8102\")}\n\n\ndef client() -> A2AClient:\n    return A2AClient(token=os.getenv(\"A2A_TOKEN\"))\n\n\nclass PlanState(TypedDict, total=False):\n    inventory: dict\n    policy: dict\n    peers: dict\n    forecasts: dict\n    lines: list[dict]\n    plan: dict\n    approval: dict\n    purchase_orders: list[dict]\n    note: str\n\n\ndef load(s: PlanState) -> dict:\n    c = client()\n    peers = {k: c.discover(u).model_dump(include={\"name\", \"url\", \"skills\"}) for k, u in urls().items()}\n    return {\"inventory\": load_inventory_json(\"inventory\"), \"policy\": load_inventory_json(\"policy\"), \"peers\": peers}\n\n\ndef forecast(s: PlanState) -> dict:\n    task = client().send(urls()[\"forecaster\"], {\"skus\": list(s[\"inventory\"]), \"horizon_weeks\": 8})\n    return {\"forecasts\": artifact_data(task)[\"forecasts\"]}\n\n\ndef size_orders(s: PlanState) -> dict:\n    \"\"\"For every supplier option, size the order with THAT option's lead time (safety stock grows\n    with sqrt(lead time)), apply its MOQ, and keep the cheapest reliability-adjusted total.\n    The supplier agent ranks by unit economics; the planner re-ranks by total cost of the plan.\"\"\"\n    pol, z = s[\"policy\"], Z[s[\"policy\"][\"service_level\"]]\n    quotes = artifact_data(client().send(urls()[\"supplier\"], {\"items\": [\n        {\"sku\": k, \"qty\": sum(f[\"weekly_forecast\"][:4])} for k, f in s[\"forecasts\"].items()]}))[\"quotes\"]\n    lines = []\n    for sku, inv in s[\"inventory\"].items():\n        f = s[\"forecasts\"][sku]\n        position = inv[\"on_hand\"] + inv[\"on_order\"]\n        weekly = f[\"weekly_forecast\"][0] or 1\n        best = None\n        for o in quotes[sku][\"options\"]:\n            P = o[\"lead_time_weeks\"] + pol[\"review_period_weeks\"]\n            demand_p = sum(f[\"weekly_forecast\"][:P])\n            ss = z * f[\"sigma_weekly\"] * math.sqrt(P)\n            need = max(0.0, demand_p + ss - position)\n            units = max(math.ceil(need), o[\"moq_units\"]) if need > 0 else 0\n            score = units * o[\"effective_unit_cost\"]\n            cand = {\"supplier\": o, \"lead_time_weeks\": o[\"lead_time_weeks\"], \"demand_over_protection\": round(demand_p),\n                    \"safety_stock\": round(ss), \"reorder_point\": round(demand_p + ss), \"need_units\": math.ceil(need),\n                    \"order_units\": units, \"cost_usd\": round(units * o[\"unit_price\"], 2), \"_score\": score}\n            if best is None or (score, o[\"lead_time_weeks\"]) < (best[\"_score\"], best[\"lead_time_weeks\"]):\n                best = cand\n        best.pop(\"_score\")\n        if best[\"order_units\"] == 0:\n            best[\"supplier\"] = None\n        lines.append({\"sku\": sku, \"name\": inv[\"name\"], \"position\": position,\n                      \"weeks_of_cover\": round(position / weekly, 1), \"backtest_mape\": f[\"backtest_mape\"], **best})\n    return {\"lines\": lines}\n\n\ndef allocate_budget(s: PlanState) -> dict:\n    \"\"\"Fund the most urgent SKUs (lowest weeks of cover) first; defer what the budget can't cover.\"\"\"\n    budget, spent = s[\"policy\"][\"budget_usd\"], 0.0\n    for l in sorted(s[\"lines\"], key=lambda l: l[\"weeks_of_cover\"]):\n        if l[\"order_units\"] == 0:\n            l[\"status\"] = \"no order (above reorder point)\"\n        elif spent + l[\"cost_usd\"] <= budget:\n            spent += l[\"cost_usd\"]\n            l[\"status\"] = \"order\"\n        else:\n            l[\"status\"] = \"deferred (budget)\"\n    total = round(spent, 2)\n    thr = s[\"policy\"][\"approval_threshold_usd\"]\n    return {\"plan\": {\"total_usd\": total, \"budget_usd\": budget, \"requires_approval\": total > thr,\n                     \"approval_threshold_usd\": thr, \"lines\": s[\"lines\"]}}\n\n\ndef approval(s: PlanState) -> dict:\n    if not s[\"plan\"][\"requires_approval\"]:\n        return {\"approval\": {\"approved\": True, \"by\": \"policy:auto (below threshold)\"}}\n    return {\"approval\": interrupt({\"reason\": f\"total ${s['plan']['total_usd']:,.0f} exceeds \"\n                                             f\"${s['plan']['approval_threshold_usd']:,.0f} approval threshold\",\n                                   \"plan\": s[\"plan\"]})}\n\n\ndef publish(s: PlanState) -> dict:\n    if not s[\"approval\"].get(\"approved\"):\n        return {\"purchase_orders\": [], \"note\": f\"Plan rejected by {s['approval'].get('by')}: \"\n                                               f\"{s['approval'].get('reason', '')}\"}\n    pos = [{\"po\": f\"PO-{i:04d}\", \"sku\": l[\"sku\"], \"supplier_id\": l[\"supplier\"][\"supplier_id\"],\n            \"units\": l[\"order_units\"], \"unit_price\": l[\"supplier\"][\"unit_price\"], \"total_usd\": l[\"cost_usd\"],\n            \"eta_weeks\": l[\"lead_time_weeks\"]}\n           for i, l in enumerate((l for l in s[\"plan\"][\"lines\"] if l[\"status\"] == \"order\"), 1001)]\n    deferred = [l[\"sku\"] for l in s[\"plan\"][\"lines\"] if l[\"status\"].startswith(\"deferred\")]\n\n    def offline():\n        return (f\"Raised {len(pos)} POs for ${sum(p['total_usd'] for p in pos):,.0f} \"\n                f\"(approved by {s['approval'].get('by')}). Most urgent: \"\n                f\"{min(s['plan']['lines'], key=lambda l: l['weeks_of_cover'])['sku']}. \"\n                f\"Deferred for budget: {deferred or 'none'}.\")\n    note = get_llm().chat(f\"Write a 3-sentence planner note for the supply chain lead: {pos} deferred={deferred}\",\n                          fallback=offline)\n    return {\"purchase_orders\": pos, \"note\": note}\n\n\ndef build(checkpointer=None):\n    g = StateGraph(PlanState)\n    for n, fn in [(\"load\", load), (\"forecast\", forecast), (\"size_orders\", size_orders),\n                  (\"allocate_budget\", allocate_budget), (\"approval\", approval), (\"publish\", publish)]:\n        g.add_node(n, fn)\n    g.add_edge(START, \"load\")\n    g.add_edge(\"load\", \"forecast\")\n    g.add_edge(\
