"forecast\", \"size_orders\")\n    g.add_edge(\"size_orders\", \"allocate_budget\")\n    g.add_edge(\"allocate_budget\", \"approval\")\n    g.add_edge(\"approval\", \"publish\")\n    g.add_edge(\"publish\", END)\n    return g.compile(checkpointer=checkpointer or MemorySaver())\n\n\nGRAPH = build()\n\n\ndef handle(data: dict, ctx: str, tid: str | None):\n    \"\"\"A2A adapter: new context -> start plan; message with {'approval': ...} -> resume.\"\"\"\n    cfg = {\"configurable\": {\"thread_id\": ctx}}\n    if \"approval\" in data:\n        out = GRAPH.invoke(Command(resume=data[\"approval\"]), cfg)\n    else:\n        out = GRAPH.invoke({}, cfg)\n    if \"__interrupt__\" in out:\n        req = out[\"__interrupt__\"][0].value\n        return \"input-required\", {\"approval_request\": req}, f\"Approval needed: {req['reason']}\"\n    return \"completed\", {\"plan\": out[\"plan\"], \"purchase_orders\": out[\"purchase_orders\"], \"note\": out[\"note\"],\n                         \"peers\": out[\"peers\"]}, out[\"note\"]\n\n\nCARD = AgentCard(\n    name=\"Inventory Planner\", url=os.getenv(\"PLANNER_URL\", \"http://localhost:8103\"),\n    description=\"Plans replenishment for medical supplies by coordinating forecasting and supplier agents.\",\n    skills=[Skill(id=\"plan_replenishment\", name=\"Plan replenishment\", tags=[\"planning\", \"supply-chain\"],\n                  description=\"Start with {} ; if input-required, reply in the same context with \"\n                              \"{approval: {approved, by, reason}}. Output purchase orders + note.\")])\napp = build_app(CARD, handle, token=os.getenv(\"A2A_TOKEN\"))\n"}, {"name": "a2a.py", "lang": "python", "code": "\"\"\"A minimal, spec-shaped implementation of the Agent2Agent (A2A) protocol.\n\nA2A lets independently built agents (different teams, frameworks, vendors) collaborate:\n  * discovery : each agent publishes an Agent Card at /.well-known/agent-card.json\n                (name, description, url, skills, input/output modes, auth)\n  * messaging : JSON-RPC 2.0 over HTTP - method \"message/send\" carries a Message made of Parts\n                (text | data | file); the reply is a Task with a status and Artifacts\n  * lifecycle : task states submitted -> working -> completed | failed | input-required ...\n                \"input-required\" is how an agent asks its caller (or a human) for more input;\n                the caller answers by sending another message with the same contextId/taskId.\n\nThis module keeps only what the course needs (no streaming / push notifications). For\nproduction use the official SDK (`pip install a2a-sdk`) - the wire format is the same idea.\n\"\"\"\nfrom __future__ import annotations\n\nimport uuid\nfrom typing import Callable\n\nimport httpx\nfrom fastapi import FastAPI, Request\nfrom pydantic import BaseModel, Field\n\n\nclass Skill(BaseModel):\n    id: str\n    name: str\n    description: str\n    tags: list[str] = Field(default_factory=list)\n    examples: list[str] = Field(default_factory=list)\n\n\nclass AgentCard(BaseModel):\n    name: str\n    description: str\n    url: str\n    version: str = \"1.0.0\"\n    protocolVersion: str = \"0.3.0\"\n    capabilities: dict = Field(default_factory=lambda: {\"streaming\": False, \"pushNotifications\": False})\n    defaultInputModes: list[str] = Field(default_factory=lambda: [\"application/json\", \"text/plain\"])\n    defaultOutputModes: list[str] = Field(default_factory=lambda: [\"application/json\"])\n    skills: list[Skill]\n    securitySchemes: dict = Field(default_factory=lambda: {\"bearer\": {\"type\": \"http\", \"scheme\": \"bearer\"}})\n\n\n# handler(data, context_id, task_id) -> (state, result_data, message_text)\nHandler = Callable[[dict, str, str | None], tuple[str, dict, str]]\n\n\ndef _task(task_id: str, context_id: str, state: str, data: dict, text: str) -> dict:\n    return {\"kind\": \"task\", \"id\": task_id, \"contextId\": context_id,\n            \"status\": {\"state\": state, \"message\": {\"role\": \"agent\", \"kind\": \"message\", \"messageId\": uuid.uuid4().hex,\n                                                   \"parts\": [{\"kind\": \"text\", \"text\": text}]}},\n            \"artifacts\": [{\"artifactId\": uuid.uuid4().hex, \"name\": \"result\", \"parts\": [{\"kind\": \"data\", \"data\": data}]}]}\n\n\ndef build_app(card: AgentCard, handler: Handler, token: str | None = None) -> FastAPI:\n    app = FastAPI(title=card.name)\n\n    @app.get(\"/.well-known/agent-card.json\")\n    @app.get(\"/.well-known/agent.json\")          # older path, kept for compatibility\n    def get_card() -> dict:\n        return card.model_dump()\n\n    @app.get(\"/health\")\n    def health() -> dict:\n        return {\"ok\": True}\n\n    @app.post(\"/\")\n    async def rpc(req: Request) -> dict:\n        body = await req.json()\n        rid = body.get(\"id\")\n        if token and req.headers.get(\"authorization\") != f\"Bearer {token}\":\n            return {\"jsonrpc\": \"2.0\", \"id\": rid, \"error\": {\"code\": -32001, \"message\": \"unauthorized\"}}\n        if body.get(\"method\") != \"message/send\":\n            return {\"jsonrpc\": \"2.0\", \"id\": rid, \"error\": {\"code\": -32601, \"message\": \"method not found\"}}\n        msg = body[\"params\"][\"message\"]\n        data = next((p[\"data\"] for p in msg[\"parts\"] if p.get(\"kind\") == \"data\"), {})\n        text = next((p[\"text\"] for p in msg[\"parts\"] if p.get(\"kind\") == \"text\"), \"\")\n        if text and not data:\n            data = {\"text\": text}\n        ctx = msg.get(\"contextId\") or uuid.uuid4().hex\n        tid = msg.get(\"taskId\")\n        try:\n            state, result, note = handler(data, ctx, tid)\n        except Exception as e:  # noqa: BLE001 - surface as a failed task, not a 500\n            state, result, note = \"failed\", {\"error\": f\"{type(e).__name__}: {e}\"}, \"task failed\"\n        return {\"jsonrpc\": \"2.0\", \"id\": rid, \"result\": _task(tid or uuid.uuid4().hex, ctx, state, result, note)}\n\n    return app\n\n\nclass A2AClient:\n    \"\"\"Discover agents by URL and send them messages.\"\"\"\n\n    def __init__(self, token: str | None = None, transport: httpx.BaseTransport | None = None, timeout: float = 30):\n        headers = {\"authorization\": f\"Bearer {token}\"} if token else {}\n        self.http = httpx.Client(headers=headers, timeout=timeout, transport=transport)\n\n    def discover(self, base_url: str) -> AgentCard:\n        return AgentCard(**self.http.get(f\"{base_url.rstrip('/')}/.well-known/agent-card.json\").json())\n\n    def send(self, base_url: str, data: dict, context_id: str | None = None, task_id: str | None = None) -> dict:\n        msg = {\"role\": \"user\", \"kind\": \"message\", \"messageId\": uuid.uuid4().hex,\n               \"parts\": [{\"kind\": \"data\", \"data\": data}]}\n        if context_id:\n            msg[\"contextId\"] = context_id\n        if task_id:\n            msg[\"taskId\"] = task_id\n        r = self.http.post(base_url.rstrip(\"/\") + \"/\", json={\"jsonrpc\": \"2.0\", \"id\": uuid.uuid4().hex,\n                                                             \"method\": \"message/send\", \"params\": {\"message\": msg}})\n        body = r.json()\n        if \"error\" in body:\n            raise RuntimeError(f\"A2A error from {base_url}: {body['error']}\")\n        return body[\"result\"]\n\n\ndef artifact_data(task: dict) -> dict:\n    return task[\"artifacts\"][0][\"parts\"][0][\"data\"]\n"}, {"name": "deploy/azure_container_apps.sh", "lang": "bash", "code": "#!/usr/bin/env bash\n# Deploy the three A2A agents to Azure Container Apps (one environment, internal ingress for\n# forecaster/supplier, external ingress for the planner). Requires: az CLI logged in, Docker.\n# Review names/regions first; this creates billable resources.\nset -euo pipefail\n\nRG=${RG:-rg-agentic-course}\nLOC=${LOC:-centralindia}\nACR=${ACR:-acragenticcourse$RANDOM}\nENV_NAME=${ENV_NAME:-cae-agents}\nIMAGE=inventory-agents:$(git rev-parse --short HEAD 2>/dev/null || echo v1)\nA2A_TOKEN=${A2A_TOKEN:?set A2A_TOKEN (store it in Key Vault in production)}\n\naz group create -n \"$RG\" -l \"$LOC\"\naz acr create -g \"$RG\" -n \"$ACR\" --sku Basic --admin-enabled false\naz acr build -r \"$ACR\" -t \"$IMAGE\" -f projects/inventory_planner/Dockerfile .\naz containerapp env create -g \"$RG\" -n \"$ENV_NAME\" -l \"$LOC\"\n\ndeploy() {  # name port ingress\n  az containerapp create -g \"$RG\" -n \"$1\" --environment \"$ENV_NAME\" \\\n    --image \"$ACR.azurecr.io/$IMAGE\" --registry-server \"$ACR.azurecr.io\" --registry-identity system \\\n    --target-port \"$2\" --ingress \"$3\" --min-replicas 1 --max-replicas 5 \\\n    --secrets a2a-token=\"$A2A_TOKEN\" openai-key=\"${OPENAI_API_KEY:-none}\" \\\n    --env-vars AGENT=\"$1\" PORT=\"$2\" A2A_TOKEN=secretref:a2a-token OPENAI_API_KEY=secretref:openai-key \\\n      FORECASTER_URL=\"http://forecaster\" SUPPLIER_URL=\"http://supplier\" \\\n    --scale-rule-name http --scale-rule-type http --scale-rule-http-concurrency 20\n}\ndeploy forecaster 8101 internal\ndeploy supplier 8102 internal\ndeploy planner 8103 external\n\nPLANNER=$(az containerapp show -g \"$RG\" -n planner --query properties.configuration.ingress.fqdn -o tsv)\necho \"Planner Agent Card: https://$PLANNER/.well-known/agent-card.json\"\n# Next: Application Insights (OpenTelemetry) for traces, Key Vault for secrets, revisions for canary:\n#   az containerapp revision set-mode -g $RG -n planner --mode multiple\n#   az containerapp ingress traffic set -g $RG -n planner --revision-weight latest=10 <stable>=90\n"}, {"name": "docker-compose.yml", "lang": "yaml", "code": "# Local multi-agent stack:  docker compose -f projects/inventory_planner/docker-compose.yml up --build\n# Then:  curl localhost:8103/.well-known/agent-card.json\nx-agent: &agent\n  build: {context: ../.., dockerfile: projects/inventory_planner/Dockerfile}\n  image: inventory-agents:local\n  environment: &env\n    A2A_TOKEN: ${A2A_TOKEN:-dev-token}\n    OPENAI_API_KEY: ${OPENAI_API_KEY:-}\n    FORECASTER_URL: http://forecaster:8101\n    SUPPLIER_URL: http://supplier:8102\n    PLANNER_URL: http://planner:8103\nservices:\n  forecaster:\n    <<: *agent\n    environment: {<<: *env, AGENT: forecaster, PORT: \"8101\"}\n    ports: [\"8101:8101\"]\n  supplier:\n    <<: *agent\n    environment: {<<: *env, AGENT: supplier, PORT: \"8102\"}\n    ports: [\"8102:8102\"]\n  planner:\n    <<: *agent\n    environment: {<<: *env, AGENT: planner, PORT: \"8103\"}\n    ports: [\"8103:8103\"]\n    depends_on: [forecaster, supplier]\n"}, {"name": "forecaster.py", "lang": "python", "code": "\"\"\"Demand Forecaster agent (A2A skill: forecast_demand).\n\nHolt's linear exponential smoothing with a small grid search on a walk-forward backtest -\nsimple, explainable, and a solid baseline before reaching for ML. Returns the point forecast,\nthe residual standard deviation (used for safety stock) and backtest MAPE (trust signal).\n\nServe:  uvicorn projects.inventory_planner.forecaster:app --port 8101\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport statistics\n\nfrom common.domain import load_sales_history\n\nfrom .a2a import AgentCard, Skill, build_app\n\n\ndef holt(series: list[float], alpha: float, beta: float, horizon: int) -> tuple[list[float], list[float]]:\n    level, trend = series[0], series[1] - series[0]\n    fitted = []\n    for y in series:\n        fitted.append(level + trend)\n        prev = level\n        level = alpha * y + (1 - alpha) * (level + trend)\n        trend = beta * (level - prev) + (1 - beta) * trend\n    return [level + (h + 1) * trend for h in range(horizon)], fitted\n\n\ndef forecast(sku: str, horizon_weeks: int = 8) -> dict:\n    y = [float(v) for v in load_sales_history()[sku]]\n    best = None\n    for a in (0.2, 0.4, 0.6, 0.8):\n        for b in (0.05, 0.1, 0.2):\n            errs = []\n            for t in range(16, len(y)):                     # walk-forward 1-step backtest\n                f, _ = holt(y[:t], a, b, 1)\n                errs.append(abs(f[0] - y[t]) / max(y[t], 1))\n            mape = statistics.mean(errs)\n            if best is None or mape < best[0]:\n                best = (mape, a, b)\n    mape, a, b = best\n    fc, fitted = holt(y, a, b, horizon_weeks)\n    resid = [yi - fi for yi, fi in zip(y[2:], fitted[2:])]\n    return {\"sku\": sku, \"horizon_weeks\": horizon_weeks, \"weekly_forecast\": [round(max(v, 0), 1) for v in fc],\n            \"sigma_weekly\": round(statistics.pstdev(resid), 1), \"backtest_mape\": round(mape, 3),\n            \"model\": f\"holt(alpha={a}, beta={b})\", \"last_actual\": y[-1]}\n\n\ndef handle(data: dict, ctx: str, tid: str | None):\n    skus = data.get(\"skus\") or [data[\"sku\"]]\n    res = {s: forecast(s, int(data.get(\"horizon_weeks\", 8))) for s in skus}\n    return \"completed\", {\"forecasts\": res}, f\"forecast {len(res)} SKU(s)\"\n\n\nCARD = AgentCard(\n    name=\"Demand Forecaster\", url=os.getenv(\"FORECASTER_URL\", \"http://localhost:8101\"),\n    description=\"Weekly unit-demand forecasts with uncertainty for medical-supply SKUs.\",\n    skills=[Skill(id=\"forecast_demand\", name=\"Forecast demand\", tags=[\"forecasting\", \"supply-chain\"],\n                  description=\"Input {sku|skus, horizon_weeks}. Output weekly forecast, sigma, backtest MAPE.\",\n                  examples=['{\"sku\": \"SKU-GLV-001\", \"horizon_weeks\": 8}'])])\napp = build_app(CARD, handle, token=os.getenv(\"A2A_TOKEN\"))\n"}, {"name": "supplier.py", "lang": "python", "code": "\"\"\"Supplier agent (A2A skill: quote). Owned by 'procurement' - a different team than planning,\nwhich is exactly the situation A2A is designed for.\n\nScores each eligible supplier on landed cost plus a lateness-risk penalty:\n  effective_unit_cost = price * (1 + (1 - on_time_rate) * 0.5)\n\nServe:  uvicorn projects.inventory_planner.supplier:app --port 8102\n\"\"\"\nfrom __future__ import annotations\n\nimport math\nimport os\n\nfrom common.domain import load_inventory_json\n\nfrom .a2a import AgentCard, Skill, build_app\n\n\ndef quote(sku: str, qty: int) -> dict:\n    options = []\n    for s in load_inventory_json(\"suppliers\"):\n        if sku not in s[\"skus\"]:\n            continue\n        units = max(qty, s[\"moq_units\"])\n        price = s[\"skus\"][sku]\n        eff = price * (1 + (1 - s[\"on_time_rate\"]) * 0.5)\n        options.append({\"supplier_id\": s[\"supplier_id\"], \"name\": s[\"name\"], \"unit_price\": price,\n                        \"order_units\": units, \"lead_time_weeks\": s[\"lead_time_weeks\"], \"moq_units\": s[\"moq_units\"],\n                        \"on_time_rate\": s[\"on_time_rate\"], \"effective_unit_cost\": round(eff, 3),\n                        \"total_usd\": round(units * price, 2)})\n    options.sort(key=lambda o: (o[\"effective_unit_cost\"], o[\"lead_time_weeks\"]))\n    return {\"sku\": sku, \"requested_units\": qty, \"options\": options,\n            \"recommended\": options[0] if options else None}\n\n\ndef handle(data: dict, ctx: str, tid: str | None):\n    items = data.get(\"items\") or [{\"sku\": data[\"sku\"], \"qty\": data.get(\"qty\", 0)}]\n    res = {i[\"sku\"]: quote(i[\"sku\"], int(math.ceil(i[\"qty\"]))) for i in items}\n    return \"completed\", {\"quotes\": res}, f\"quoted {len(res)} SKU(s)\"\n\n\nCARD = AgentCard(\n    name=\"Supplier Agent\", url=os.getenv(\"SUPPLIER_URL\", \"http://localhost:8102\"),\n    description=\"Supplier catalogue, pricing, MOQ and lead-time quotes with a reliability-adjusted recommendation.\",\n    skills=[Skill(id=\"quote\", name=\"Quote supply\", tags=[\"procurement\"],\n                  description=\"Input {items:[{sku, qty}]}. Output ranked supplier options per SKU.\",\n                  examples=['{\"items\": [{\"sku\": \"SKU-SYR-220\", \"qty\": 400}]}'])])\napp = build_app(CARD, handle, token=os.getenv(\"A2A_TOKEN\"))\n"}, {"name": "run.py", "lang": "python", "code": "\"\"\"Start the three A2A agents locally and run a planning cycle as an external client (e.g. the ERP).\n\nRun:  python -m projects.inventory_planner.run            # approves as the supply-chain lead\n      python -m projects.inventory_planner.run --reject\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport sys\nimport threading\nimport time\n\nimport httpx\nimport uvicorn\n\nPORTS = {\"forecaster\": 8101, \"supplier\": 8102, \"planner\": 8103}\n\n\ndef start_agents(ports: dict = PORTS) -> dict:\n    \"\"\"Run each agent in its own uvicorn server thread (in production: separate containers).\"\"\"\n    urls = {k: f\"http://127.0.0.1:{p}\" for k, p in ports.items()}\n    os.environ.update(FORECASTER_URL=urls[\"forecaster\"], SUPPLIER_URL=urls[\"supplier\"], PLANNER_URL=urls[\"planner\"])\n    from . import forecaster, planner, supplier\n    for mod, key in ((forecaster, \"forecaster\"), (supplier, \"supplier\"), (planner, \"planner\")):\n        mod.CARD.url = urls[key]\n        server = uvicorn.Server(uvicorn.Config(mod.app, host=\"127.0.0.1\", port=ports[key], log_level=\"warning\"))\n        threading.Thread(target=server.run, daemon=True).start()\n    for u in urls.values():\n        for _ in range(100):\n            try:\n                if httpx.get(f\"{u}/health\", timeout=0.5).status_code == 200:\n                    break\n            except httpx.HTTPError:\n                time.sleep(0.05)\n    return urls\n\n\ndef main() -> None:\n    from common.llm import get_llm\n    from .a2a import A2AClient, artifact_data\n\n    urls = start_agents()\n    erp = A2AClient()\n    print(f\"LLM mode: {get_llm().mode}\\n\\nDiscovered agents:\")\n    for u in urls.values():\n        card = erp.discover(u)\n        print(f\"  {card.name:<18} {card.url:<24} skills={[s.id for s in card.skills]}\")\n\n    task = erp.send(urls[\"planner\"], {})\n    print(f\"\\nplanner task state: {task['status']['state']} - {task['status']['message']['parts'][0]['text']}\")\n    if task[\"status\"][\"state\"] == \"input-required\":\n        plan = artifact_data(task)[\"approval_request\"][\"plan\"]\n        print(f\"\\n{'SKU':<13}{'cover(wk)':>10}{'ROP':>7}{'pos':>7}{'order':>7}{'supplier':>15}{'$':>10}  status\")\n        for l in plan[\"lines\"]:\n            sup = l[\"supplier\"][\"supplier_id\"] if l[\"supplier\"] else \"-\"\n            print(f\"{l['sku']:<13}{l['weeks_of_cover']:>10}{l['reorder_point']:>7}{l['position']:>7}\"\n                  f\"{l['order_units']:>7}{sup:>15}{l['cost_usd']:>10,.0f}  {l['status']}\")\n        print(f\"total ${plan['total_usd']:,.0f} of ${plan['budget_usd']:,.0f} budget\")\n        decision = {\"approved\": \"--reject\" not in sys.argv, \"by\": \"supply-chain-lead-demo\",\n                    \"reason\": \"\" if \"--reject\" not in sys.argv else \"wait for Q4 contract pricing\"}\n        task = erp.send(urls[\"planner\"], {\"approval\": decision}, context_id=task[\"contextId\"], task_id=task[\"id\"])\n    out = artifact_data(task)\n    print(f\"\\nfinal state: {task['status']['state']}\")\n    for po in out[\"purchase_orders\"]:\n        print(f\"  {po['po']} {po['sku']:<12} {po['units']:>5} units from {po['supplier_id']:<13} \"\n              f\"${po['total_usd']:>9,.2f}  ETA {po['eta_weeks']} wk\")\n    print(f\"\\nnote: {out['note']}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"name": "Dockerfile", "lang": "dockerfile", "code": "# One image, three agents - the command picks which agent a container runs.\n# Build from the repository root:  docker build -f projects/inventory_planner/Dockerfile -t inventory-agents .\nFROM python:3.11-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY common/ common/\nCOPY data/inventory/ data/inventory/\nCOPY projects/inventory_planner/ projects/inventory_planner/\nRUN useradd -m app && mkdir -p runs && chown app runs\nUSER app\nENV PYTHONUNBUFFERED=1 AGENT=planner PORT=8103\nEXPOSE 8101 8102 8103\nHEALTHCHECK CMD python -c \"import os,urllib.request;urllib.request.urlopen(f'http://localhost:{os.environ[\\\"PORT\\\"]}/health')\"\nCMD [\"sh\", \"-c\", \"uvicorn projects.inventory_planner.${AGENT}:app --host 0.0.0.0 --port ${PORT}\"]\n"}], "folder": "projects/inventory_planner"}], "start": {"title": "Building Enterprise AI Agents — Complete Course System", "meta": {}, "html": "<p>A six-week, twelve-class program with runnable code. Every class has a lesson, a worked example, an architecture diagram, a process-flow diagram, code, and a lab. Four capstone projects in regulated and operational domains run through the course:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Capstone<\/th>\n<th>Domain<\/th>\n<th>Pattern<\/th>\n<th>Key techniques<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"#/project/clinical_prior_auth\">Clinical Prior-Authorization Assistant<\/a><\/td>\n<td>Healthcare<\/td>\n<td>LangGraph workflow + human review<\/td>\n<td>PHI redaction, policy RAG, LLM extraction → rules engine, physician-only denials, audit<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/project/legal_contract_review\">Legal Contract Review Agent<\/a><\/td>\n<td>Legal<\/td>\n<td>Map-reduce over clauses<\/td>\n<td>Playbook as code, parallel <code>Send<\/code>, redlines, counsel escalation, injection screening<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/project/aiops_agents\">AIOps Operations Agents<\/a><\/td>\n<td>IT operations<\/td>\n<td>Supervisor + 4 specialist agents<\/td>\n<td>Alert correlation, dependency-graph RCA, runbook RAG, change policy, approvals, postmortems<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/project/inventory_planner\">Inventory Planner<\/a><\/td>\n<td>Supply chain<\/td>\n<td>Peer agents over A2A<\/td>\n<td>Agent Cards, <code>input-required<\/code>, safety stock, budget allocation, Docker + Azure<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>All patients, contracts, telemetry and suppliers are <strong>synthetic<\/strong>. Nothing here is medical or legal advice.<\/p>\n<\/blockquote>\n<h2 id=\"s0\">Curriculum<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>Class<\/th>\n<th>Example domain<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Foundations<\/td>\n<td><a href=\"#/class/1\">1 Introduction to Agentic AI<\/a><\/td>\n<td>Clinical intake<\/td>\n<td>ReAct loop from scratch + LangGraph<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/2\">2 Prompt Engineering and Designing Agents<\/a><\/td>\n<td>Legal clauses<\/td>\n<td>Versioned prompts, structured output, DSPy<\/td>\n<\/tr>\n<tr>\n<td>2 Retrieval<\/td>\n<td><a href=\"#/class/3\">3 Embeddings and RAG<\/a><\/td>\n<td>Clinical policies<\/td>\n<td>Chunking, FAISS, grounded answers<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/4\">4 RAG Design<\/a><\/td>\n<td>Legal corpus<\/td>\n<td>Chroma, BM25, RRF, rerank, self-query, recall/MRR<\/td>\n<\/tr>\n<tr>\n<td>3 Tools &amp; Memory<\/td>\n<td><a href=\"#/class/5\">5 Tool Engineering<\/a><\/td>\n<td>AIOps<\/td>\n<td>Typed tools, validation, interrupts, idempotency<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/6\">6 Memory in Agents, MCP<\/a><\/td>\n<td>AIOps + clinical<\/td>\n<td>FastMCP server/client, checkpointer, long-term memory<\/td>\n<\/tr>\n<tr>\n<td>4 Evaluation<\/td>\n<td><a href=\"#/class/7\">7 Evaluating your Agent<\/a><\/td>\n<td>Clinical RAG + AIOps<\/td>\n<td>Eval harness, regression gate, trajectories, LangSmith/Opik<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/8\">8 Error Analysis, LLM as Judge<\/a><\/td>\n<td>Legal Q&amp;A<\/td>\n<td>Failure taxonomy, rubric judge, Cohen's κ<\/td>\n<\/tr>\n<tr>\n<td>5 Advanced<\/td>\n<td><a href=\"#/class/9\">9 Agentic RAG + Fine-tuning<\/a><\/td>\n<td>Clinical<\/td>\n<td>CRAG/Self-RAG graph, SFT/DPO data, NeMo LoRA<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/10\">10 Inference Optimization<\/a><\/td>\n<td>Mixed traffic<\/td>\n<td>Routing, semantic cache, context budgets, vLLM, load tests<\/td>\n<\/tr>\n<tr>\n<td>6 Production<\/td>\n<td><a href=\"#/class/11\">11 Observability and Guardrails<\/a><\/td>\n<td>Clinical PHI<\/td>\n<td>Tracing, OTel, layered guardrails<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><a href=\"#/class/12\">12 Case Study: Inventory Planner; A2A, Deployment, Change Management<\/a><\/td>\n<td>Supply chain<\/td>\n<td>A2A on the wire, Azure Container Apps, change kit<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"s1\">Quick start<\/h2>\n<pre><code class=\"language-bash\">python -m venv .venv &amp;&amp; source .venv/bin/activate\npip install -r requirements.txt\nmake test          # 19 tests\nmake classes       # every class example\nmake projects      # all four capstones\n<\/code><\/pre>\n<p><strong>Offline by default.<\/strong> With no <code>OPENAI_API_KEY<\/code>, every LLM call uses a deterministic fallback (rules, extractive answers, heuristic planners), so the whole course runs for free on a laptop. Set a key, or point <code>LLM_BASE_URL<\/code> at vLLM, Azure OpenAI or NVIDIA NIM, and the same code paths call real models. See <code>.env.example<\/code>.<\/p>\n<h2 id=\"s2\">Repository map<\/h2>\n<pre><code>common/          shared building blocks: LLM client, embeddings, retrieval, tools, memory, guardrails, tracing\ndata/            synthetic datasets: clinical policies + PA requests, contracts + playbook, telemetry + runbooks, inventory\nclasses/         12 lessons: README (concepts, diagrams, lab) + runnable examples\nprojects/        4 capstones: code, API, Dockerfile, README with architecture + process flow\ntests/           pytest suite covering the shared core, classes and capstones\nruns/            generated outputs: traces, evals, reports, postmortems, fine-tuning data (git-ignored)\n<\/code><\/pre>\n<h2 id=\"s3\">Architecture of the shared core<\/h2>\n<div class=\"mmd\" data-d=\"0\"><\/div>", "diagrams": ["flowchart LR\n    subgraph common [common/]\n        LLM[llm.py<br/>online / offline]\n        EMB[embeddings.py]\n        RET[retrieval.py<br/>chunk · FAISS · BM25 · RRF]\n        TL[tools.py<br/>schema · validate · approve · audit]\n        MEM[memory.py<br/>namespaced long-term memory]\n        GR[guardrails.py<br/>PHI · injection · policy · citations]\n        TR[tracing.py<br/>spans → JSONL / LangSmith / Opik]\n    end\n    RET --> EMB\n    CL[classes/] --> common\n    PR[projects/] --> common\n    LLM -->|OpenAI-compatible| EP[(OpenAI · Azure · vLLM · NIM)]"], "toc": ["Curriculum", "Quick start", "Repository map", "Architecture of the shared core"]}}</script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
const D = JSON.parse(document.getElementById('course-data').textContent);
const view = document.getElementById('view');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const chev = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const allTools = [...new Set(D.weeks.flatMap(w => w.tools))];
const weekOf = n => D.weeks.find(w => w.classes.includes(n));

/* ---------------------------------------------------------------- theme + mermaid */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
function tok(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function initMermaid(){
  if (!window.mermaid) return false;
  mermaid.initialize({
    startOnLoad:false, securityLevel:'strict', theme:'base',
    fontFamily:'IBM Plex Sans, system-ui, sans-serif',
    flowchart:{htmlLabels:true, curve:'basis', padding:10, useMaxWidth:false},
    sequence:{mirrorActors:false, useMaxWidth:true},
    themeVariables:{
      darkMode:isDark(), fontFamily:'IBM Plex Sans, system-ui, sans-serif', fontSize:'14px',
      background:tok('--surface'), primaryColor:tok('--accent-soft'), primaryBorderColor:tok('--accent'),
      primaryTextColor:tok('--ink'), secondaryColor:tok('--chip'), tertiaryColor:tok('--surface-2'),
      lineColor:tok('--muted'), textColor:tok('--ink'), mainBkg:tok('--accent-soft'), nodeBorder:tok('--accent'),
      clusterBkg:tok('--surface-2'), clusterBorder:tok('--line'), titleColor:tok('--ink'),
      edgeLabelBackground:tok('--surface'), actorBkg:tok('--accent-soft'), actorBorder:tok('--accent'),
      actorTextColor:tok('--ink'), signalColor:tok('--ink-2'), signalTextColor:tok('--ink'),
      labelBoxBkgColor:tok('--chip'), labelBoxBorderColor:tok('--line'), labelTextColor:tok('--ink'),
      loopTextColor:tok('--ink'), noteBkgColor:tok('--warn-soft'), noteTextColor:tok('--ink'),
      noteBorderColor:tok('--line'), activationBkgColor:tok('--chip'), sequenceNumberColor:tok('--accent-ink')
    }
  });
  return true;
}
let seq = 0, renderToken = 0;
async function renderDiagrams(root, diagrams){
  const token = ++renderToken;
  const ready = initMermaid();
  for (const el of root.querySelectorAll('.mmd')){
    const src = diagrams[+el.dataset.d];
    if (!ready){ el.innerHTML = '<pre class="mmd-src">'+esc(src)+'</pre>'; continue; }
    el.classList.add('loading');
    const id = 'mmd' + (++seq);
    try {
      const {svg} = await mermaid.render(id, src);
      if (token !== renderToken) return;
      el.innerHTML = svg;
    } catch (e) {
      el.innerHTML = '<pre class="mmd-src">'+esc(src)+'</pre>';
      document.getElementById('d'+id)?.remove();
    }
    el.classList.remove('loading');
  }
}

/* ---------------------------------------------------------------- code viewer */
function codeViewer(files){
  if (!files.length) return '';
  const tabs = files.map((f,i)=>`<button role="tab" id="ft${i}" aria-selected="${i===0}" data-i="${i}">${esc(f.name)}</button>`).join('');
  return `<h2 id="code-sec">Code</h2><p>Every file below is the real, runnable source from the repository.</p>
  <div class="codebox"><div class="ftabs" role="tablist" aria-label="Files">${tabs}</div>
  <div class="fhead"><span id="fname"></span><button class="btn" id="copy" type="button">Copy</button></div>
  <pre><code id="fcode"></code></pre></div>`;
}
function wireCode(files){
  const box = view.querySelector('.codebox'); if (!box) return;
  const code = box.querySelector('#fcode'), fname = box.querySelector('#fname');
  function show(i){
    const f = files[i];
    box.querySelectorAll('.ftabs button').forEach(b=>b.setAttribute('aria-selected', String(+b.dataset.i===i)));
    fname.textContent = f.name + ' · ' + f.code.split('\n').length + ' lines · ' + f.lang;
    code.className = 'language-' + f.lang;
    code.textContent = f.code;
    delete code.dataset.highlighted;
    try { window.hljs && hljs.highlightElement(code); } catch(e){}
    box.querySelector('pre').scrollTop = 0;
  }
  box.querySelector('.ftabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(+b.dataset.i); });
  box.querySelector('#copy').addEventListener('click', async e=>{
    const f = files[[...box.querySelectorAll('.ftabs button')].findIndex(b=>b.getAttribute('aria-selected')==='true')];
    try { await navigator.clipboard.writeText(f.code); e.target.textContent='Copied'; }
    catch(err){ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent='Selected, press Ctrl+C'; }
    setTimeout(()=>e.target.textContent='Copy', 1800);
  });
  show(0);
}

/* ---------------------------------------------------------------- views */
function curriculum(){
  const weeks = D.weeks.map((w,wi)=>{
    const cls = w.classes.map(n=>{
      const c = D.classes[n];
      return `<a class="cls" href="#/class/${n}"><span class="cn">Class ${n}</span><span class="ct">${esc(c.short)}</span><span class="cd">${esc(c.meta.domain||'')}</span><span class="go">Open lesson →</span></a>`;
    }).join('');
    return `<li class="week"><details class="wk" ${wi===0?'open':''}><summary>
      <span class="wk-n">Week ${w.n}</span><span class="wk-t">${esc(w.title)}</span><span class="wk-s">${esc(w.summary)}</span><span class="chev">${chev}</span></summary>
      <div class="wk-body"><div><p class="label">Classes</p><div class="cls-list">${cls}</div></div>
      <div><p class="label">Tools &amp; Frameworks</p><div class="tools">${w.tools.map(t=>`<span class="tool">${esc(t)}</span>`).join('')}</div></div></div>
      </details><span class="marker" aria-hidden="true">${w.n}</span></li>`;
  }).join('');
  view.innerHTML = `
  <section class="hero"><span class="eyebrow">Complete course program</span>
    <h1>Building Enterprise AI Agents</h1>
    <p class="lede">Six weeks from agent foundations to governed, observable, multi-agent systems in production. Every class ships with a lesson, a worked example, architecture and process-flow diagrams, and runnable code, built around four capstones in healthcare, legal, IT operations and supply chain.</p>
    <div class="stats"><span><b>6</b>weeks</span><span><b>12</b>classes</span><span><b>4</b>capstones</span><span><b>${allTools.length}</b>tools &amp; frameworks</span></div>
  </section>
  <div class="toolbar"><p>Click any week to expand the details, then open a class for the full lesson.</p><button class="btn" id="toggleAll" type="button">Expand all</button></div>
  <ol class="weeks" id="weeks">${weeks}</ol>
  <h2 class="sec-title">Capstone projects</h2><p class="sec-sub">Each capstone reuses techniques from several classes and runs end to end offline.</p>
  ${projectGrid()}
  <footer>All datasets are synthetic. Nothing on this site is medical or legal advice.</footer>`;
  const btn = document.getElementById('toggleAll'), list = document.getElementById('weeks');
  const all = () => [...list.querySelectorAll('details')];
  const sync = () => btn.textContent = all().every(d=>d.open) ? 'Collapse all' : 'Expand all';
  btn.onclick = () => { const o = !all().every(d=>d.open); all().forEach(d=>d.open=o); sync(); };
  list.addEventListener('toggle', sync, true); sync();
}
function projectGrid(){
  return `<div class="pgrid">${D.projects.map(p=>`<a class="pcard" href="#/project/${p.slug}"><span class="dom">${esc(p.domain)}</span><span class="pt">${esc(p.short)}</span><span class="pp">${esc(p.pattern)}</span><span class="pm">${esc(p.metric)}</span></a>`).join('')}</div>`;
}
function projects(){
  view.innerHTML = `<section class="hero"><span class="eyebrow">Capstones</span><h1>Four end-to-end agent systems</h1>
  <p class="lede">Healthcare, legal, IT operations and supply chain. Each capstone has an architecture diagram, a process flow, a REST API, a Dockerfile and a test suite.</p></section>${projectGrid()}`;
}
function docPage(doc, crumbs, headHtml, pager){
  const toc = doc.toc.map((t,i)=>`<button type="button" data-t="s${i}">${esc(t)}</button>`).join('') +
    (doc.files.length ? `<button type="button" data-t="code-sec">Code (${doc.files.length} files)</button>` : '');
  view.innerHTML = `<div class="crumbs">${crumbs}</div>
    <header class="doc-head">${headHtml}</header>
    <div class="layout"><nav class="toc" aria-label="On this page">${toc}</nav>
    <article class="prose">${doc.html}${codeViewer(doc.files)}
    <p class="note" style="margin-top:18px">Source folder: <code>${esc(doc.folder)}</code></p>${pager||''}</article></div>`;
  view.querySelector('.toc').addEventListener('click', e=>{
    const b = e.target.closest('button'); if (!b) return;
    document.getElementById(b.dataset.t)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
  });
  wireCode(doc.files);
  renderDiagrams(view, doc.diagrams);
}
function classPage(n){
  const c = D.classes[n]; if (!c) return notFound();
  const w = weekOf(n);
  const prev = D.classes[n-1], next = D.classes[n+1];
  const pager = `<div class="pager">${prev?`<a href="#/class/${n-1}"><small>← Class ${n-1}</small><span>${esc(prev.short)}</span></a>`:'<span></span>'}${next?`<a class="next" href="#/class/${n+1}"><small>Class ${n+1} →</small><span>${esc(next.short)}</span></a>`:`<a class="next" href="#/projects"><small>Next →</small><span>Capstone projects</span></a>`}</div>`;
  const head = `<span class="eyebrow">Week ${w.n} · Class ${n}</span><h1>${esc(c.short)}</h1>
    <div class="metarow"><span><span class="k">Domain</span>${esc(c.meta.domain||'')}</span></div>
    <div class="tools">${(c.meta.tools||[]).map(t=>`<span class="tool">${esc(t)}</span>`).join('')}</div>`;
  docPage(c, `<a href="#/curriculum">Curriculum</a><span>/</span><span>Week ${w.n}: ${esc(w.title)}</span>`, head, pager);
}
function projectPage(slug){
  const i = D.projects.findIndex(p=>p.slug===slug); if (i<0) return notFound();
  const p = D.projects[i], nx = D.projects[(i+1)%D.projects.length];
  const head = `<span class="eyebrow">Capstone ${i+1} · ${esc(p.domain)}</span><h1>${esc(p.title.replace(/^Capstone \d+ — /,''))}</h1>
    <div class="metarow"><span><span class="k">Pattern</span>${esc(p.pattern)}</span><span><span class="k">Result</span>${esc(p.metric)}</span></div>`;
  const pager = `<div class="pager"><a href="#/projects"><small>← All</small><span>Capstone projects</span></a><a class="next" href="#/project/${nx.slug}"><small>Next capstone →</small><span>${esc(nx.short)}</span></a></div>`;
  docPage(p, `<a href="#/projects">Capstones</a><span>/</span><span>${esc(p.short)}</span>`, head, pager);
}
function start(){
  const s = D.start;
  view.innerHTML = `<section class="hero"><span class="eyebrow">Get started</span><h1>Run the whole course on your laptop</h1>
    <p class="lede">The repository runs offline by default: deterministic fallbacks stand in for the LLM, so every example, capstone and test works without an API key. Add a key, or point to vLLM, Azure OpenAI or NVIDIA NIM, and the same code calls real models.</p></section>
    <p class="note">The full repository ships alongside this site as <code>agentic-ai-course.zip</code>.</p>
    <article class="prose">${s.html}</article>`;
  renderDiagrams(view, s.diagrams);
}
function notFound(){ view.innerHTML = `<section class="hero"><h1>Page not found</h1><p class="lede"><a href="#/curriculum">Back to the curriculum</a></p></section>`; }

/* ---------------------------------------------------------------- router */
let lastRoute = null;
function route(keepScroll){
  const h = location.hash.replace(/^#\/?/, '') || 'curriculum';
  const [a, b] = h.split('/');
  const tab = a === 'class' ? 'curriculum' : a === 'project' ? 'projects' : a;
  document.querySelectorAll('#tabs a').forEach(t=>{ if (t.dataset.tab===tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  if (a === 'class') classPage(+b);
  else if (a === 'project') projectPage(b);
  else if (a === 'projects') projects();
  else if (a === 'start') start();
  else curriculum();
  if (lastRoute !== null && !keepScroll) { window.scrollTo(0,0); view.focus({preventScroll:true}); }
  lastRoute = h;
}
window.addEventListener('hashchange', () => route(false));
route();

/* re-render diagrams when the theme changes */
function rerender(){ const y = window.scrollY; route(true); window.scrollTo(0, y); }
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch(e){}
new MutationObserver(rerender).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
})();
</script>
